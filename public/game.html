<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Небесный Ковчег · Живая команда</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    #ui-container {
      position: absolute;
      top: 20px;
      left: 20px;
      color: white;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(12px);
      padding: 15px 20px;
      border-radius: 20px;
      max-width: 300px;
      pointer-events: auto;
      box-shadow: 0 8px 30px rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.2);
      z-index: 10;
    }
    #resources {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(12px);
      padding: 15px 20px;
      border-radius: 20px;
      color: #ffd966;
      font-weight: bold;
      border: 1px solid rgba(255,255,255,0.2);
      z-index: 10;
    }
    .status-bar {
      margin: 8px 0;
      font-size: 14px;
    }
    .npc-status {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .needs {
      display: flex;
      gap: 6px;
      font-size: 12px;
    }
    .need {
      padding: 2px 8px;
      border-radius: 12px;
      background: rgba(255,255,255,0.15);
    }
    .chat-panel {
      position: absolute;
      bottom: 20px;
      left: 20px;
      right: 20px;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(12px);
      padding: 15px;
      border-radius: 20px;
      color: white;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 200px;
      border: 1px solid rgba(255,255,255,0.3);
      z-index: 10;
    }
    #chat-messages {
      flex: 1;
      overflow-y: auto;
      font-size: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 120px;
    }
    #chat-input-area {
      display: flex;
      gap: 10px;
    }
    #chat-input {
      flex: 1;
      padding: 10px;
      border-radius: 20px;
      border: none;
      background: rgba(255,255,255,0.2);
      color: white;
      font-size: 14px;
    }
    button {
      background: #ffaa00;
      border: none;
      padding: 10px 20px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
    }
    button:hover {
      background: #ffbb33;
    }
    #task-board {
      position: absolute;
      bottom: 240px;
      right: 20px;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(12px);
      padding: 12px;
      border-radius: 16px;
      color: white;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 10;
    }
    .task-btn {
      background: #4a4a8a;
      border: none;
      color: white;
      padding: 6px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div id="ui-container">
    <h3>👤 Команда</h3>
    <div id="npc-list"></div>
    <button id="load-model-btn" style="margin-top:10px; width:100%;">🧠 Загрузить ИИ-мозги</button>
    <div id="model-status" style="font-size:12px; margin-top:6px;"></div>
  </div>
  <div id="resources">
    <div>📦 Ресурсы для Ковчега</div>
    <div>🪵 Дерево: <span id="wood-count">0</span></div>
    <div>⛓️ Железо: <span id="iron-count">0</span></div>
    <div>🧵 Ткань: <span id="cloth-count">0</span></div>
    <div style="margin-top:8px;">🚀 Модули: <span id="modules-built">0</span>/4</div>
  </div>
  <div id="task-board">
    <div><strong>📋 Задачи</strong></div>
    <button class="task-btn" data-task="wood">🪵 Собрать дерево</button>
    <button class="task-btn" data-task="iron">⛓️ Добыть железо</button>
    <button class="task-btn" data-task="cloth">🧵 Соткать ткань</button>
    <button class="task-btn" data-task="rest">😴 Отдыхать</button>
    <div style="font-size:11px;">Выбери NPC и задачу</div>
  </div>
  <div class="chat-panel" id="chat-panel" style="display:none;">
    <div id="chat-messages"></div>
    <div id="chat-input-area">
      <input type="text" id="chat-input" placeholder="Скажи что-нибудь..." />
      <button id="send-btn">Отправить</button>
    </div>
    <div style="font-size:11px; color:#aaa;">Разговор с <span id="chat-target-name"></span></div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

    // --- WebLLM ---
    let chatEngine = null;
    let modelLoaded = false;
    const npcEngines = {};

    // --- Состояние игры ---
    const resources = { wood: 0, iron: 0, cloth: 0, modules: 0 };
    const npcs = [];
    let selectedNpc = null;
    let playerCharacter = null;
    
    const npcData = {
      bryak: { name: 'Бряк', role: 'Инженер', hunger: 80, fatigue: 80, mood: 80, color: 0x4488ff, pos: {x: -2, z: 1.5} },
      listik: { name: 'Листик', role: 'Травница', hunger: 80, fatigue: 80, mood: 80, color: 0x44aa44, pos: {x: 1.5, z: -1.5} },
      grom: { name: 'Гром', role: 'Охотник', hunger: 80, fatigue: 80, mood: 80, color: 0xaa4444, pos: {x: 2, z: 2} }
    };

    // --- Three.js инициализация ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);
    scene.fog = new THREE.Fog(0x87CEEB, 5, 30);
    
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.5, 50);
    camera.position.set(7, 6, 9);
    camera.lookAt(0, 0.5, 0);
    
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);
    
    const labelRenderer = new CSS2DRenderer();
    labelRenderer.setSize(window.innerWidth, window.innerHeight);
    labelRenderer.domElement.style.position = 'absolute';
    labelRenderer.domElement.style.top = '0px';
    labelRenderer.domElement.style.left = '0px';
    labelRenderer.domElement.style.pointerEvents = 'none';
    document.body.appendChild(labelRenderer.domElement);
    
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1, 0);
    controls.enableDamping = true;
    controls.maxPolarAngle = Math.PI/2.3;
    controls.minDistance = 4;
    controls.maxDistance = 15;
    controls.update();
    
    // Освещение
    scene.add(new THREE.AmbientLight(0x666688));
    const sun = new THREE.DirectionalLight(0xfff5e6, 1);
    sun.position.set(15, 20, 5);
    sun.castShadow = true;
    sun.receiveShadow = true;
    sun.shadow.mapSize.set(1024, 1024);
    scene.add(sun);
    
    // --- Мир ---
    const ground = new THREE.Mesh(new THREE.CircleGeometry(8, 64), new THREE.MeshStandardMaterial({ color: 0x5a8f4a, roughness: 0.8 }));
    ground.rotation.x = -Math.PI/2;
    ground.receiveShadow = true;
    scene.add(ground);
    
    const hangar = new THREE.Mesh(new THREE.BoxGeometry(4, 2.5, 3), new THREE.MeshStandardMaterial({ color: 0x8b7355, roughness: 0.7 }));
    hangar.position.set(-3, 1.25, -3);
    hangar.castShadow = true; hangar.receiveShadow = true;
    scene.add(hangar);
    
    const bench = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.8, 0.8), new THREE.MeshStandardMaterial({ color: 0xccaa88 }));
    bench.position.set(-2.5, 0.4, -1.8);
    bench.castShadow = true; bench.receiveShadow = true;
    scene.add(bench);
    
    const bed = new THREE.Mesh(new THREE.BoxGeometry(2, 0.4, 1), new THREE.MeshStandardMaterial({ color: 0xddccaa }));
    bed.position.set(2.5, 0.2, -2.5);
    bed.castShadow = true; bed.receiveShadow = true;
    scene.add(bed);
    
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.3, 2), new THREE.MeshStandardMaterial({ color: 0x8b5a2b }));
    trunk.position.set(-2.5, 1, 2.5);
    trunk.castShadow = true; trunk.receiveShadow = true;
    scene.add(trunk);
    const leaves = new THREE.Mesh(new THREE.SphereGeometry(0.9), new THREE.MeshStandardMaterial({ color: 0x2d5a27 }));
    leaves.position.set(-2.5, 2.2, 2.5);
    leaves.castShadow = true; leaves.receiveShadow = true;
    scene.add(leaves);
    for (let i=0; i<5; i++) {
      const apple = new THREE.Mesh(new THREE.SphereGeometry(0.1, 8), new THREE.MeshStandardMaterial({ color: 0xff3333 }));
      apple.position.set(-2.5 + (Math.random()-0.5)*0.8, 2.4 + Math.random()*0.4, 2.5 + (Math.random()-0.5)*0.8);
      apple.castShadow = true;
      scene.add(apple);
    }
    
    const chest = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.5, 0.5), new THREE.MeshStandardMaterial({ color: 0xaa7744 }));
    chest.position.set(3.5, 0.25, 1.5);
    chest.castShadow = true; chest.receiveShadow = true;
    scene.add(chest);
    
    // --- Создание детализированного персонажа ---
    function createDetailedCharacter(baseColor, name, isPlayer = false) {
      const group = new THREE.Group();
      const skin = new THREE.MeshStandardMaterial({ color: 0xffccaa, roughness: 0.3 });
      const cloth = new THREE.MeshStandardMaterial({ color: baseColor, roughness: 0.5 });
      const pants = new THREE.MeshStandardMaterial({ color: 0x2244aa, roughness: 0.5 });
      const shoes = new THREE.MeshStandardMaterial({ color: 0x332211, roughness: 0.6 });
      const hairMat = new THREE.MeshStandardMaterial({ color: 0x332211, roughness: 0.7 });
      const eyeWhite = new THREE.MeshStandardMaterial({ color: 0xffffff });
      const pupil = new THREE.MeshStandardMaterial({ color: 0x111122 });
      
      const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.4, 1.2, 8), cloth);
      torso.position.y = 0.6;
      torso.castShadow = true; torso.receiveShadow = true;
      group.add(torso);
      
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.35, 16, 16), skin);
      head.position.y = 1.35;
      head.castShadow = true; head.receiveShadow = true;
      group.add(head);
      
      const leftEye = new THREE.Mesh(new THREE.SphereGeometry(0.1, 8, 8), eyeWhite);
      leftEye.position.set(-0.13, 1.45, 0.32);
      group.add(leftEye);
      const rightEye = leftEye.clone();
      rightEye.position.set(0.13, 1.45, 0.32);
      group.add(rightEye);
      const leftPupil = new THREE.Mesh(new THREE.SphereGeometry(0.06, 6, 6), pupil);
      leftPupil.position.set(-0.13, 1.43, 0.38);
      group.add(leftPupil);
      const rightPupil = leftPupil.clone();
      rightPupil.position.set(0.13, 1.43, 0.38);
      group.add(rightPupil);
      
      const mouth = new THREE.Mesh(new THREE.TorusGeometry(0.1, 0.03, 8, 12, Math.PI), new THREE.MeshStandardMaterial({ color: 0x552222 }));
      mouth.position.set(0, 1.3, 0.33);
      mouth.rotation.x = 0.2;
      group.add(mouth);
      
      const hairPos = [[0, 1.68, 0.05], [0.18, 1.63, 0.15], [-0.18, 1.63, 0.15], [0.13, 1.65, -0.2], [-0.13, 1.65, -0.2], [0, 1.6, -0.25]];
      hairPos.forEach(p => {
        const hair = new THREE.Mesh(new THREE.SphereGeometry(0.1, 6, 6), hairMat);
        hair.position.set(p[0], p[1], p[2]);
        group.add(hair);
      });
      
      const armGroupL = new THREE.Group();
      const armGroupR = new THREE.Group();
      const upperArmGeo = new THREE.CylinderGeometry(0.1, 0.12, 0.6, 6);
      const forearmGeo = new THREE.CylinderGeometry(0.08, 0.1, 0.5, 6);
      const handGeo = new THREE.SphereGeometry(0.1, 6, 6);
      
      const leftUpper = new THREE.Mesh(upperArmGeo, cloth);
      leftUpper.position.y = -0.3;
      armGroupL.add(leftUpper);
      const leftFore = new THREE.Mesh(forearmGeo, skin);
      leftFore.position.y = -0.8;
      armGroupL.add(leftFore);
      const leftHand = new THREE.Mesh(handGeo, skin);
      leftHand.position.y = -1.1;
      armGroupL.add(leftHand);
      armGroupL.position.set(-0.55, 1.25, 0);
      group.add(armGroupL);
      
      const rightUpper = new THREE.Mesh(upperArmGeo, cloth);
      rightUpper.position.y = -0.3;
      armGroupR.add(rightUpper);
      const rightFore = new THREE.Mesh(forearmGeo, skin);
      rightFore.position.y = -0.8;
      armGroupR.add(rightFore);
      const rightHand = new THREE.Mesh(handGeo, skin);
      rightHand.position.y = -1.1;
      armGroupR.add(rightHand);
      armGroupR.position.set(0.55, 1.25, 0);
      group.add(armGroupR);
      
      const legGroupL = new THREE.Group();
      const legGroupR = new THREE.Group();
      const thighGeo = new THREE.CylinderGeometry(0.13, 0.15, 0.55, 6);
      const shinGeo = new THREE.CylinderGeometry(0.1, 0.13, 0.5, 6);
      const shoeGeo = new THREE.BoxGeometry(0.15, 0.1, 0.25);
      
      const leftThigh = new THREE.Mesh(thighGeo, pants);
      leftThigh.position.y = -0.25;
      legGroupL.add(leftThigh);
      const leftShin = new THREE.Mesh(shinGeo, pants);
      leftShin.position.y = -0.75;
      legGroupL.add(leftShin);
      const leftShoe = new THREE.Mesh(shoeGeo, shoes);
      leftShoe.position.y = -1.0;
      leftShoe.position.z = 0.06;
      legGroupL.add(leftShoe);
      legGroupL.position.set(-0.2, 0.0, 0);
      group.add(legGroupL);
      
      const rightThigh = new THREE.Mesh(thighGeo, pants);
      rightThigh.position.y = -0.25;
      legGroupR.add(rightThigh);
      const rightShin = new THREE.Mesh(shinGeo, pants);
      rightShin.position.y = -0.75;
      legGroupR.add(rightShin);
      const rightShoe = new THREE.Mesh(shoeGeo, shoes);
      rightShoe.position.y = -1.0;
      rightShoe.position.z = 0.06;
      legGroupR.add(rightShoe);
      legGroupR.position.set(0.2, 0.0, 0);
      group.add(legGroupR);
      
      const nameDiv = document.createElement('div');
      nameDiv.textContent = name;
      nameDiv.style.color = 'white';
      nameDiv.style.background = 'rgba(0,0,0,0.7)';
      nameDiv.style.padding = '2px 10px';
      nameDiv.style.borderRadius = '12px';
      nameDiv.style.fontSize = '12px';
      const label = new CSS2DObject(nameDiv);
      label.position.set(0, 2.1, 0);
      group.add(label);
      
      group.userData = { armL: armGroupL, armR: armGroupR, legL: legGroupL, legR: legGroupR };
      return group;
    }
    
    playerCharacter = createDetailedCharacter(0xffaa33, 'Ты (Артур)', true);
    playerCharacter.position.set(0, 0, 0);
    scene.add(playerCharacter);
    
    const bryak = createDetailedCharacter(npcData.bryak.color, npcData.bryak.name);
    bryak.position.set(npcData.bryak.pos.x, 0, npcData.bryak.pos.z);
    scene.add(bryak);
    npcs.push({ mesh: bryak, data: npcData.bryak, id: 'bryak' });
    
    const listik = createDetailedCharacter(npcData.listik.color, npcData.listik.name);
    listik.position.set(npcData.listik.pos.x, 0, npcData.listik.pos.z);
    scene.add(listik);
    npcs.push({ mesh: listik, data: npcData.listik, id: 'listik' });
    
    const grom = createDetailedCharacter(npcData.grom.color, npcData.grom.name);
    grom.position.set(npcData.grom.pos.x, 0, npcData.grom.pos.z);
    scene.add(grom);
    npcs.push({ mesh: grom, data: npcData.grom, id: 'grom' });
    
    // --- Управление игроком ---
    const keyState = {};
    window.addEventListener('keydown', (e) => { keyState[e.key] = true; });
    window.addEventListener('keyup', (e) => { keyState[e.key] = false; });
    
    // --- UI ---
    function updateUI() {
      document.getElementById('wood-count').textContent = resources.wood;
      document.getElementById('iron-count').textContent = resources.iron;
      document.getElementById('cloth-count').textContent = resources.cloth;
      document.getElementById('modules-built').textContent = resources.modules;
      
      const npcList = document.getElementById('npc-list');
      npcList.innerHTML = '';
      npcs.forEach(n => {
        const d = n.data;
        const div = document.createElement('div');
        div.className = 'status-bar npc-status';
        div.innerHTML = `<strong style="color:#${d.color.toString(16)}">${d.name}</strong> 
          <span class="needs"><span class="need">🍗${Math.round(d.hunger)}</span><span class="need">⚡${Math.round(d.fatigue)}</span><span class="need">😊${Math.round(d.mood)}</span></span>`;
        div.style.cursor = 'pointer';
        div.onclick = () => selectNPC(n);
        npcList.appendChild(div);
      });
    }
    
    function selectNPC(npc) {
      selectedNpc = npc;
      document.getElementById('chat-panel').style.display = 'flex';
      document.getElementById('chat-target-name').textContent = npc.data.name;
      document.getElementById('chat-messages').innerHTML = '';
    }
    
    document.getElementById('send-btn').addEventListener('click', async () => {
      if (!selectedNpc || !modelLoaded) {
        alert('Сначала загрузи ИИ-мозги и выбери персонажа.');
        return;
      }
      const input = document.getElementById('chat-input');
      const msg = input.value.trim();
      if (!msg) return;
      addChatMessage('Ты', msg);
      input.value = '';
      const response = await generateNPCResponse(selectedNpc.id, msg);
      addChatMessage(selectedNpc.data.name, response);
    });
    
    function addChatMessage(sender, text) {
      const div = document.createElement('div');
      div.innerHTML = `<strong>${sender}:</strong> ${text}`;
      document.getElementById('chat-messages').appendChild(div);
      div.scrollIntoView({ behavior: 'smooth' });
    }
    
    document.querySelectorAll('.task-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        if (!selectedNpc) { alert('Сначала выбери персонажа'); return; }
        assignTask(selectedNpc, btn.dataset.task);
      });
    });
    
    function assignTask(npc, task) {
      npc.data.currentTask = task;
      addChatMessage('Система', `${npc.data.name} получил задачу: ${task}`);
    }
    
    // --- Игровой цикл ---
    let lastTime = performance.now();
    
    function animateNPCs(deltaTime) {
      npcs.forEach(n => {
        const d = n.data;
        d.hunger = Math.max(0, d.hunger - 0.1 * deltaTime);
        d.fatigue = Math.max(0, d.fatigue - 0.06 * deltaTime);
        d.mood = Math.max(0, d.mood - 0.04 * deltaTime + (d.currentTask ? 0.1 : 0));
        
        const target = new THREE.Vector3();
        if (d.hunger < 30) target.set(-2.5, 0, 2.5);
        else if (d.fatigue < 30) target.set(2.5, 0, -2.5);
        else if (d.currentTask === 'wood') target.set(-2, 0, 1);
        else if (d.currentTask === 'iron') target.set(3, 0, -1);
        else if (d.currentTask === 'cloth') target.set(1, 0, 2);
        else target.copy(n.mesh.position);
        
        const dist = n.mesh.position.distanceTo(target);
        if (dist > 0.1) {
          const dir = target.clone().sub(n.mesh.position).normalize();
          n.mesh.position.add(dir.multiplyScalar(1.5 * deltaTime));
          n.mesh.lookAt(target.x, n.mesh.position.y, target.z);
        }
        
        if (d.currentTask === 'wood' && n.mesh.position.distanceTo(new THREE.Vector3(-2,0,1)) < 1.2) {
          if (Math.random() < 0.02) resources.wood += 1;
        }
        if (d.currentTask === 'iron' && n.mesh.position.distanceTo(new THREE.Vector3(3,0,-1)) < 1.2) {
          if (Math.random() < 0.02) resources.iron += 1;
        }
        if (d.currentTask === 'cloth' && n.mesh.position.distanceTo(new THREE.Vector3(1,0,2)) < 1.2) {
          if (Math.random() < 0.02) resources.cloth += 1;
        }
        if (d.hunger < 30 && n.mesh.position.distanceTo(new THREE.Vector3(-2.5,0,2.5)) < 1.2) {
          d.hunger = Math.min(100, d.hunger + 2);
        }
        if (d.fatigue < 30 && n.mesh.position.distanceTo(new THREE.Vector3(2.5,0,-2.5)) < 1.2) {
          d.fatigue = Math.min(100, d.fatigue + 2);
        }
        
        const speed = dist > 0.1 ? 1 : 0;
        if (n.mesh.userData.armL) {
          n.mesh.userData.armL.rotation.x = Math.sin(Date.now() * 0.01 + n.id.charCodeAt(0)) * 0.4 * speed;
          n.mesh.userData.armR.rotation.x = Math.sin(Date.now() * 0.01 + n.id.charCodeAt(0) + Math.PI) * 0.4 * speed;
          n.mesh.userData.legL.rotation.x = Math.sin(Date.now() * 0.01 + n.id.charCodeAt(0) + Math.PI/2) * 0.3 * speed;
          n.mesh.userData.legR.rotation.x = Math.sin(Date.now() * 0.01 + n.id.charCodeAt(0) - Math.PI/2) * 0.3 * speed;
        }
      });
    }
    
    function gameLoop() {
      const now = performance.now();
      const deltaTime = Math.min(0.05, (now - lastTime) / 1000);
      lastTime = now;
      
      const speed = 3 * deltaTime;
      if (keyState['ArrowUp']) playerCharacter.position.z -= speed;
      if (keyState['ArrowDown']) playerCharacter.position.z += speed;
      if (keyState['ArrowLeft']) playerCharacter.position.x -= speed;
      if (keyState['ArrowRight']) playerCharacter.position.x += speed;
      
      animateNPCs(deltaTime);
      updateUI();
      
      controls.target.copy(playerCharacter.position.clone().add(new THREE.Vector3(0, 1, 0)));
      controls.update();
      renderer.render(scene, camera);
      labelRenderer.render(scene, camera);
      requestAnimationFrame(gameLoop);
    }
    
    // --- WebLLM загрузка (ИСПРАВЛЕНО) ---
    document.getElementById('load-model-btn').addEventListener('click', async () => {
      const status = document.getElementById('model-status');
      status.textContent = 'Загрузка модели... (1-2 мин)';
      try {
        const { CreateMLCEngine } = await import('https://unpkg.com/@mlc-ai/web-llm@0.2.46/lib/index.js');
        // Гарантированная модель из официального списка
        const modelId = 'RedPajama-INCITE-Chat-3B-v1-q4f16_1-MLC';
        chatEngine = await CreateMLCEngine({ model: modelId });
        modelLoaded = true;
        status.textContent = `✅ Модель ${modelId} готова!`;
        for (let npc of npcs) npcEngines[npc.id] = chatEngine;
      } catch (e) {
        console.error(e);
        status.textContent = '❌ Ошибка: ' + e.message;
        try {
          status.textContent = 'Пробую Llama-3.2-1B...';
          const { CreateMLCEngine } = await import('https://unpkg.com/@mlc-ai/web-llm@0.2.46/lib/index.js');
          chatEngine = await CreateMLCEngine({ model: 'Llama-3.2-1B-Instruct-q4f16_1-MLC' });
          modelLoaded = true;
          status.textContent = '✅ Llama готова!';
          for (let npc of npcs) npcEngines[npc.id] = chatEngine;
        } catch (e2) {
          status.textContent = '❌ Все модели не загрузились. Попробуй обновить страницу.';
        }
      }
    });
    
    async function generateNPCResponse(npcId, userMessage) {
      if (!modelLoaded) return 'Модель не загружена.';
      const npc = npcs.find(n => n.id === npcId);
      const prompt = `Ты — ${npc.data.name}, ${npc.data.role}. Твои потребности: голод ${Math.round(npc.data.hunger)}%, усталость ${Math.round(npc.data.fatigue)}%, настроение ${Math.round(npc.data.mood)}%. Ты в команде по строительству летучего корабля. Ответь на реплику руководителя: "${userMessage}"`;
      try {
        const reply = await chatEngine.chat.completions.create({
          messages: [{ role: 'user', content: prompt }],
          max_tokens: 80
        });
        return reply.choices[0].message.content;
      } catch (e) {
        return '... (думает)';
      }
    }
    
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      labelRenderer.setSize(window.innerWidth, window.innerHeight);
    });
    
    // Старт
    lastTime = performance.now();
    gameLoop();
    console.log('🚀 Игра готова! Нажми "Загрузить ИИ-мозги".');
  </script>
</body>
</html>
