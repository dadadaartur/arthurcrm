<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Битва за Пирожок — 2D версия</title>
  <style>
    body { margin: 0; overflow: hidden; background: #2d5a27; font-family: Arial; }
    canvas { display: block; }
    #ui {
      position: absolute; top: 10px; left: 10px; color: white;
      background: rgba(0,0,0,0.5); padding: 8px 12px; border-radius: 8px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="ui">
    <div>🛡️ Союзников: <span id="ally-count">3</span></div>
    <div>💀 Врагов: <span id="enemy-count">3</span></div>
    <div>🎒 <span id="item-hold">Пусто</span></div>
    <div>Кликни по земле — идти, по врагу — атаковать (если есть предмет)</div>
  </div>
  <canvas id="game"></canvas>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    // Размеры
    const WIDTH = window.innerWidth;
    const HEIGHT = window.innerHeight;
    canvas.width = WIDTH;
    canvas.height = HEIGHT;

    // Конфигурация
    const GROQ_KEY = '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';
    const GROQ_MODEL = 'llama-3.3-70b-versatile';

    // ==================== ИГРОВЫЕ ОБЪЕКТЫ ====================
    const players = []; // все персонажи
    const items = [];   // все предметы на земле
    const projectiles = []; // летящие предметы

    // Класс персонажа
    class Character {
      constructor(name, team, x, y, isPlayer = false) {
        this.name = name;
        this.team = team; // 'ally' или 'enemy'
        this.x = x;
        this.y = y;
        this.radius = 20;
        this.speed = 2;
        this.isPlayer = isPlayer;
        this.heldItem = null;
        this.lastThrow = 0;
        this.stunned = false;
        this.stunTimer = 0;
        this.target = null; // цель движения
        this.attackTarget = null; // для атаки
        this.lastThink = 0;
        this.thought = '';
        this.thoughtTimer = 0;
      }

      draw() {
        ctx.save();
        // Тело
        ctx.fillStyle = this.team === 'ally' ? '#4488ff' : '#aa4444';
        if (this.isPlayer) ctx.fillStyle = '#ffaa33';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 2;
        ctx.stroke();
        // Глаза
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(this.x - 8, this.y - 8, 5, 0, Math.PI * 2);
        ctx.arc(this.x + 8, this.y - 8, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(this.x - 8, this.y - 8, 2, 0, Math.PI * 2);
        ctx.arc(this.x + 8, this.y - 8, 2, 0, Math.PI * 2);
        ctx.fill();
        // Рот
        ctx.strokeStyle = '#000';
        ctx.beginPath();
        ctx.arc(this.x, this.y - 2, 8, 0.1, Math.PI - 0.1);
        ctx.stroke();
        // Имя
        ctx.fillStyle = '#fff';
        ctx.font = '12px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(this.name, this.x, this.y - 30);
        // Предмет в руках
        if (this.heldItem) {
          ctx.fillStyle = this.heldItem.color;
          ctx.beginPath();
          ctx.arc(this.x + 20, this.y - 10, 6, 0, Math.PI * 2);
          ctx.fill();
        }
        // Мысль
        if (this.thought && Date.now() - this.thoughtTimer < 3000) {
          ctx.fillStyle = 'rgba(0,0,0,0.7)';
          ctx.fillRect(this.x - 40, this.y - 60, 80, 20);
          ctx.fillStyle = '#ff0';
          ctx.font = '10px Arial';
          ctx.fillText(this.thought, this.x, this.y - 47);
        }
        ctx.restore();
      }

      moveTo(targetX, targetY) {
        if (this.stunned) return;
        const dx = targetX - this.x;
        const dy = targetY - this.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 2) return false;
        const step = Math.min(this.speed, dist);
        this.x += (dx / dist) * step;
        this.y += (dy / dist) * step;
        return true;
      }

      pickUpItem() {
        if (this.heldItem) return;
        for (let i = items.length - 1; i >= 0; i--) {
          const item = items[i];
          const dx = this.x - item.x;
          const dy = this.y - item.y;
          if (Math.sqrt(dx * dx + dy * dy) < 30) {
            this.heldItem = item;
            items.splice(i, 1);
            break;
          }
        }
      }

      throwItem(power = 0.8) {
        if (!this.heldItem) return;
        if (Date.now() - this.lastThrow < 1500) return;
        this.lastThrow = Date.now();
        const item = this.heldItem;
        this.heldItem = null;
        // Цель – либо attackTarget, либо направление "вперёд"
        let targetX, targetY;
        if (this.attackTarget) {
          targetX = this.attackTarget.x;
          targetY = this.attackTarget.y;
          this.attackTarget = null;
        } else {
          // бросаем по направлению последнего движения
          targetX = this.x + (this.target ? (this.target.x - this.x) : 0) * 100;
          targetY = this.y + (this.target ? (this.target.y - this.y) : 0) * 100;
        }
        const dx = targetX - this.x;
        const dy = targetY - this.y;
        const dist = Math.sqrt(dx * dx + dy * dy) || 1;
        const speed = 8 * power;
        projectiles.push({
          x: this.x, y: this.y,
          vx: (dx / dist) * speed,
          vy: (dy / dist) * speed,
          color: item.color,
          radius: 6,
          life: 100
        });
      }
    }

    // Предмет
    class Item {
      constructor(x, y, type) {
        this.x = x;
        this.y = y;
        this.type = type;
        switch (type) {
          case 'stone': this.color = '#888888'; break;
          case 'apple': this.color = '#e74c3c'; break;
          case 'stick': this.color = '#8b5a2b'; break;
          default: this.color = '#6b4c3b'; break;
        }
      }
      draw() {
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, 6, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // ==================== СОЗДАНИЕ МИРА ====================
    function init() {
      // Союзники
      players.push(new Character('Артур', 'ally', 300, 300, true)); // игрок
      players.push(new Character('Бряк', 'ally', 200, 400));
      players.push(new Character('Листик', 'ally', 400, 200));
      players.push(new Character('Гром', 'ally', 150, 250));

      // Враги
      players.push(new Character('Зубан', 'enemy', 700, 500));
      players.push(new Character('Дылда', 'enemy', 800, 600));
      players.push(new Character('Шустря', 'enemy', 650, 700));

      // Предметы
      for (let i = 0; i < 40; i++) {
        const x = 100 + Math.random() * (WIDTH - 200);
        const y = 100 + Math.random() * (HEIGHT - 200);
        const type = ['stone','apple','stick','mud'][Math.floor(Math.random()*4)];
        items.push(new Item(x, y, type));
      }
    }

    // ==================== ЛОГИКА ИГРОКА ====================
    canvas.addEventListener('click', (e) => {
      const rect = canvas.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;

      const playerChar = players.find(p => p.isPlayer);
      if (!playerChar || playerChar.stunned) return;

      // Проверяем, попали ли во врага
      const enemies = players.filter(p => p.team === 'enemy' && !p.stunned);
      for (const enemy of enemies) {
        const dx = mouseX - enemy.x;
        const dy = mouseY - enemy.y;
        if (Math.sqrt(dx * dx + dy * dy) < enemy.radius + 10) {
          // Атакуем врага, если есть предмет
          if (playerChar.heldItem) {
            playerChar.attackTarget = enemy;
            playerChar.throwItem(0.9);
          }
          return;
        }
      }

      // Иначе идём в точку клика
      playerChar.target = { x: mouseX, y: mouseY };
    });

    // ==================== ИИ (простой, постоянно активен) ====================
    function basicAI(character) {
      if (character.stunned || character.isPlayer) return;

      const opponents = players.filter(p => p.team !== character.team && !p.stunned);
      if (opponents.length === 0) return;

      // Выбираем ближайшего противника
      let closest = opponents[0];
      let minDist = Infinity;
      opponents.forEach(o => {
        const d = Math.hypot(o.x - character.x, o.y - character.y);
        if (d < minDist) { minDist = d; closest = o; }
      });

      if (minDist < 50) {
        // Близко – атакуем
        if (!character.heldItem) character.pickUpItem();
        if (character.heldItem && Date.now() - character.lastThrow > 2000) {
          character.attackTarget = closest;
          character.throwItem(0.5 + Math.random() * 0.3);
        }
      } else {
        // Двигаемся к врагу
        character.moveTo(closest.x, closest.y);
      }
    }

    // ==================== ИИ ЧЕРЕЗ GROQ ====================
    async function advancedAI(character) {
      if (character.stunned || character.isPlayer) return;
      if (Date.now() - character.lastThink < 6000) return; // раз в 6 сек
      character.lastThink = Date.now();

      const team = character.team === 'ally' ? 'Храпоглазы' : 'Зубоскалы';
      const others = players.filter(p => p !== character).map(p => `${p.name}(${Math.round(p.x)},${Math.round(p.y)})`).join(', ');
      const prompt = `Ты ${character.name} (${team}). Позиция: (${Math.round(character.x)},${Math.round(character.y)}). Другие: ${others}. Что делаешь? Ответь кратко: "атакую Имя" или "иду к базе".`;
      try {
        const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${GROQ_KEY}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ model: GROQ_MODEL, messages: [{ role: 'user', content: prompt }], max_tokens: 20, temperature: 0.9 })
        });
        const data = await res.json();
        const text = data.choices?.[0]?.message?.content?.toLowerCase() || '';
        character.thought = text;
        character.thoughtTimer = Date.now();
        // Парсим команду
        if (text.includes('атакую')) {
          const name = text.split(' ').pop();
          const target = players.find(p => p.name.toLowerCase() === name && p.team !== character.team && !p.stunned);
          if (target) {
            character.target = { x: target.x, y: target.y };
            character.attackTarget = target;
          }
        } else if (text.includes('баз')) {
          // Идём в условную базу
          if (character.team === 'ally') character.target = { x: 200, y: 200 };
          else character.target = { x: 700, y: 600 };
        }
      } catch (e) {
        console.error('Ошибка Groq:', e);
      }
    }

    // ==================== ОБНОВЛЕНИЕ ИГРЫ ====================
    function update() {
      // Двигаем игрока, если есть цель
      const playerChar = players.find(p => p.isPlayer);
      if (playerChar && !playerChar.stunned && playerChar.target) {
        const reached = !playerChar.moveTo(playerChar.target.x, playerChar.target.y);
        if (reached) playerChar.target = null;
      }

      // ИИ для всех
      players.forEach(p => {
        if (p !== playerChar) {
          basicAI(p);
          advancedAI(p); // асинхронно
        }
      });

      // Обновляем снаряды
      for (let i = projectiles.length - 1; i >= 0; i--) {
        const p = projectiles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        // Попадание в персонажей
        const hit = players.find(char => {
          if (char.stunned) return false;
          const dx = char.x - p.x;
          const dy = char.y - p.y;
          return Math.sqrt(dx * dx + dy * dy) < char.radius + 5;
        });
        if (hit) {
          hit.stunned = true;
          hit.stunTimer = Date.now() + 1500;
          projectiles.splice(i, 1);
          continue;
        }
        if (p.life <= 0 || p.x < 0 || p.x > WIDTH || p.y < 0 || p.y > HEIGHT) {
          projectiles.splice(i, 1);
        }
      }

      // Снятие оглушения
      players.forEach(p => {
        if (p.stunned && Date.now() > p.stunTimer) p.stunned = false;
      });

      // Подбор предметов (автоматический для игрока тоже)
      if (playerChar && !playerChar.heldItem) playerChar.pickUpItem();
    }

    // ==================== ОТРИСОВКА ====================
    function draw() {
      ctx.clearRect(0, 0, WIDTH, HEIGHT);
      // Трава
      ctx.fillStyle = '#7ec850';
      ctx.fillRect(0, 0, WIDTH, HEIGHT);
      // Предметы
      items.forEach(item => item.draw());
      // Персонажи
      players.forEach(p => p.draw());
      // Снаряды
      projectiles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
      });
      // UI
      document.getElementById('ally-count').textContent = players.filter(p => p.team === 'ally' && !p.stunned).length;
      document.getElementById('enemy-count').textContent = players.filter(p => p.team === 'enemy' && !p.stunned).length;
      document.getElementById('item-hold').textContent = playerChar?.heldItem ? playerChar.heldItem.type : 'Пусто';
    }

    // ==================== ЗАПУСК ====================
    init();
    setInterval(() => {
      update();
      draw();
    }, 1000 / 60); // 60 FPS

    window.addEventListener('resize', () => {
      // Можно обновить размеры, но оставим как есть
    });
  </script>
</body>
</html>
