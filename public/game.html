<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Небесный Ковчег · Большой мир</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    #ui-top {
      position: absolute;
      top: 20px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      z-index: 10;
    }
    #team-panel {
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(10px);
      padding: 12px 18px;
      border-radius: 16px;
      color: white;
      pointer-events: auto;
      max-width: 280px;
      border: 1px solid rgba(255,255,255,0.2);
    }
    #resources-panel {
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(10px);
      padding: 12px 18px;
      border-radius: 16px;
      color: #ffd966;
      pointer-events: auto;
      font-weight: bold;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .npc-entry {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 6px 0;
      cursor: pointer;
      padding: 4px;
      border-radius: 8px;
      transition: background 0.2s;
    }
    .npc-entry:hover {
      background: rgba(255,255,255,0.15);
    }
    .need-bar {
      display: flex;
      gap: 4px;
      font-size: 11px;
      margin-left: auto;
    }
    .need-item {
      background: rgba(255,255,255,0.2);
      padding: 2px 6px;
      border-radius: 10px;
    }
    #chat-panel {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 500px;
      max-width: 90%;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(12px);
      padding: 12px;
      border-radius: 16px;
      color: white;
      display: flex;
      flex-direction: column;
      gap: 8px;
      border: 1px solid rgba(255,255,255,0.3);
      z-index: 10;
    }
    #chat-messages {
      max-height: 120px;
      overflow-y: auto;
      font-size: 13px;
    }
    #chat-input-row {
      display: flex;
      gap: 8px;
    }
    #chat-input {
      flex: 1;
      padding: 10px;
      border-radius: 20px;
      border: none;
      background: rgba(255,255,255,0.2);
      color: white;
    }
    button {
      background: #ffaa00;
      border: none;
      color: black;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
    }
    button:hover {
      background: #ffbb33;
    }
    #hint {
      position: absolute;
      bottom: 120px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.6);
      color: #ccc;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 12px;
      pointer-events: none;
      z-index: 5;
    }
  </style>
</head>
<body>
  <div id="ui-top">
    <div id="team-panel">
      <h3 style="margin:0 0 8px;">👥 Команда</h3>
      <div id="npc-list"></div>
      <div style="font-size:11px; margin-top:6px; color:#aaffaa;">⚡ ИИ: Groq (облако)</div>
    </div>
    <div id="resources-panel">
      <div>🪵 Дерево: <span id="wood-count">0</span></div>
      <div>⛓️ Железо: <span id="iron-count">0</span></div>
      <div>🧵 Ткань: <span id="cloth-count">0</span></div>
      <div style="margin-top:6px;">🚀 Модули: <span id="modules-built">0</span>/4</div>
    </div>
  </div>
  <div id="chat-panel" style="display:none;">
    <div style="display:flex; justify-content:space-between;">
      <span>💬 <span id="chat-target-name"></span></span>
      <span style="cursor:pointer;" id="close-chat">✖</span>
    </div>
    <div id="chat-messages"></div>
    <div id="chat-input-row">
      <input type="text" id="chat-input" placeholder="Твоё сообщение..." />
      <button id="send-btn">→</button>
    </div>
  </div>
  <div id="hint">🖱️ Кликни по персонажу для разговора | Стрелки/WASD — двигаться</div>

  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.128.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/" } }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

    const GROQ_API_KEY = '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';
    const GROQ_MODEL = 'llama-3.3-70b-versatile';

    // --- Карта и состояние ---
    const WORLD_SIZE = 20;
    const resources = { wood: 0, iron: 0, cloth: 0, modules: 0 };
    const npcs = [];
    let selectedNpc = null;
    let player;
    const keyState = {};

    // Начальные NPC — снижены потребности, чтобы сразу двигались
    const npcData = [
      { id:'bryak', name:'Бряк', role:'Инженер', hunger:45, fatigue:70, mood:70, color:0x4488ff, pos:{x:-4,z:3} },
      { id:'listik', name:'Листик', role:'Травница', hunger:55, fatigue:45, mood:65, color:0x44aa44, pos:{x:3,z:-4} },
      { id:'grom', name:'Гром', role:'Охотник', hunger:50, fatigue:60, mood:75, color:0xaa4444, pos:{x:5,z:5} }
    ];

    // Локации (мировые координаты)
    const locations = {
      appleOrchard: new THREE.Vector3(-8, 0, 7),
      restHouse: new THREE.Vector3(7, 0, -6),
      sawmill: new THREE.Vector3(-9, 0, -5),
      cave: new THREE.Vector3(8, 0, 8),
      meadow: new THREE.Vector3(-4, 0, -9),
      hangar: new THREE.Vector3(0, 0, 0) // центр, стройка
    };

    // --- Three.js ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);
    scene.fog = new THREE.Fog(0x87CEEB, 10, 35);
    const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.5, 60);
    camera.position.set(10, 8, 12);
    const renderer = new THREE.WebGLRenderer({ antialias:true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);
    const labelRenderer = new CSS2DRenderer();
    labelRenderer.setSize(innerWidth, innerHeight);
    labelRenderer.domElement.style.position = 'absolute';
    labelRenderer.domElement.style.top = '0'; labelRenderer.domElement.style.left = '0';
    labelRenderer.domElement.style.pointerEvents = 'none';
    document.body.appendChild(labelRenderer.domElement);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0,1,0);
    controls.enableDamping = true;
    controls.maxPolarAngle = Math.PI/2.3;
    controls.minDistance = 5;
    controls.maxDistance = 30;
    controls.update();

    scene.add(new THREE.AmbientLight(0x8899aa));
    const sun = new THREE.DirectionalLight(0xfff5e6, 1);
    sun.position.set(25, 30, 15);
    sun.castShadow = true; sun.receiveShadow = true;
    sun.shadow.mapSize.set(2048,2048);
    scene.add(sun);

    // --- Земля ---
    const groundTex = (()=>{
      const c=document.createElement('canvas');c.width=512;c.height=512;
      const ctx=c.getContext('2d');ctx.fillStyle='#5a8f4a';ctx.fillRect(0,0,512,512);
      for(let i=0;i<100;i++){ctx.fillStyle=Math.random()<0.3?'#4a7f3a':'#6a9f5a';ctx.fillRect(Math.random()*512,Math.random()*512,4,4);}
      return new THREE.CanvasTexture(c);
    })();
    const ground = new THREE.Mesh(new THREE.CircleGeometry(WORLD_SIZE,64), new THREE.MeshStandardMaterial({map:groundTex}));
    ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);

    // --- Объекты мира ---
    function addTree(x,z){const g=new THREE.Group();const t=new THREE.Mesh(new THREE.CylinderGeometry(0.2,0.3,2),new THREE.MeshStandardMaterial({color:0x8b5a2b}));t.position.y=1;g.add(t);const l=new THREE.Mesh(new THREE.SphereGeometry(0.8),new THREE.MeshStandardMaterial({color:0x2d5a27}));l.position.y=2.2;g.add(l);g.position.set(x,0,z);scene.add(g);}
    function addRock(x,z){const m=new THREE.Mesh(new THREE.SphereGeometry(0.5),new THREE.MeshStandardMaterial({color:0x888888,roughness:0.9}));m.position.set(x,0.25,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);}
    function addBuilding(x,z,color,w=1.5,h=2,d=1.5){
      const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color}));b.position.set(x,h/2,z);b.castShadow=true;b.receiveShadow=true;scene.add(b);
      const roof=new THREE.Mesh(new THREE.ConeGeometry(w*0.7,0.5,8),new THREE.MeshStandardMaterial({color:0xaa5533}));roof.position.set(x,h+0.25,z);roof.castShadow=true;scene.add(roof);
    }

    // Сад (яблони)
    for(let i=0;i<6;i++) addTree(locations.appleOrchard.x-2+Math.random()*4, locations.appleOrchard.z-2+Math.random()*4);
    addBuilding(locations.appleOrchard.x, locations.appleOrchard.z, 0x88aa44, 1.2,1.8,1.2);
    // Дом отдыха
    addBuilding(locations.restHouse.x, locations.restHouse.z, 0xaa8866, 1.8,2,1.8);
    // Лесопилка
    addBuilding(locations.sawmill.x, locations.sawmill.z, 0xccaa88, 2,2.2,2);
    for(let i=0;i<5;i++) addTree(locations.sawmill.x-1.5+Math.random()*3, locations.sawmill.z-1.5+Math.random()*3);
    // Пещера
    const caveEntrance=new THREE.Mesh(new THREE.CylinderGeometry(1.2,0.8,2,8,1,true),new THREE.MeshStandardMaterial({color:0x666666,side:THREE.DoubleSide}));
    caveEntrance.position.set(locations.cave.x,1,locations.cave.z); caveEntrance.rotation.x=Math.PI/2; scene.add(caveEntrance);
    addRock(locations.cave.x+1, locations.cave.z); addRock(locations.cave.x-0.5, locations.cave.z+1);
    // Луг (цветы)
    for(let i=0;i<20;i++){const f=new THREE.Mesh(new THREE.SphereGeometry(0.1),new THREE.MeshStandardMaterial({color:Math.random()*0xffffff}));f.position.set(locations.meadow.x-2+Math.random()*4,0.1,locations.meadow.z-2+Math.random()*4);scene.add(f);}
    // Ангар (центр)
    const hangar=new THREE.Mesh(new THREE.BoxGeometry(4,3,5),new THREE.MeshStandardMaterial({color:0x8b7355}));
    hangar.position.set(0,1.5,0); hangar.castShadow=true; hangar.receiveShadow=true; scene.add(hangar);

    // --- Персонажи ---
    function createCharacter(baseColor, name) {
      const group = new THREE.Group();
      const skin = new THREE.MeshStandardMaterial({ color:0xffccaa, roughness:0.3 });
      const cloth = new THREE.MeshStandardMaterial({ color:baseColor, roughness:0.5 });
      const pants = new THREE.MeshStandardMaterial({ color:0x2244aa });
      const shoes = new THREE.MeshStandardMaterial({ color:0x332211 });
      const hair = new THREE.MeshStandardMaterial({ color:0x332211 });
      group.add(new THREE.Mesh(new THREE.CylinderGeometry(0.35,0.4,1.2,8), cloth).translateY(0.6));
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.35,16,16), skin);
      head.position.y=1.35; group.add(head);
      const eyeW = new THREE.MeshStandardMaterial({color:0xffffff});
      group.add(new THREE.Mesh(new THREE.SphereGeometry(0.1),eyeW).translate(-0.13,1.45,0.32));
      group.add(new THREE.Mesh(new THREE.SphereGeometry(0.1),eyeW).translate(0.13,1.45,0.32));
      group.add(new THREE.Mesh(new THREE.SphereGeometry(0.06),new THREE.MeshStandardMaterial({color:0x111122})).translate(-0.13,1.43,0.38));
      group.add(new THREE.Mesh(new THREE.SphereGeometry(0.06),new THREE.MeshStandardMaterial({color:0x111122})).translate(0.13,1.43,0.38));
      const armL=new THREE.Group(),armR=new THREE.Group();
      const uaGeo=new THREE.CylinderGeometry(0.1,0.12,0.6,6),faGeo=new THREE.CylinderGeometry(0.08,0.1,0.5,6),hGeo=new THREE.SphereGeometry(0.1);
      armL.add(new THREE.Mesh(uaGeo,cloth).translateY(-0.3));
      armL.add(new THREE.Mesh(faGeo,skin).translateY(-0.8));
      armL.add(new THREE.Mesh(hGeo,skin).translateY(-1.1));
      armL.position.set(-0.55,1.25,0); group.add(armL);
      armR.add(new THREE.Mesh(uaGeo,cloth).translateY(-0.3));
      armR.add(new THREE.Mesh(faGeo,skin).translateY(-0.8));
      armR.add(new THREE.Mesh(hGeo,skin).translateY(-1.1));
      armR.position.set(0.55,1.25,0); group.add(armR);
      const legL=new THREE.Group(),legR=new THREE.Group();
      const tGeo=new THREE.CylinderGeometry(0.13,0.15,0.55,6),sGeo=new THREE.CylinderGeometry(0.1,0.13,0.5,6),shGeo=new THREE.BoxGeometry(0.15,0.1,0.25);
      legL.add(new THREE.Mesh(tGeo,pants).translateY(-0.25));
      legL.add(new THREE.Mesh(sGeo,pants).translateY(-0.75));
      legL.add(new THREE.Mesh(shGeo,shoes).translateY(-1.0).translateZ(0.06));
      legL.position.set(-0.2,0,0); group.add(legL);
      legR.add(new THREE.Mesh(tGeo,pants).translateY(-0.25));
      legR.add(new THREE.Mesh(sGeo,pants).translateY(-0.75));
      legR.add(new THREE.Mesh(shGeo,shoes).translateY(-1.0).translateZ(0.06));
      legR.position.set(0.2,0,0); group.add(legR);
      const label=new CSS2DObject(Object.assign(document.createElement('div'),{
        textContent:name, style:'color:white;background:rgba(0,0,0,0.7);padding:2px 8px;border-radius:10px;font-size:11px;'
      })); label.position.set(0,2.1,0); group.add(label);
      group.userData={armL,armR,legL,legR,label};
      return group;
    }

    player = createCharacter(0xffaa33, 'Ты');
    player.position.set(0,0,0);
    scene.add(player);

    npcData.forEach(d=>{
      const mesh = createCharacter(d.color, d.name);
      mesh.position.set(d.pos.x,0,d.pos.z);
      scene.add(mesh);
      npcs.push({...d, mesh, currentTask:null});
    });

    // --- Взаимодействие кликом ---
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    renderer.domElement.addEventListener('click', (e)=>{
      mouse.x = (e.clientX/renderer.domElement.clientWidth)*2-1;
      mouse.y = -(e.clientY/renderer.domElement.clientHeight)*2+1;
      raycaster.setFromCamera(mouse, camera);
      const meshes = npcs.map(n=>n.mesh);
      const intersects = raycaster.intersectObjects(meshes, true);
      if(intersects.length>0){
        const clicked = npcs.find(n=>n.mesh===intersects[0].object || n.mesh.children.includes(intersects[0].object));
        if(clicked) selectNPC(clicked);
      }
    });

    function selectNPC(npc){
      selectedNpc = npc;
      document.getElementById('chat-panel').style.display='flex';
      document.getElementById('chat-target-name').textContent=npc.name;
      document.getElementById('chat-messages').innerHTML='';
    }
    document.getElementById('close-chat').addEventListener('click',()=>{
      document.getElementById('chat-panel').style.display='none';
      selectedNpc=null;
    });

    // --- UI список ---
    function updateUI(){
      document.getElementById('wood-count').textContent=resources.wood;
      document.getElementById('iron-count').textContent=resources.iron;
      document.getElementById('cloth-count').textContent=resources.cloth;
      document.getElementById('modules-built').textContent=resources.modules;
      const list=document.getElementById('npc-list');
      list.innerHTML=npcs.map(n=>`<div class="npc-entry" data-id="${n.id}">
        <span style="color:#${n.color.toString(16)}">●</span> ${n.name}
        <span class="need-bar"><span class="need-item">🍗${Math.round(n.hunger)}</span><span class="need-item">⚡${Math.round(n.fatigue)}</span><span class="need-item">😊${Math.round(n.mood)}</span></span>
      </div>`).join('');
      document.querySelectorAll('.npc-entry').forEach(el=>{
        el.addEventListener('click',()=>{
          const npc=npcs.find(n=>n.id===el.dataset.id);
          if(npc) selectNPC(npc);
        });
      });
    }

    // --- Groq ---
    async function callGroq(messages){
      const res=await fetch('https://api.groq.com/openai/v1/chat/completions',{
        method:'POST',
        headers:{'Authorization':`Bearer ${GROQ_API_KEY}`,'Content-Type':'application/json'},
        body:JSON.stringify({model:GROQ_MODEL,messages,max_tokens:100,temperature:0.9})
      });
      if(!res.ok) throw new Error(res.status);
      const data=await res.json();
      return data.choices[0].message.content.trim();
    }

    document.getElementById('send-btn').addEventListener('click',async ()=>{
      if(!selectedNpc) return;
      const input=document.getElementById('chat-input');
      const msg=input.value.trim();
      if(!msg) return;
      addMessage('Ты',msg);
      input.value='';
      const sys=`Ты — ${selectedNpc.name}, ${selectedNpc.role}. Твои потребности: голод ${Math.round(selectedNpc.hunger)}%, усталость ${Math.round(selectedNpc.fatigue)}%, настроение ${Math.round(selectedNpc.mood)}%. Ты в команде строительства летучего корабля. Отвечай живо, коротко.`;
      try{
        const reply=await callGroq([{role:'system',content:sys},{role:'user',content:msg}]);
        addMessage(selectedNpc.name,reply);
      }catch(e){addMessage('Ошибка','ИИ не ответил.');}
    });

    function addMessage(sender,text){
      const div=document.createElement('div');
      div.innerHTML=`<b>${sender}:</b> ${text}`;
      document.getElementById('chat-messages').appendChild(div);
      div.scrollIntoView({behavior:'smooth'});
    }

    // --- Задачи (через UI можно добавить кнопки) ---
    window.addEventListener('keydown',e=>{keyState[e.key]=true;});
    window.addEventListener('keyup',e=>{keyState[e.key]=false;});

    // --- Игровой цикл ---
    let lastTime=performance.now();
    function animate(){
      const now=performance.now();
      const dt=Math.min(0.05,(now-lastTime)/1000);
      lastTime=now;

      // Движение игрока
      const spd=4*dt;
      if(keyState['ArrowUp']||keyState['w']) player.position.z-=spd;
      if(keyState['ArrowDown']||keyState['s']) player.position.z+=spd;
      if(keyState['ArrowLeft']||keyState['a']) player.position.x-=spd;
      if(keyState['ArrowRight']||keyState['d']) player.position.x+=spd;
      // Ограничение мира
      player.position.x=Math.max(-WORLD_SIZE+1,Math.min(WORLD_SIZE-1,player.position.x));
      player.position.z=Math.max(-WORLD_SIZE+1,Math.min(WORLD_SIZE-1,player.position.z));

      // NPC логика
      npcs.forEach(n=>{
        n.hunger=Math.max(0,n.hunger-0.08*dt);
        n.fatigue=Math.max(0,n.fatigue-0.05*dt);
        n.mood=Math.max(0,n.mood-0.03*dt+(n.currentTask?0.08:0));
        let target=null;
        if(n.hunger<30) target=locations.appleOrchard;
        else if(n.fatigue<30) target=locations.restHouse;
        else if(n.currentTask==='wood') target=locations.sawmill;
        else if(n.currentTask==='iron') target=locations.cave;
        else if(n.currentTask==='cloth') target=locations.meadow;
        else {
          // небольшое случайное блуждание
          if(!n._wanderTarget || n.mesh.position.distanceTo(n._wanderTarget)<0.2){
            n._wanderTarget=new THREE.Vector3((Math.random()-0.5)*6,0,(Math.random()-0.5)*6);
          }
          target=n._wanderTarget;
        }
        if(target){
          const dir=target.clone().sub(n.mesh.position);
          const dist=dir.length();
          if(dist>0.1){
            dir.normalize();
            n.mesh.position.add(dir.multiplyScalar(1.2*dt));
            n.mesh.lookAt(target.x,n.mesh.position.y,target.z);
          }
          // Добыча ресурсов
          if(n.currentTask==='wood' && n.mesh.position.distanceTo(locations.sawmill)<2 && Math.random()<0.03) resources.wood++;
          if(n.currentTask==='iron' && n.mesh.position.distanceTo(locations.cave)<2 && Math.random()<0.03) resources.iron++;
          if(n.currentTask==='cloth' && n.mesh.position.distanceTo(locations.meadow)<2 && Math.random()<0.03) resources.cloth++;
          if(n.hunger<30 && n.mesh.position.distanceTo(locations.appleOrchard)<2) n.hunger=Math.min(100,n.hunger+3);
          if(n.fatigue<30 && n.mesh.position.distanceTo(locations.restHouse)<2) n.fatigue=Math.min(100,n.fatigue+3);
        }
        // Анимация конечностей
        const spdAnim=n.mesh.position.distanceTo(target||n.mesh.position)>0.05?1:0;
        const t=Date.now()*0.01;
        if(n.mesh.userData.armL){
          n.mesh.userData.armL.rotation.x=Math.sin(t+n.id.charCodeAt(0))*0.5*spdAnim;
          n.mesh.userData.armR.rotation.x=Math.sin(t+n.id.charCodeAt(0)+Math.PI)*0.5*spdAnim;
          n.mesh.userData.legL.rotation.x=Math.sin(t+n.id.charCodeAt(0)+Math.PI/2)*0.4*spdAnim;
          n.mesh.userData.legR.rotation.x=Math.sin(t+n.id.charCodeAt(0)-Math.PI/2)*0.4*spdAnim;
        }
      });

      updateUI();
      controls.target.copy(player.position.clone().add(new THREE.Vector3(0,1,0)));
      controls.update();
      renderer.render(scene,camera);
      labelRenderer.render(scene,camera);
      requestAnimationFrame(animate);
    }
    animate();
    window.addEventListener('resize',()=>{
      camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
      renderer.setSize(innerWidth,innerHeight); labelRenderer.setSize(innerWidth,innerHeight);
    });
    console.log('🚀 Большой мир загружен!');
  </script>
</body>
</html>
