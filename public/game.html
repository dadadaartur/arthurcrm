<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Небесный Ковчег · Живой ИИ-мир</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
    #team-panel, #resources-panel {
      position: absolute; top: 20px; background: rgba(0,0,0,0.7); backdrop-filter: blur(10px);
      padding: 12px 18px; border-radius: 16px; color: white; z-index: 10; pointer-events: auto;
      border: 1px solid rgba(255,255,255,0.2);
    }
    #team-panel { left: 20px; max-width: 280px; }
    #resources-panel { right: 20px; color: #ffd966; font-weight: bold; }
    .npc-entry { display: flex; align-items: center; gap: 8px; margin: 6px 0; cursor: pointer; padding: 4px; border-radius: 8px; transition: background 0.2s; }
    .npc-entry:hover { background: rgba(255,255,255,0.15); }
    .need-bar { display: flex; gap: 4px; font-size: 11px; margin-left: auto; }
    .need-item { background: rgba(255,255,255,0.2); padding: 2px 6px; border-radius: 10px; }
    #chat-panel {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); width: 500px; max-width: 90%;
      background: rgba(0,0,0,0.8); backdrop-filter: blur(12px); padding: 12px; border-radius: 16px; color: white;
      display: none; flex-direction: column; gap: 8px; z-index: 10; border: 1px solid rgba(255,255,255,0.3);
    }
    #chat-messages { max-height: 120px; overflow-y: auto; font-size: 13px; }
    #chat-input-row { display: flex; gap: 8px; }
    #chat-input { flex: 1; padding: 10px; border-radius: 20px; border: none; background: rgba(255,255,255,0.2); color: white; }
    button { background: #ffaa00; border: none; color: black; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: bold; }
    button:hover { background: #ffbb33; }
    .task-btns { display: flex; gap: 6px; margin-top: 4px; }
    .task-btn { background: #4a4a8a; color: white; font-size: 12px; padding: 4px 10px; border-radius: 12px; cursor: pointer; }
    #hint { position: absolute; bottom: 130px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.6); color: #ccc; padding: 6px 16px; border-radius: 20px; font-size: 12px; z-index: 5; pointer-events: none; }
  </style>
</head>
<body>
  <div id="team-panel">
    <h3 style="margin:0 0 8px;">👥 Команда</h3>
    <div id="npc-list"></div>
    <div style="font-size:11px; margin-top:6px; color:#aaffaa;">🧠 ИИ управляет поведением</div>
  </div>
  <div id="resources-panel">
    <div>🪵 Дерево: <span id="wood-count">0</span></div>
    <div>⛓️ Железо: <span id="iron-count">0</span></div>
    <div>🧵 Ткань: <span id="cloth-count">0</span></div>
    <div>🚀 Модули: <span id="modules-built">0</span>/4</div>
  </div>
  <div id="chat-panel">
    <div style="display:flex; justify-content:space-between;">
      <span>💬 <span id="chat-target-name"></span></span>
      <span style="cursor:pointer;" id="close-chat">✖</span>
    </div>
    <div id="chat-messages"></div>
    <div class="task-btns">
      <span class="task-btn" data-task="wood">🪵 Рубить лес</span>
      <span class="task-btn" data-task="iron">⛓️ Добыть железо</span>
      <span class="task-btn" data-task="cloth">🧵 Собрать ткань</span>
      <span class="task-btn" data-task="rest">😴 Отдыхать</span>
    </div>
    <div id="chat-input-row">
      <input type="text" id="chat-input" placeholder="Твоё сообщение..." />
      <button id="send-btn">→</button>
    </div>
  </div>
  <div id="hint">🖱️ Кликни по персонажу для разговора | Стрелки/WASD — двигаться</div>

  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.128.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/" } }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

    const GROQ_API_KEY = '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';
    const GROQ_MODEL = 'llama-3.3-70b-versatile';

    const WORLD_SIZE = 18;
    const resources = { wood: 0, iron: 0, cloth: 0, modules: 0 };
    const npcs = [];
    let selectedNpc = null;
    let player;
    const keyState = {};
    let timeOfDay = 0; // 0-24 часа

    const npcData = [
      { id:'bryak', name:'Бряк', role:'Инженер', hunger:70, fatigue:70, mood:70, color:0x4488ff, pos:{x:-4,z:3} },
      { id:'listik', name:'Листик', role:'Травница', hunger:70, fatigue:70, mood:70, color:0x44aa44, pos:{x:3,z:-4} },
      { id:'grom', name:'Гром', role:'Охотник', hunger:70, fatigue:70, mood:70, color:0xaa4444, pos:{x:5,z:5} }
    ];

    const locations = {
      appleOrchard: new THREE.Vector3(-8, 0, 7),
      restHouse: new THREE.Vector3(7, 0, -6),
      sawmill: new THREE.Vector3(-9, 0, -5),
      cave: new THREE.Vector3(8, 0, 8),
      meadow: new THREE.Vector3(-4, 0, -9),
      lake: new THREE.Vector3(5, 0, -2),
      hangar: new THREE.Vector3(0, 0, 0)
    };

    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x1a1a3e, 15, 40);
    const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.5, 60);
    camera.position.set(10, 8, 12);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);
    const labelRenderer = new CSS2DRenderer();
    labelRenderer.setSize(innerWidth, innerHeight);
    labelRenderer.domElement.style.position = 'absolute';
    labelRenderer.domElement.style.top = '0'; labelRenderer.domElement.style.left = '0';
    labelRenderer.domElement.style.pointerEvents = 'none';
    document.body.appendChild(labelRenderer.domElement);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0,1,0);
    controls.enableDamping = true;
    controls.maxPolarAngle = Math.PI/2.3;
    controls.minDistance = 5;
    controls.maxDistance = 35;
    controls.update();

    const ambient = new THREE.AmbientLight(0x444466);
    scene.add(ambient);
    const sun = new THREE.DirectionalLight(0xffeebb, 0.9);
    sun.position.set(20, 25, 10);
    sun.castShadow = true; sun.receiveShadow = true;
    sun.shadow.mapSize.set(2048,2048);
    scene.add(sun);

    // Земля
    const groundTex = (()=>{
      const c=document.createElement('canvas'); c.width=512; c.height=512;
      const ctx=c.getContext('2d'); ctx.fillStyle='#4a6b3a'; ctx.fillRect(0,0,512,512);
      for(let i=0;i<500;i++){ ctx.fillStyle=Math.random()<0.3?'#3a5a2a':'#5a7a4a'; ctx.fillRect(Math.random()*512,Math.random()*512,3,3); }
      return new THREE.CanvasTexture(c);
    })();
    const ground = new THREE.Mesh(new THREE.CircleGeometry(WORLD_SIZE,64), new THREE.MeshStandardMaterial({map:groundTex}));
    ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);

    // Строим мир
    function addTree(x,z){const g=new THREE.Group();const t=new THREE.Mesh(new THREE.CylinderGeometry(0.2,0.3,2),new THREE.MeshStandardMaterial({color:0x8b5a2b}));t.position.y=1;g.add(t);const l=new THREE.Mesh(new THREE.SphereGeometry(0.9),new THREE.MeshStandardMaterial({color:0x2d5a27}));l.position.y=2.2;g.add(l);g.position.set(x,0,z);scene.add(g);}
    function addBush(x,z){const b=new THREE.Mesh(new THREE.SphereGeometry(0.3),new THREE.MeshStandardMaterial({color:0x336633}));b.position.set(x,0.15,z);scene.add(b);}
    function addBuilding(x,z,color,w=1.5,h=2,d=1.5){
      const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color}));b.position.set(x,h/2,z);b.castShadow=true;b.receiveShadow=true;scene.add(b);
      const roof=new THREE.Mesh(new THREE.ConeGeometry(w*0.7,0.5,8),new THREE.MeshStandardMaterial({color:0xaa5533}));roof.position.set(x,h+0.25,z);roof.castShadow=true;scene.add(roof);
    }
    // Озеро
    const lakeGeo = new THREE.CircleGeometry(2.5, 32);
    const lakeMat = new THREE.MeshStandardMaterial({ color: 0x3366aa, roughness: 0.2, transparent: true, opacity: 0.8 });
    const lakeMesh = new THREE.Mesh(lakeGeo, lakeMat);
    lakeMesh.rotation.x = -Math.PI/2;
    lakeMesh.position.set(locations.lake.x, 0.05, locations.lake.z);
    lakeMesh.receiveShadow = true;
    scene.add(lakeMesh);

    for(let i=0;i<8;i++) addTree(locations.appleOrchard.x-2+Math.random()*4, locations.appleOrchard.z-2+Math.random()*4);
    addBuilding(locations.appleOrchard.x, locations.appleOrchard.z, 0x88aa44, 1.2,1.8,1.2);
    addBuilding(locations.restHouse.x, locations.restHouse.z, 0xaa8866, 1.8,2,1.8);
    addBuilding(locations.sawmill.x, locations.sawmill.z, 0xccaa88, 2,2.2,2);
    for(let i=0;i<6;i++) addTree(locations.sawmill.x-1.5+Math.random()*3, locations.sawmill.z-1.5+Math.random()*3);
    const caveEntrance=new THREE.Mesh(new THREE.CylinderGeometry(1.2,0.8,2,8,1,true),new THREE.MeshStandardMaterial({color:0x666666,side:THREE.DoubleSide}));
    caveEntrance.position.set(locations.cave.x,1,locations.cave.z); caveEntrance.rotation.x=Math.PI/2; scene.add(caveEntrance);
    for(let i=0;i<10;i++) addBush(locations.meadow.x-2+Math.random()*4, locations.meadow.z-2+Math.random()*4);
    const hangar=new THREE.Mesh(new THREE.BoxGeometry(4,3,5),new THREE.MeshStandardMaterial({color:0x8b7355}));
    hangar.position.set(0,1.5,0); hangar.castShadow=true; hangar.receiveShadow=true; scene.add(hangar);
    // Костры
    const fireLight = new THREE.PointLight(0xff6600, 0.8, 8);
    fireLight.position.set(2, 1.5, -3);
    scene.add(fireLight);

    // Создание персонажа (как раньше)
    function createCharacter(baseColor, name) {
      const group = new THREE.Group();
      const skin = new THREE.MeshStandardMaterial({ color:0xffccaa, roughness:0.3 });
      const cloth = new THREE.MeshStandardMaterial({ color:baseColor, roughness:0.5 });
      const pants = new THREE.MeshStandardMaterial({ color:0x2244aa });
      const shoes = new THREE.MeshStandardMaterial({ color:0x332211 });
      const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.35,0.4,1.2,8), cloth);
      torso.position.y=0.6; group.add(torso);
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.35,16,16), skin);
      head.position.y=1.35; group.add(head);
      const eyeW = new THREE.MeshStandardMaterial({color:0xffffff});
      group.add(new THREE.Mesh(new THREE.SphereGeometry(0.1),eyeW).translate(-0.13,1.45,0.32));
      group.add(new THREE.Mesh(new THREE.SphereGeometry(0.1),eyeW).translate(0.13,1.45,0.32));
      group.add(new THREE.Mesh(new THREE.SphereGeometry(0.06),new THREE.MeshStandardMaterial({color:0x111122})).translate(-0.13,1.43,0.38));
      group.add(new THREE.Mesh(new THREE.SphereGeometry(0.06),new THREE.MeshStandardMaterial({color:0x111122})).translate(0.13,1.43,0.38));
      const armL=new THREE.Group(),armR=new THREE.Group();
      const uaGeo=new THREE.CylinderGeometry(0.1,0.12,0.6,6),faGeo=new THREE.CylinderGeometry(0.08,0.1,0.5,6),hGeo=new THREE.SphereGeometry(0.1);
      armL.add(new THREE.Mesh(uaGeo,cloth).translateY(-0.3)); armL.add(new THREE.Mesh(faGeo,skin).translateY(-0.8)); armL.add(new THREE.Mesh(hGeo,skin).translateY(-1.1));
      armL.position.set(-0.55,1.25,0); group.add(armL);
      armR.add(new THREE.Mesh(uaGeo,cloth).translateY(-0.3)); armR.add(new THREE.Mesh(faGeo,skin).translateY(-0.8)); armR.add(new THREE.Mesh(hGeo,skin).translateY(-1.1));
      armR.position.set(0.55,1.25,0); group.add(armR);
      const legL=new THREE.Group(),legR=new THREE.Group();
      const tGeo=new THREE.CylinderGeometry(0.13,0.15,0.55,6),sGeo=new THREE.CylinderGeometry(0.1,0.13,0.5,6),shGeo=new THREE.BoxGeometry(0.15,0.1,0.25);
      legL.add(new THREE.Mesh(tGeo,pants).translateY(-0.25)); legL.add(new THREE.Mesh(sGeo,pants).translateY(-0.75)); legL.add(new THREE.Mesh(shGeo,shoes).translateY(-1.0).translateZ(0.06));
      legL.position.set(-0.2,0,0); group.add(legL);
      legR.add(new THREE.Mesh(tGeo,pants).translateY(-0.25)); legR.add(new THREE.Mesh(sGeo,pants).translateY(-0.75)); legR.add(new THREE.Mesh(shGeo,shoes).translateY(-1.0).translateZ(0.06));
      legR.position.set(0.2,0,0); group.add(legR);
      const label=new CSS2DObject(Object.assign(document.createElement('div'),{
        textContent:name, style:'color:white;background:rgba(0,0,0,0.7);padding:2px 8px;border-radius:10px;font-size:11px;'
      })); label.position.set(0,2.1,0); group.add(label);
      // Облачко мыслей
      const thoughtDiv = document.createElement('div');
      thoughtDiv.style.cssText = 'color:#ff0;background:rgba(0,0,0,0.8);padding:4px 8px;border-radius:10px;font-size:10px;max-width:120px;display:none;';
      const thoughtLabel = new CSS2DObject(thoughtDiv);
      thoughtLabel.position.set(0, 2.5, 0);
      group.add(thoughtLabel);
      group.userData={armL,armR,legL,legR,label,thoughtLabel,thoughtDiv};
      return group;
    }

    player = createCharacter(0xffaa33, 'Ты');
    player.position.set(0,0,0);
    scene.add(player);

    npcData.forEach(d=>{
      const mesh = createCharacter(d.color, d.name);
      mesh.position.set(d.pos.x,0,d.pos.z);
      scene.add(mesh);
      npcs.push({...d, mesh, currentTask:null, lastThinkTime:0, plan:null, memory:[]});
    });

    // UI обновление
    function updateUI(){
      document.getElementById('wood-count').textContent=resources.wood;
      document.getElementById('iron-count').textContent=resources.iron;
      document.getElementById('cloth-count').textContent=resources.cloth;
      document.getElementById('modules-built').textContent=resources.modules;
      const list=document.getElementById('npc-list');
      list.innerHTML=npcs.map(n=>`<div class="npc-entry" data-id="${n.id}">
        <span style="color:#${n.color.toString(16)}">●</span> ${n.name}
        <span class="need-bar"><span class="need-item">🍗${Math.round(n.hunger)}</span><span class="need-item">⚡${Math.round(n.fatigue)}</span><span class="need-item">😊${Math.round(n.mood)}</span></span>
      </div>`).join('');
      document.querySelectorAll('.npc-entry').forEach(el=>{
        el.addEventListener('click',()=>{
          const n=npcs.find(x=>x.id===el.dataset.id);
          if(n) selectNPC(n);
        });
      });
    }

    function selectNPC(npc){
      selectedNpc = npc;
      document.getElementById('chat-panel').style.display='flex';
      document.getElementById('chat-target-name').textContent=npc.name;
      document.getElementById('chat-messages').innerHTML='';
    }
    document.getElementById('close-chat').addEventListener('click',()=>{
      document.getElementById('chat-panel').style.display='none';
      selectedNpc=null;
    });

    // Задачи через кнопки
    document.querySelectorAll('.task-btn').forEach(btn=>{
      btn.addEventListener('click',()=>{
        if(!selectedNpc) return;
        const task=btn.dataset.task;
        selectedNpc.currentTask=task;
        addMessage('Система', `${selectedNpc.name} получил задачу: ${task}`);
        // также можно отправить уведомление через мысли
        showThought(selectedNpc, `Задача: ${task}`);
      });
    });

    // Общение
    document.getElementById('send-btn').addEventListener('click',async ()=>{
      if(!selectedNpc) return;
      const input=document.getElementById('chat-input');
      const msg=input.value.trim();
      if(!msg) return;
      addMessage('Ты',msg);
      input.value='';
      const sys=`Ты — ${selectedNpc.name}, ${selectedNpc.role}. Твои потребности: голод ${Math.round(selectedNpc.hunger)}%, усталость ${Math.round(selectedNpc.fatigue)}%, настроение ${Math.round(selectedNpc.mood)}%. Ты в команде строительства летучего корабля. Отвечай живо, коротко.`;
      try{
        const reply=await callGroq([{role:'system',content:sys},{role:'user',content:msg}]);
        addMessage(selectedNpc.name,reply);
      }catch(e){addMessage('Ошибка','ИИ не ответил.');}
    });

    async function callGroq(messages){
      const res=await fetch('https://api.groq.com/openai/v1/chat/completions',{
        method:'POST',
        headers:{'Authorization':`Bearer ${GROQ_API_KEY}`,'Content-Type':'application/json'},
        body:JSON.stringify({model:GROQ_MODEL,messages,max_tokens:100,temperature:0.9})
      });
      if(!res.ok) throw new Error(res.status);
      const data=await res.json();
      return data.choices[0].message.content.trim();
    }

    function addMessage(sender,text){
      const div=document.createElement('div');
      div.innerHTML=`<b>${sender}:</b> ${text}`;
      document.getElementById('chat-messages').appendChild(div);
      div.scrollIntoView({behavior:'smooth'});
    }

    function showThought(npc, text){
      const td = npc.mesh.userData.thoughtDiv;
      td.textContent = text;
      td.style.display = 'block';
      setTimeout(()=>{ td.style.display = 'none'; }, 4000);
    }

    // Управление
    window.addEventListener('keydown',e=>{keyState[e.key]=true;});
    window.addEventListener('keyup',e=>{keyState[e.key]=false;});

    // Сердце игры: ИИ-мозги для NPC
    async function npcThink(npc){
      const now = performance.now()/1000;
      if(now - npc.lastThinkTime < 15) return; // думаем не чаще раза в 15 сек
      npc.lastThinkTime = now;
      // Собираем контекст
      const otherNpcs = npcs.filter(n=>n!==npc).map(n=>`${n.name}(${Math.round(n.hunger)}%🍗,${Math.round(n.fatigue)}%⚡) в позиции (${n.mesh.position.x.toFixed(1)},${n.mesh.position.z.toFixed(1)})`).join('; ');
      const locDescs = Object.entries(locations).map(([k,v])=>`${k}(${v.x.toFixed(0)},${v.z.toFixed(0)})`).join(', ');
      const prompt = `Ты — ${npc.name}, ${npc.role}. Твои потребности: голод ${Math.round(npc.hunger)}%, усталость ${Math.round(npc.fatigue)}%, настроение ${Math.round(npc.mood)}%.
Твоя текущая задача: ${npc.currentTask||'нет'}.
Другие персонажи: ${otherNpcs||'никого'}.
Локации: ${locDescs}.
Ты находишься в (${npc.mesh.position.x.toFixed(1)}, ${npc.mesh.position.z.toFixed(1)}).
Выбери одно действие: идти к [локация], говорить с [имя], работать над задачей, отдыхать, исследовать. Ответь кратко, например: "иду к яблоневому саду" или "поговорю с Листик".`;
      try{
        const decision = await callGroq([{role:'user',content:prompt}]);
        console.log(`${npc.name} решил: ${decision}`);
        showThought(npc, decision);
        // Парсим решение (очень простой парсинг)
        const d = decision.toLowerCase();
        if(d.includes('яблон')||d.includes('сад')) npc._goal = locations.appleOrchard;
        else if(d.includes('дом отдыха')||d.includes('отдых')) npc._goal = locations.restHouse;
        else if(d.includes('лесопилк')||d.includes('дерево')) npc._goal = locations.sawmill;
        else if(d.includes('пещер')||d.includes('железо')) npc._goal = locations.cave;
        else if(d.includes('луг')||d.includes('ткань')) npc._goal = locations.meadow;
        else if(d.includes('озер')) npc._goal = locations.lake;
        else if(d.includes('ангар')||d.includes('строит')) npc._goal = locations.hangar;
        else if(d.includes('говор')||d.includes('поговор')){
          const targetNpc = npcs.find(n=>d.includes(n.name.toLowerCase()));
          if(targetNpc) npc._goal = targetNpc.mesh.position.clone();
        }
        if(npc._goal) npc.currentTask = null; // сбрасываем задачу, если решил иначе
      }catch(e){ console.log('Ошибка мышления',e); }
    }

    // Игровой цикл
    let lastTime=performance.now();
    function animate(){
      const now=performance.now();
      const dt=Math.min(0.05,(now-lastTime)/1000);
      lastTime=now;

      // Смена дня/ночи
      timeOfDay += dt * 0.2; // 1 час = 5 сек
      if(timeOfDay>=24) timeOfDay-=24;
      const isNight = timeOfDay>20 || timeOfDay<5;
      scene.background = isNight ? new THREE.Color(0x111133) : new THREE.Color(0x87CEEB);
      ambient.intensity = isNight ? 0.3 : 0.6;
      sun.intensity = isNight ? 0.2 : 0.9;
      scene.fog = isNight ? new THREE.Fog(0x111133, 10, 35) : new THREE.Fog(0x87CEEB, 15, 40);

      // Игрок
      const spd=4*dt;
      if(keyState['ArrowUp']||keyState['w']) player.position.z-=spd;
      if(keyState['ArrowDown']||keyState['s']) player.position.z+=spd;
      if(keyState['ArrowLeft']||keyState['a']) player.position.x-=spd;
      if(keyState['ArrowRight']||keyState['d']) player.position.x+=spd;
      player.position.x=Math.max(-WORLD_SIZE+1,Math.min(WORLD_SIZE-1,player.position.x));
      player.position.z=Math.max(-WORLD_SIZE+1,Math.min(WORLD_SIZE-1,player.position.z));

      // NPC
      npcs.forEach(n=>{
        n.hunger=Math.max(0,n.hunger-0.06*dt);
        n.fatigue=Math.max(0,n.fatigue-0.04*dt);
        n.mood=Math.max(0,n.mood-0.02*dt+(n.currentTask?0.05:0));
        // Запускаем мышление
        npcThink(n);
        // Двигаемся к цели
        let target = n._goal;
        if(!target){
          if(n.hunger<25) target=locations.appleOrchard;
          else if(n.fatigue<25) target=locations.restHouse;
          else if(n.currentTask==='wood') target=locations.sawmill;
          else if(n.currentTask==='iron') target=locations.cave;
          else if(n.currentTask==='cloth') target=locations.meadow;
          else {
            if(!n._wanderTarget || n.mesh.position.distanceTo(n._wanderTarget)<0.2)
              n._wanderTarget=new THREE.Vector3((Math.random()-0.5)*10,0,(Math.random()-0.5)*10);
            target=n._wanderTarget;
          }
        }
        if(target){
          const dir=target.clone().sub(n.mesh.position);
          const dist=dir.length();
          if(dist>0.2){
            dir.normalize();
            n.mesh.position.add(dir.multiplyScalar(1.0*dt));
            n.mesh.lookAt(target.x,n.mesh.position.y,target.z);
          } else {
            n._goal = null; // достигли
          }
          if(n.currentTask==='wood' && n.mesh.position.distanceTo(locations.sawmill)<2 && Math.random()<0.05) resources.wood++;
          if(n.currentTask==='iron' && n.mesh.position.distanceTo(locations.cave)<2 && Math.random()<0.05) resources.iron++;
          if(n.currentTask==='cloth' && n.mesh.position.distanceTo(locations.meadow)<2 && Math.random()<0.05) resources.cloth++;
          if(n.hunger<25 && n.mesh.position.distanceTo(locations.appleOrchard)<2) n.hunger=Math.min(100,n.hunger+4);
          if(n.fatigue<25 && n.mesh.position.distanceTo(locations.restHouse)<2) n.fatigue=Math.min(100,n.fatigue+4);
        }
        const spdAnim=n.mesh.position.distanceTo(target||n.mesh.position)>0.1?1:0;
        const t=Date.now()*0.01;
        if(n.mesh.userData.armL){
          n.mesh.userData.armL.rotation.x=Math.sin(t+n.id.charCodeAt(0))*0.5*spdAnim;
          n.mesh.userData.armR.rotation.x=Math.sin(t+n.id.charCodeAt(0)+Math.PI)*0.5*spdAnim;
          n.mesh.userData.legL.rotation.x=Math.sin(t+n.id.charCodeAt(0)+Math.PI/2)*0.4*spdAnim;
          n.mesh.userData.legR.rotation.x=Math.sin(t+n.id.charCodeAt(0)-Math.PI/2)*0.4*spdAnim;
        }
      });

      updateUI();
      controls.target.copy(player.position.clone().add(new THREE.Vector3(0,1,0)));
      controls.update();
      renderer.render(scene,camera);
      labelRenderer.render(scene,camera);
      requestAnimationFrame(animate);
    }
    animate();
    window.addEventListener('resize',()=>{
      camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
      renderer.setSize(innerWidth,innerHeight); labelRenderer.setSize(innerWidth,innerHeight);
    });
  </script>
</body>
</html>
