<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Битва за Пирожок — Минимальная работающая версия</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    #crosshair {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 20px; height: 20px; pointer-events: none; z-index: 10;
    }
    #crosshair::before, #crosshair::after {
      content: ''; position: absolute; background: white;
    }
    #crosshair::before { width: 2px; height: 20px; left: 9px; top: 0; }
    #crosshair::after { width: 20px; height: 2px; left: 0; top: 9px; }
    .info {
      position: absolute; top: 20px; left: 20px; color: white;
      background: rgba(0,0,0,0.6); padding: 8px 15px; border-radius: 10px;
      font-family: monospace; z-index: 10;
    }
  </style>
</head>
<body>
  <div class="info">
    🎮 Управление: WASD + мышь | E — подобрать | Левая кнопка мыши (зажать-отпустить) — бросок
  </div>
  <div id="crosshair"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // ======================== НАСТРОЙКИ ========================
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);
    const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.5, 200);
    camera.position.set(0, 5, 8);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0x99bbff, 0.7));
    const sun = new THREE.DirectionalLight(0xfff5e6, 1);
    sun.position.set(30, 50, 20);
    sun.castShadow = true; sun.receiveShadow = true;
    sun.shadow.mapSize.set(1024, 1024);
    scene.add(sun);

    // Земля
    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(80, 64),
      new THREE.MeshStandardMaterial({ color: 0x6fbf4c })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // Несколько деревьев и кустов
    for (let i = 0; i < 30; i++) {
      const x = (Math.random() - 0.5) * 60;
      const z = (Math.random() - 0.5) * 60;
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.3, 2), new THREE.MeshStandardMaterial({ color: 0x8b5a2b }));
      trunk.position.set(x, 1, z);
      scene.add(trunk);
      const leaves = new THREE.Mesh(new THREE.SphereGeometry(1), new THREE.MeshStandardMaterial({ color: 0x2d5a27 }));
      leaves.position.set(x, 2.5, z);
      scene.add(leaves);
    }

    // Предметы для бросков
    const throwables = [];
    function addItem(x, z, type) {
      let geo, mat;
      switch (type) {
        case 'stone': geo = new THREE.SphereGeometry(0.2); mat = new THREE.MeshStandardMaterial({ color: 0x888888 }); break;
        case 'apple': geo = new THREE.SphereGeometry(0.22); mat = new THREE.MeshStandardMaterial({ color: 0xe74c3c }); break;
        default: geo = new THREE.SphereGeometry(0.2); mat = new THREE.MeshStandardMaterial({ color: 0xffffff }); break;
      }
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(x, 0.2, z);
      mesh.castShadow = true; mesh.receiveShadow = true;
      scene.add(mesh);
      throwables.push({ mesh, velocity: new THREE.Vector3(), holder: null });
    }
    for (let i = 0; i < 40; i++) {
      addItem((Math.random() - 0.5) * 50, (Math.random() - 0.5) * 50, Math.random() < 0.5 ? 'stone' : 'apple');
    }

    // ======================== ПЕРСОНАЖИ ========================
    function createCharacter(color, x, z) {
      const group = new THREE.Group();
      const body = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.4, 1.2, 8), new THREE.MeshStandardMaterial({ color }));
      body.position.y = 0.6; body.castShadow = true; group.add(body);
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.35, 8), new THREE.MeshStandardMaterial({ color: 0xffccaa }));
      head.position.y = 1.4; head.castShadow = true; group.add(head);
      // Глаза
      const eye = new THREE.Mesh(new THREE.SphereGeometry(0.1), new THREE.MeshStandardMaterial({ color: 0xffffff }));
      eye.position.set(-0.13, 1.5, 0.33); group.add(eye);
      const eye2 = eye.clone(); eye2.position.set(0.13, 1.5, 0.33); group.add(eye2);
      // Конечности
      const armL = new THREE.Group(), armR = new THREE.Group();
      const armGeo = new THREE.CylinderGeometry(0.08, 0.1, 0.8, 6);
      armL.add(new THREE.Mesh(armGeo, new THREE.MeshStandardMaterial({ color })).translateY(-0.4));
      armL.position.set(-0.55, 1.1, 0); group.add(armL);
      armR.add(new THREE.Mesh(armGeo, new THREE.MeshStandardMaterial({ color })).translateY(-0.4));
      armR.position.set(0.55, 1.1, 0); group.add(armR);

      group.position.set(x, 0, z);
      scene.add(group);
      group.userData = {
        stunned: false, heldItem: null, lastThrow: 0, lastPickup: 0,
        armL, armR, falling: false
      };
      return group;
    }

    const player = createCharacter(0xffaa33, -5, -5); // Артур
    const enemies = [
      createCharacter(0xaa4444, 15, 10),
      createCharacter(0xcc6644, 10, 15)
    ];

    // ======================== УПРАВЛЕНИЕ ========================
    const keys = {};
    window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; e.preventDefault(); });
    window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; e.preventDefault(); });
    let mouseX = 0, mouseY = 0;
    window.addEventListener('mousemove', e => { mouseX = e.movementX; mouseY = e.movementY; });
    renderer.domElement.addEventListener('click', () => renderer.domElement.requestPointerLock());
    document.addEventListener('pointerlockchange', () => {
      document.getElementById('crosshair').style.display = document.pointerLockElement ? 'block' : 'none';
    });

    let yaw = 0, pitch = 0;
    let throwStart = 0, isThrowing = false;
    window.addEventListener('mousedown', e => { if (e.button === 0) { isThrowing = true; throwStart = performance.now(); } });
    window.addEventListener('mouseup', e => {
      if (e.button === 0 && isThrowing) {
        const power = Math.min((performance.now() - throwStart) / 800, 1.0);
        throwItem(player, power);
        isThrowing = false;
      }
    });

    function pickUpItem(char) {
      if (char.userData.heldItem) return;
      let closest = null, minDist = 1.5;
      throwables.forEach(t => {
        if (t.holder) return;
        const d = char.position.distanceTo(t.mesh.position);
        if (d < minDist) { minDist = d; closest = t; }
      });
      if (closest) {
        char.userData.heldItem = closest;
        closest.holder = char;
        scene.remove(closest.mesh);
      }
    }

    function throwItem(char, power) {
      if (!char.userData.heldItem) return;
      const item = char.userData.heldItem;
      item.holder = null;
      char.userData.heldItem = null;
      item.mesh.position.copy(char.position.clone().add(new THREE.Vector3(0, 1.2, 0)));
      const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(char.quaternion);
      item.velocity.copy(dir.multiplyScalar(8 + power * 12));
      item.velocity.y = 4 + power * 6;
      scene.add(item.mesh);
      char.userData.lastThrow = performance.now() / 1000;
    }

    function stun(char, duration = 1500) {
      if (char.userData.stunned) return;
      char.userData.stunned = true; char.userData.falling = true;
      setTimeout(() => { char.userData.stunned = false; char.userData.falling = false; }, duration);
    }

    // ======================== ИИ ВРАГОВ ========================
    function updateEnemies() {
      enemies.forEach(enemy => {
        if (enemy.userData.stunned) return;
        const dist = enemy.position.distanceTo(player.position);
        const dir = player.position.clone().sub(enemy.position).normalize();
        if (dist > 2.5) {
          enemy.position.add(dir.multiplyScalar(0.06));
          enemy.lookAt(player.position.x, enemy.position.y, player.position.z);
        } else {
          if (!enemy.userData.heldItem) pickUpItem(enemy);
          if (enemy.userData.heldItem && performance.now() / 1000 - enemy.userData.lastThrow > 1.5) {
            throwItem(enemy, 0.6 + Math.random() * 0.2);
          }
        }
        // Анимация падения
        if (enemy.userData.falling) {
          enemy.userData.armL.rotation.z = Math.PI / 4;
          enemy.userData.armR.rotation.z = -Math.PI / 4;
          enemy.rotation.z = 0.2;
        } else {
          enemy.rotation.z = 0;
          enemy.userData.armL.rotation.z = 0;
          enemy.userData.armR.rotation.z = 0;
        }
      });
    }

    // ======================== ОСНОВНОЙ ЦИКЛ ========================
    function update() {
      // Игрок
      if (!player.userData.stunned) {
        if (keys['w']) player.position.z -= 0.1;
        if (keys['s']) player.position.z += 0.1;
        if (keys['a']) player.position.x -= 0.1;
        if (keys['d']) player.position.x += 0.1;
        if (keys['e']) { pickUpItem(player); keys['e'] = false; }
      }
      if (document.pointerLockElement) {
        yaw -= mouseX * 0.002;
        pitch -= mouseY * 0.002;
        pitch = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, pitch));
        mouseX = 0; mouseY = 0;
      }
      camera.position.set(
        player.position.x + Math.sin(yaw) * 5,
        player.position.y + 2.5,
        player.position.z + Math.cos(yaw) * 5
      );
      camera.lookAt(player.position.x, player.position.y + 1, player.position.z);
      player.rotation.y = yaw;

      // Враги
      updateEnemies();

      // Физика предметов
      for (let i = throwables.length - 1; i >= 0; i--) {
        const t = throwables[i];
        if (t.holder) continue;
        t.mesh.position.add(t.velocity.clone().multiplyScalar(0.16));
        t.velocity.y -= 0.25;
        if (t.mesh.position.y < 0.2) {
          t.mesh.position.y = 0.1;
          t.velocity.set(0, 0, 0);
        }
        // Попадание в игрока
        if (player !== t.holder && player.position.distanceTo(t.mesh.position) < 0.9 && t.velocity.length() > 0.5) {
          stun(player);
          t.velocity.set(0, 0, 0);
          scene.remove(t.mesh);
          throwables.splice(i, 1);
        }
        // Попадание во врагов
        enemies.forEach(e => {
          if (e === t.holder) return;
          if (e.position.distanceTo(t.mesh.position) < 0.9 && t.velocity.length() > 0.5) {
            stun(e);
            t.velocity.set(0, 0, 0);
            scene.remove(t.mesh);
            throwables.splice(i, 1);
          }
        });
      }

      // Анимация игрока
      if (player.userData.falling) {
        player.userData.armL.rotation.z = Math.PI / 4;
        player.userData.armR.rotation.z = -Math.PI / 4;
        player.rotation.z = 0.2;
      } else {
        player.rotation.z = 0;
        player.userData.armL.rotation.z = 0;
        player.userData.armR.rotation.z = 0;
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
