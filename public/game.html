<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Битва за Пирожок — Игра</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #000; }
    #ui {
      position: absolute; top: 20px; left: 20px; color: white;
      background: rgba(0,0,0,0.6); padding: 10px 16px; border-radius: 12px;
      pointer-events: none; z-index: 10;
    }
    #crosshair {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 20px; height: 20px; border: 2px solid white; border-radius: 50%;
      z-index: 10;
    }
    #power-bar {
      position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%);
      width: 200px; height: 10px; background: rgba(255,255,255,0.3); border-radius: 5px;
      display: none; z-index: 10;
    }
    #power-fill {
      height: 100%; background: #ffaa00; border-radius: 5px; width: 0%;
    }
    .thought {
      position: absolute; color: yellow; background: rgba(0,0,0,0.7); padding: 4px 8px;
      border-radius: 8px; font-size: 11px; pointer-events: none; z-index: 5;
    }
  </style>
</head>
<body>
  <div id="ui">
    <div>🛡️ Союзников: <span id="ally-count">3</span></div>
    <div>💀 Врагов: <span id="enemy-count">3</span></div>
    <div id="item-hold">🎒 Пусто</div>
    <div style="font-size:12px;margin-top:4px;">Кликни для захвата мыши | WASD — ходьба | E — подобрать | ЛКМ — бросок</div>
  </div>
  <div id="crosshair"></div>
  <div id="power-bar"><div id="power-fill"></div></div>
  <div id="thoughts" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:5;"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // ==================== НАСТРОЙКИ ====================
    const GROQ_KEY = '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';
    const GROQ_MODEL = 'llama-3.3-70b-versatile';

    // ==================== СЦЕНА ====================
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);
    scene.fog = new THREE.Fog(0x87CEEB, 30, 90);
    const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.5, 150);
    camera.position.set(0, 6, 10);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0x99bbff, 0.7));
    const sun = new THREE.DirectionalLight(0xfff5e6, 1);
    sun.position.set(40, 60, 30);
    sun.castShadow = true; sun.receiveShadow = true;
    scene.add(sun);

    // Земля
    const ground = new THREE.Mesh(new THREE.CircleGeometry(60, 64), new THREE.MeshStandardMaterial({ color: 0x7ec850 }));
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    // Деревья
    for (let i = 0; i < 50; i++) {
      const a = Math.random() * Math.PI * 2, r = 15 + Math.random() * 40;
      const tree = new THREE.Group();
      tree.add(new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.3, 2), new THREE.MeshStandardMaterial({ color: 0x8b5a2b })).translateY(1));
      tree.add(new THREE.Mesh(new THREE.SphereGeometry(1, 6), new THREE.MeshStandardMaterial({ color: 0x2d5a27 })).translateY(2.5));
      tree.position.set(Math.cos(a) * r, 0, Math.sin(a) * r);
      scene.add(tree);
    }

    // Предметы
    const throwables = [];
    function addItem(x, z, type) {
      let geo, mat;
      if (type === 'stone') { geo = new THREE.SphereGeometry(0.22); mat = new THREE.MeshStandardMaterial({ color: 0x888888 }); }
      else if (type === 'apple') { geo = new THREE.SphereGeometry(0.25); mat = new THREE.MeshStandardMaterial({ color: 0xe74c3c }); }
      else if (type === 'stick') { geo = new THREE.CylinderGeometry(0.1, 0.12, 0.5); mat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b }); }
      else { geo = new THREE.SphereGeometry(0.2); mat = new THREE.MeshStandardMaterial({ color: 0x6b4c3b }); }
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(x, 0.2, z);
      scene.add(mesh);
      throwables.push({ mesh, vel: new THREE.Vector3(), holder: null, type });
    }
    for (let i = 0; i < 80; i++) {
      const a = Math.random() * Math.PI * 2, r = 10 + Math.random() * 45;
      addItem(Math.cos(a) * r, Math.sin(a) * r, ['stone','apple','stick','mud'][Math.floor(Math.random()*4)]);
    }

    // ==================== ПЕРСОНАЖИ ====================
    const allies = [], enemies = [];
    const charToDiv = new Map();

    function createChar(name, color, pos, isPlayer = false) {
      const g = new THREE.Group();
      g.add(new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.4, 1.2, 8), new THREE.MeshStandardMaterial({ color })).translateY(0.6));
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.35, 8), new THREE.MeshStandardMaterial({ color: 0xffccaa }));
      head.position.y = 1.4; g.add(head);
      const eye = new THREE.Mesh(new THREE.SphereGeometry(0.1), new THREE.MeshStandardMaterial({ color: 0xffffff }));
      eye.position.set(-0.13, 1.5, 0.33); g.add(eye);
      g.add(eye.clone().translate(0.26, 0, 0));
      const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.05), new THREE.MeshStandardMaterial({ color: 0x111122 }));
      pupil.position.set(-0.13, 1.48, 0.4); g.add(pupil);
      g.add(pupil.clone().translate(0.26, 0, 0));
      g.add(new THREE.Mesh(new THREE.TorusGeometry(0.1, 0.03, 6, 12, Math.PI), new THREE.MeshStandardMaterial({ color: 0x552222 })).translate(0, 1.3, 0.35).rotateX(0.2));

      const armL = new THREE.Group(), armR = new THREE.Group();
      const armGeo = new THREE.CylinderGeometry(0.08, 0.1, 0.8, 6);
      armL.add(new THREE.Mesh(armGeo, new THREE.MeshStandardMaterial({ color })).translateY(-0.4));
      armL.position.set(-0.55, 1.1, 0); g.add(armL);
      armR.add(new THREE.Mesh(armGeo, new THREE.MeshStandardMaterial({ color })).translateY(-0.4));
      armR.position.set(0.55, 1.1, 0); g.add(armR);
      const legL = new THREE.Group(), legR = new THREE.Group();
      const legGeo = new THREE.CylinderGeometry(0.12, 0.14, 0.7, 6);
      legL.add(new THREE.Mesh(legGeo, new THREE.MeshStandardMaterial({ color: 0x2244aa })).translateY(-0.35));
      legL.position.set(-0.2, 0, 0); g.add(legL);
      legR.add(new THREE.Mesh(legGeo, new THREE.MeshStandardMaterial({ color: 0x2244aa })).translateY(-0.35));
      legR.position.set(0.2, 0, 0); g.add(legR);

      if (isPlayer) {
        g.add(new THREE.Mesh(new THREE.ConeGeometry(0.25, 0.3, 8), new THREE.MeshStandardMaterial({ color: 0xffaa33 })).translateY(1.75));
      }

      const div = document.createElement('div'); div.className = 'thought';
      document.getElementById('thoughts').appendChild(div);
      charToDiv.set(g, div);

      g.position.set(pos.x, 0, pos.z);
      scene.add(g);
      g.userData = { name, team: color, stunned: false, held: null, lastThrow: 0, lastPick: 0, armL, armR, legL, legR, goal: null, lastThink: 0, speed: 0.06, div };
      return g;
    }

    const player = createChar('Артур', 0xffaa33, new THREE.Vector3(-5, 0, -5), true);
    allies.push(player);
    allies.push(createChar('Бряк', 0x4488ff, new THREE.Vector3(-12, 0, -12)));
    allies.push(createChar('Листик', 0x44aa44, new THREE.Vector3(-8, 0, -16)));
    allies.push(createChar('Гром', 0xaa4444, new THREE.Vector3(-16, 0, -8)));
    enemies.push(createChar('Зубан', 0xcc6644, new THREE.Vector3(12, 0, 12)));
    enemies.push(createChar('Дылда', 0x6666aa, new THREE.Vector3(8, 0, 16)));
    enemies.push(createChar('Шустря', 0xaa88cc, new THREE.Vector3(16, 0, 8)));

    // ==================== УПРАВЛЕНИЕ (3-е лицо) ====================
    const keys = {};
    window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; e.preventDefault(); });
    window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; e.preventDefault(); });
    let yaw = 0, pitch = 0.3;
    window.addEventListener('mousemove', e => {
      if (document.pointerLockElement) {
        yaw -= e.movementX * 0.002;
        pitch -= e.movementY * 0.002;
        pitch = Math.max(-0.5, Math.min(1.0, pitch));
      }
    });
    renderer.domElement.addEventListener('click', () => renderer.domElement.requestPointerLock());

    let throwPower = 0, charging = false;
    window.addEventListener('mousedown', e => { if (e.button === 0 && document.pointerLockElement) { charging = true; throwPower = 0; } });
    window.addEventListener('mouseup', e => {
      if (e.button === 0 && charging && document.pointerLockElement) {
        throwItem(player, Math.min(throwPower / 1000, 1.0));
        charging = false;
        document.getElementById('power-bar').style.display = 'none';
      }
    });

    function pickUp(char) {
      if (char.userData.held) return;
      let closest = null, min = 1.8;
      throwables.forEach(t => { if (!t.holder) { const d = char.position.distanceTo(t.mesh.position); if (d < min) { min = d; closest = t; } } });
      if (closest) { char.userData.held = closest; closest.holder = char; scene.remove(closest.mesh); }
    }

    function throwItem(char, power) {
      if (!char.userData.held) return;
      const item = char.userData.held;
      item.holder = null; char.userData.held = null;
      item.mesh.position.copy(char.position).add(new THREE.Vector3(0, 1.2, 0));
      const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(char.quaternion);
      item.vel.copy(dir.multiplyScalar(7 + power * 10));
      item.vel.y = 4 + power * 6;
      scene.add(item.mesh);
      char.userData.lastThrow = performance.now() / 1000;
    }

    function stun(char) {
      if (char.userData.stunned) return;
      char.userData.stunned = true;
      setTimeout(() => { char.userData.stunned = false; }, 1500);
    }

    // ==================== БАЗОВЫЙ ИИ (всегда активен) ====================
    function basicAI(char) {
      if (char.userData.stunned) return;
      const opponents = (allies.includes(char) && char !== player) || char === player ? enemies : allies;
      if (!opponents.length) return;
      let target = null, minDist = Infinity;
      opponents.forEach(o => { const d = char.position.distanceTo(o.position); if (d < minDist) { minDist = d; target = o; } });
      if (!target) return;
      if (minDist > 2.5) {
        const dir = target.position.clone().sub(char.position).normalize();
        char.position.add(dir.multiplyScalar(char.userData.speed));
        char.lookAt(target.position.x, char.position.y, target.position.z);
        char.userData.legL.rotation.x = Math.sin(Date.now() * 0.02) * 0.5;
        char.userData.legR.rotation.x = -char.userData.legL.rotation.x;
      } else {
        if (!char.userData.held) pickUp(char);
        if (char.userData.held && performance.now() / 1000 - char.userData.lastThrow > 2) throwItem(char, 0.5);
      }
    }

    // ==================== ИИ ЧЕРЕЗ GROQ (меняет цели) ====================
    async function think(char) {
      if (char.userData.stunned || performance.now()/1000 - char.userData.lastThink < 8) return;
      char.userData.lastThink = performance.now()/1000;
      const team = allies.includes(char) ? 'Храпоглазы' : 'Зубоскалы';
      const others = [...allies, ...enemies].filter(c => c !== char).map(c => `${c.userData.name}(${c.position.x.toFixed(0)},${c.position.z.toFixed(0)})`).join(',');
      const prompt = `Ты ${char.userData.name} (${team}). Позиция: (${char.position.x.toFixed(0)},${char.position.z.toFixed(0)}). Другие: ${others}. Что делаешь? Ответь кратко: "атакую Имя" или "иду к базе".`;
      try {
        const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
          method: 'POST', headers: { 'Authorization': `Bearer ${GROQ_KEY}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ model: GROQ_MODEL, messages: [{ role: 'user', content: prompt }], max_tokens: 20 })
        });
        const data = await res.json();
        const text = data.choices?.[0]?.message?.content?.toLowerCase() || '';
        const div = charToDiv.get(char); if (div) { div.textContent = text; div.style.display = 'block'; setTimeout(() => div.style.display = 'none', 4000); }
        if (text.includes('атакую')) {
          const name = text.split(' ').pop();
          const target = [...allies, ...enemies].find(c => c.userData.name.toLowerCase() === name);
          if (target) char.userData.goal = { type: 'attack', target };
        }
      } catch(e) {}
    }

    // ==================== ЦИКЛ ====================
    function update() {
      if (!player.userData.stunned && document.pointerLockElement) {
        const spd = 0.1;
        const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion).setY(0).normalize();
        const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion).setY(0).normalize();
        if (keys['w']) player.position.add(forward.multiplyScalar(spd));
        if (keys['s']) player.position.add(forward.multiplyScalar(-spd));
        if (keys['a']) player.position.add(right.multiplyScalar(-spd));
        if (keys['d']) player.position.add(right.multiplyScalar(spd));
        if (keys['e']) { pickUp(player); keys['e'] = false; }
        player.lookAt(player.position.clone().add(forward));
      }
      // Камера
      const camDist = 5.5, camHeight = 2.5;
      const camTarget = player.position.clone().add(new THREE.Vector3(0, 1.2, 0));
      camera.position.copy(camTarget).add(new THREE.Vector3(Math.sin(yaw) * camDist, camHeight, Math.cos(yaw) * camDist));
      camera.lookAt(camTarget);

      // Зарядка броска
      if (charging) {
        throwPower += 16;
        document.getElementById('power-bar').style.display = 'block';
        document.getElementById('power-fill').style.width = Math.min(throwPower / 10, 100) + '%';
      }

      // ИИ
      allies.forEach(a => { if (a !== player) { basicAI(a); think(a); } });
      enemies.forEach(e => { basicAI(e); think(e); });

      // Физика снарядов
      for (let i = throwables.length-1; i >= 0; i--) {
        const t = throwables[i];
        if (t.holder) continue;
        t.mesh.position.add(t.vel.clone().multiplyScalar(0.16));
        t.vel.y -= 0.3;
        if (t.mesh.position.y < 0.15) { t.mesh.position.y = 0.15; t.vel.set(0,0,0); }
        const all = [player, ...allies, ...enemies];
        for (const c of all) {
          if (c === t.holder || c.userData.stunned) continue;
          if (c.position.distanceTo(t.mesh.position) < 1.0 && t.vel.length() > 0.5) {
            stun(c); t.vel.set(0,0,0); scene.remove(t.mesh); throwables.splice(i,1); break;
          }
        }
      }

      // UI
      document.getElementById('ally-count').textContent = allies.filter(a => !a.userData.stunned).length;
      document.getElementById('enemy-count').textContent = enemies.filter(e => !e.userData.stunned).length;
      document.getElementById('item-hold').textContent = player.userData.held ? '🎒 ' + player.userData.held.type : '🎒 Пусто';
    }

    function animate() { requestAnimationFrame(animate); update(); renderer.render(scene, camera); }
    animate();

    window.addEventListener('resize', () => { camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
  </script>
</body>
</html>
