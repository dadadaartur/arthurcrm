<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Битва за Пирожок · Живой ИИ</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #000; }
    #ui {
      position: absolute; top: 20px; left: 20px; color: white;
      background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); padding: 10px 15px;
      border-radius: 12px; pointer-events: none; z-index: 10;
    }
    #crosshair {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 24px; height: 24px; pointer-events: none; z-index: 10;
    }
    #crosshair::before, #crosshair::after {
      content: ''; position: absolute; background: rgba(255,255,255,0.9);
    }
    #crosshair::before { width: 2px; height: 24px; left: 11px; top: 0; }
    #crosshair::after { width: 24px; height: 2px; left: 0; top: 11px; }
    .hint {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.6); color: #ccc; padding: 6px 16px; border-radius: 20px;
      font-size: 12px; pointer-events: none; z-index: 10;
    }
    .thought-bubble {
      color: #ff0; background: rgba(0,0,0,0.8); padding: 4px 10px;
      border-radius: 12px; font-size: 11px; max-width: 150px;
      text-align: center; position: absolute; transform: translate(-50%, -100%);
      pointer-events: none; white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="ui">
    <div>🛡️ <span id="ally-count">4</span> союзников</div>
    <div>💀 <span id="enemy-count">4</span> врагов</div>
    <div id="item-indicator" style="margin-top:5px;">Пусто</div>
    <div id="commands" style="margin-top:8px; pointer-events:auto;">
      <button id="cmd-attack">⚔️ Атака</button>
      <button id="cmd-defend">🛡️ Защита</button>
      <button id="cmd-gather">🧺 Сбор</button>
    </div>
  </div>
  <div id="crosshair"></div>
  <div class="hint">Кликните для захвата мыши | WASD – движение | E – подобрать | Левая кнопка мыши (зажать+отпустить) – бросок</div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

    const GROQ_API_KEY = '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';
    const GROQ_MODEL = 'llama-3.3-70b-versatile';

    // --- Мир ---
    const WORLD_RADIUS = 120;
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);
    const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.5, 200);
    camera.position.set(0, 6, 10);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);
    const labelRenderer = new CSS2DRenderer();
    labelRenderer.setSize(innerWidth, innerHeight);
    labelRenderer.domElement.style.position = 'absolute';
    labelRenderer.domElement.style.top = '0';
    labelRenderer.domElement.style.left = '0';
    labelRenderer.domElement.style.pointerEvents = 'none';
    document.body.appendChild(labelRenderer.domElement);

    scene.add(new THREE.AmbientLight(0x99bbff, 0.7));
    const sun = new THREE.DirectionalLight(0xfff5e6, 1.1);
    sun.position.set(40, 70, 30);
    sun.castShadow = true; sun.receiveShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    scene.add(sun);

    // Земля
    const groundTex = (() => {
      const c = document.createElement('canvas'); c.width = 2048; c.height = 2048;
      const ctx = c.getContext('2d'); ctx.fillStyle = '#7ec850'; ctx.fillRect(0, 0, 2048, 2048);
      for (let i = 0; i < 8000; i++) {
        ctx.fillStyle = ['#5a9e3a', '#8ccf5a', '#f0e68c', '#ffb6c1', '#ffd700'][Math.floor(Math.random() * 5)];
        ctx.fillRect(Math.random() * 2048, Math.random() * 2048, 4, 4);
      }
      return new THREE.CanvasTexture(c);
    })();
    const ground = new THREE.Mesh(new THREE.CircleGeometry(WORLD_RADIUS, 128), new THREE.MeshStandardMaterial({ map: groundTex, roughness: 0.9 }));
    ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

    function addTree(x, z, s = 1) {
      const g = new THREE.Group();
      g.add(new THREE.Mesh(new THREE.CylinderGeometry(0.2 * s, 0.3 * s, 2.5 * s), new THREE.MeshStandardMaterial({ color: 0x8b5a2b })).translateY(1.25 * s));
      g.add(new THREE.Mesh(new THREE.SphereGeometry(1.2 * s, 16), new THREE.MeshStandardMaterial({ color: 0x2d5a27 })).translateY(2.8 * s));
      g.position.set(x, 0, z); scene.add(g);
    }
    function addBush(x, z, s = 0.5) {
      const b = new THREE.Mesh(new THREE.SphereGeometry(s, 8), new THREE.MeshStandardMaterial({ color: 0x336633 }));
      b.position.set(x, s * 0.4, z); scene.add(b);
    }
    function addPuddle(x, z) {
      const p = new THREE.Mesh(new THREE.CircleGeometry(0.8, 12), new THREE.MeshStandardMaterial({ color: 0x8b6b4d, roughness: 0.2 }));
      p.rotation.x = -Math.PI / 2; p.position.set(x, 0.02, z); scene.add(p);
    }
    function addBarrier(x, z, color = 0xaa7744, w = 1.4, h = 1.0, d = 0.5) {
      const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({ color }));
      b.position.set(x, h / 2, z); b.castShadow = true; b.receiveShadow = true; scene.add(b);
    }
    for (let i = 0; i < 200; i++) {
      const a = Math.random() * Math.PI * 2;
      const r = 15 + Math.random() * (WORLD_RADIUS - 20);
      const x = Math.cos(a) * r, z = Math.sin(a) * r;
      if (Math.random() < 0.6) addTree(x, z, 0.6 + Math.random() * 0.9);
      else if (Math.random() < 0.3) addBush(x, z, 0.3 + Math.random() * 0.7);
      else addPuddle(x, z);
    }
    addTree(0, 0, 2.8);
    for (let i = 0; i < 8; i++) addBarrier(-30 + i * 1.5, -25, 0x4488ff);
    for (let i = 0; i < 8; i++) addBarrier(25 + i * 1.5, 25, 0xaa4444);
    for (let i = -22; i <= 22; i += 1.3) {
      addBarrier(i, -2, 0xcccccc, 0.15, 1.2, 0.15);
      addBarrier(i, 2, 0xcccccc, 0.15, 1.2, 0.15);
      if (i % 3 < 1) addBarrier(i, 0, 0xcccccc, 1.2, 0.8, 0.4);
    }

    // Предметы
    const throwables = [];
    function createTexture(color1, color2, type) {
      const c = document.createElement('canvas'); c.width = 64; c.height = 64;
      const ctx = c.getContext('2d');
      if (type === 'stone') { ctx.fillStyle = color1; ctx.fillRect(0, 0, 64, 64); ctx.fillStyle = color2; for (let i = 0; i < 20; i++) ctx.fillRect(Math.random() * 64, Math.random() * 64, 3, 3); }
      else if (type === 'apple') { ctx.fillStyle = color1; ctx.beginPath(); ctx.arc(32, 32, 28, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = color2; ctx.beginPath(); ctx.arc(32, 28, 8, 0, Math.PI * 2); ctx.fill(); }
      else if (type === 'stick') { ctx.fillStyle = color1; ctx.fillRect(10, 20, 44, 14); ctx.fillStyle = color2; for (let i = 0; i < 10; i++) ctx.fillRect(12 + Math.random() * 40, 22 + Math.random() * 10, 2, 8); }
      else if (type === 'pumpkin') { ctx.fillStyle = color1; ctx.beginPath(); ctx.ellipse(32, 32, 28, 24, 0, 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = color2; ctx.lineWidth = 3; for (let i = 0; i < 8; i++) { ctx.beginPath(); ctx.moveTo(32, 10); ctx.lineTo(32, 54); ctx.stroke(); } }
      else if (type === 'watermelon') { ctx.fillStyle = color1; ctx.beginPath(); ctx.arc(32, 32, 28, 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = color2; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(32, 32, 28, 0, Math.PI * 2); ctx.stroke(); ctx.fillStyle = color1; ctx.beginPath(); ctx.arc(32, 32, 20, 0, Math.PI * 2); ctx.fill(); }
      else if (type === 'mud') { ctx.fillStyle = color1; ctx.beginPath(); ctx.arc(32, 32, 22, 0, Math.PI * 2); ctx.fill(); }
      return new THREE.CanvasTexture(c);
    }
    function addThrowable(x, z, type) {
      let mesh, size;
      switch (type) {
        case 'stone': mesh = new THREE.Mesh(new THREE.SphereGeometry(0.25), new THREE.MeshStandardMaterial({ map: createTexture('#888888', '#aaaaaa', 'stone') })); size = 0.25; break;
        case 'apple': mesh = new THREE.Mesh(new THREE.SphereGeometry(0.28), new THREE.MeshStandardMaterial({ map: createTexture('#e74c3c', '#c0392b', 'apple') })); size = 0.28; break;
        case 'stick': mesh = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.14, 0.6), new THREE.MeshStandardMaterial({ map: createTexture('#8b5a2b', '#5c3a1e', 'stick') })); size = 0.3; break;
        case 'pumpkin': mesh = new THREE.Mesh(new THREE.SphereGeometry(0.35), new THREE.MeshStandardMaterial({ map: createTexture('#ff8c00', '#cc7000', 'pumpkin') })); size = 0.35; break;
        case 'watermelon': mesh = new THREE.Mesh(new THREE.SphereGeometry(0.38), new THREE.MeshStandardMaterial({ map: createTexture('#2e8b57', '#1f6d3d', 'watermelon') })); size = 0.38; break;
        case 'mud': mesh = new THREE.Mesh(new THREE.SphereGeometry(0.24), new THREE.MeshStandardMaterial({ map: createTexture('#6b4c3b', '#4a3328', 'mud') })); size = 0.24; break;
      }
      mesh.position.set(x, size * 0.5, z); mesh.castShadow = true; mesh.receiveShadow = true;
      scene.add(mesh); throwables.push({ mesh, velocity: new THREE.Vector3(), holder: null, type });
    }
    ['stone', 'apple', 'stick', 'pumpkin', 'watermelon', 'mud'].forEach(type => {
      for (let i = 0; i < 25; i++) {
        const a = Math.random() * Math.PI * 2;
        const r = 10 + Math.random() * 90;
        addThrowable(Math.cos(a) * r, Math.sin(a) * r, type);
      }
    });

    // --- Персонажи ---
    const allies = [], enemies = [];
    function createCharacter(name, teamColor, features, pos, emotion = 'neutral') {
      const group = new THREE.Group();
      const skin = new THREE.MeshStandardMaterial({ color: features.skin || 0xffccaa, roughness: 0.3 });
      const cloth = new THREE.MeshStandardMaterial({ color: teamColor, roughness: 0.5 });
      const pants = new THREE.MeshStandardMaterial({ color: 0x2244aa });
      const shoes = new THREE.MeshStandardMaterial({ color: 0x332211 });
      const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.4, 1.2, 8), cloth); torso.position.y = 0.6; group.add(torso);
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.4, 20), skin); head.position.y = 1.4; group.add(head);
      const eW = new THREE.MeshStandardMaterial({ color: 0xffffff });
      const lE = new THREE.Mesh(new THREE.SphereGeometry(0.11), eW); lE.position.set(-0.15, 1.53, 0.35); group.add(lE);
      const rE = lE.clone(); rE.position.set(0.15, 1.53, 0.35); group.add(rE);
      const pM = new THREE.MeshStandardMaterial({ color: features.eyeColor || 0x111122 });
      const lP = new THREE.Mesh(new THREE.SphereGeometry(0.06), pM); lP.position.set(-0.15, 1.51, 0.42); group.add(lP);
      const rP = lP.clone(); rP.position.set(0.15, 1.51, 0.42); group.add(rP);
      const browMat = new THREE.MeshStandardMaterial({ color: 0x332211 });
      const lB = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.05, 0.05), browMat); lB.position.set(-0.15, 1.68, 0.35); group.add(lB);
      const rB = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.05, 0.05), browMat); rB.position.set(0.15, 1.68, 0.35); group.add(rB);
      const mouth = new THREE.Mesh(new THREE.TorusGeometry(0.12, 0.04, 8, 16, Math.PI), new THREE.MeshStandardMaterial({ color: 0x552222 }));
      mouth.position.set(0, 1.35, 0.38); mouth.rotation.x = 0.2; group.add(mouth);
      if (features.hair) features.hair.forEach(p => { const h = new THREE.Mesh(new THREE.SphereGeometry(0.12), new THREE.MeshStandardMaterial({ color: 0x332211 })); h.position.set(p[0], p[1], p[2]); group.add(h); });
      if (features.hat) { const hat = new THREE.Mesh(new THREE.ConeGeometry(0.25, 0.3, 8), new THREE.MeshStandardMaterial({ color: features.hatColor })); hat.position.set(0, 1.78, 0); group.add(hat); }
      if (features.glasses) { const f = new THREE.Mesh(new THREE.TorusGeometry(0.15, 0.04, 8, 16), new THREE.MeshStandardMaterial({ color: 0x000000 })); f.position.set(-0.15, 1.53, 0.42); group.add(f); const f2 = f.clone(); f2.position.set(0.15, 1.53, 0.42); group.add(f2); }
      if (features.crown) { const c = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.25, 0.25, 8), new THREE.MeshStandardMaterial({ color: 0xffdd44 })); c.position.set(0, 1.7, 0); group.add(c); }
      const armL = new THREE.Group(), armR = new THREE.Group();
      const uG = new THREE.CylinderGeometry(0.1, 0.12, 0.6, 6), fG = new THREE.CylinderGeometry(0.08, 0.1, 0.5, 6), hG = new THREE.SphereGeometry(0.1);
      armL.add(new THREE.Mesh(uG, cloth).translateY(-0.3)); armL.add(new THREE.Mesh(fG, skin).translateY(-0.8)); armL.add(new THREE.Mesh(hG, skin).translateY(-1.1)); armL.position.set(-0.58, 1.25, 0); group.add(armL);
      armR.add(new THREE.Mesh(uG, cloth).translateY(-0.3)); armR.add(new THREE.Mesh(fG, skin).translateY(-0.8)); armR.add(new THREE.Mesh(hG, skin).translateY(-1.1)); armR.position.set(0.58, 1.25, 0); group.add(armR);
      const legL = new THREE.Group(), legR = new THREE.Group();
      const tG = new THREE.CylinderGeometry(0.13, 0.15, 0.55, 6), sG = new THREE.CylinderGeometry(0.1, 0.13, 0.5, 6), shG = new THREE.BoxGeometry(0.15, 0.1, 0.25);
      legL.add(new THREE.Mesh(tG, pants).translateY(-0.25)); legL.add(new THREE.Mesh(sG, pants).translateY(-0.75)); legL.add(new THREE.Mesh(shG, shoes).translateY(-1.0).translateZ(0.06)); legL.position.set(-0.2, 0, 0); group.add(legL);
      legR.add(new THREE.Mesh(tG, pants).translateY(-0.25)); legR.add(new THREE.Mesh(sG, pants).translateY(-0.75)); legR.add(new THREE.Mesh(shG, shoes).translateY(-1.0).translateZ(0.06)); legR.position.set(0.2, 0, 0); group.add(legR);
      const nameLabel = new CSS2DObject(Object.assign(document.createElement('div'), { textContent: name, style: 'color:white; background:rgba(0,0,0,0.7); padding:2px 8px; border-radius:10px; font-size:11px;' }));
      nameLabel.position.set(0, 2.2, 0); group.add(nameLabel);
      const thoughtDiv = document.createElement('div'); thoughtDiv.className = 'thought-bubble'; thoughtDiv.style.display = 'none';
      const thoughtLabel = new CSS2DObject(thoughtDiv); thoughtLabel.position.set(0, 2.7, 0); group.add(thoughtLabel);
      group.position.copy(pos); scene.add(group);
      group.userData = {
        name, armL, armR, legL, legR, lB, rB, mouth, emotion, team: teamColor,
        stunned: false, heldItem: null, lastThrow: 0, lastPickup: 0, lastThink: 0,
        goal: null, walkTarget: null, throwing: false, fallen: false,
        thoughtDiv, thoughtLabel
      };
      setEmotion(group, emotion);
      return group;
    }

    function setEmotion(char, emotion) {
      const ud = char.userData; if (ud.emotion === emotion) return;
      ud.emotion = emotion;
      ud.lB.rotation.z = 0; ud.rB.rotation.z = 0;
      ud.mouth.scale.set(1, 1, 1); ud.mouth.position.y = 1.35; ud.mouth.rotation.x = 0.2;
      if (emotion === 'happy') { ud.mouth.scale.set(1.4, 1, 1); ud.mouth.position.y = 1.33; ud.mouth.rotation.x = 0.1; ud.lB.rotation.z = 0.1; ud.rB.rotation.z = -0.1; }
      else if (emotion === 'sad') { ud.mouth.scale.set(0.7, 0.7, 1); ud.mouth.position.y = 1.32; ud.mouth.rotation.x = -0.2; ud.lB.rotation.z = -0.15; ud.rB.rotation.z = 0.15; }
      else if (emotion === 'angry') { ud.mouth.scale.set(0.9, 0.7, 1); ud.mouth.position.y = 1.34; ud.mouth.rotation.x = -0.1; ud.lB.rotation.z = -0.2; ud.rB.rotation.z = 0.2; }
      else if (emotion === 'surprised') { ud.mouth.scale.set(0.4, 0.4, 1); ud.mouth.position.y = 1.37; ud.mouth.rotation.x = 0; ud.lB.position.y = 1.72; ud.rB.position.y = 1.72; }
    }

    function showThought(char, text) {
      const td = char.userData.thoughtDiv;
      td.textContent = text; td.style.display = 'block';
      clearTimeout(char._thoughtTimeout);
      char._thoughtTimeout = setTimeout(() => { td.style.display = 'none'; }, 3000);
    }

    const player = createCharacter('Артур', 0xffaa33, { hair: [[0, 1.7, 0.1], [0.2, 1.65, 0.15], [-0.2, 1.65, 0.15]], glasses: true, hat: true, hatColor: 0xffaa33, skin: 0xffccaa }, new THREE.Vector3(-5, 0, -5), 'happy');
    allies.push(player);
    allies.push(createCharacter('Бряк', 0x4488ff, { hair: [[0, 1.72, 0.1], [0.15, 1.67, 0.18], [-0.15, 1.67, 0.18]], hat: true, hatColor: 0x4488ff, skin: 0xffccbb }, new THREE.Vector3(-20, 0, -18), 'happy'));
    allies.push(createCharacter('Листик', 0x44aa44, { hair: [[0, 1.68, 0.2], [0.1, 1.65, 0.25], [-0.1, 1.65, 0.25]], glasses: true, hat: true, hatColor: 0x44aa44, skin: 0xffddcc }, new THREE.Vector3(-18, 0, -22), 'neutral'));
    allies.push(createCharacter('Гром', 0xaa4444, { hair: [[0, 1.75, 0.05], [0.18, 1.7, 0.12], [-0.18, 1.7, 0.12]], hat: true, hatColor: 0xaa4444, skin: 0xffbbaa }, new THREE.Vector3(-22, 0, -15), 'angry'));
    enemies.push(createCharacter('Зубан', 0xcc6644, { crown: true, hair: [[0, 1.6, 0.2], [0.2, 1.55, 0.25], [-0.2, 1.55, 0.25]], skin: 0xffccaa }, new THREE.Vector3(20, 0, 18), 'neutral'));
    enemies.push(createCharacter('Дылда', 0x6666aa, { hair: [[0, 1.8, 0], [0.22, 1.75, 0.08], [-0.22, 1.75, 0.08]], hat: true, hatColor: 0x6666aa, skin: 0xddccbb }, new THREE.Vector3(22, 0, 15), 'neutral'));
    enemies.push(createCharacter('Шустря', 0xaa88cc, { glasses: true, hair: [[0, 1.7, 0.18], [0.12, 1.66, 0.22], [-0.12, 1.66, 0.22]], skin: 0xffccdd }, new THREE.Vector3(18, 0, 22), 'happy'));
    enemies.push(createCharacter('Ворчун', 0x888888, { hat: true, hatColor: 0x666666, hair: [[0, 1.65, 0.15], [0.15, 1.6, 0.2], [-0.15, 1.6, 0.2]], skin: 0xddccaa }, new THREE.Vector3(25, 0, 20), 'sad'));

    // --- Управление ---
    const keys = {};
    window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; e.preventDefault(); });
    window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; e.preventDefault(); });
    let mouseX = 0, mouseY = 0;
    window.addEventListener('mousemove', e => { mouseX = e.movementX; mouseY = e.movementY; });
    renderer.domElement.addEventListener('click', () => renderer.domElement.requestPointerLock());
    document.addEventListener('pointerlockchange', () => {
      document.getElementById('crosshair').style.display = document.pointerLockElement ? 'block' : 'none';
    });
    let yaw = 0, pitch = 0;
    let throwCharge = 0, throwing = false;
    window.addEventListener('mousedown', e => { if (e.button === 0) { throwing = true; throwCharge = performance.now(); } });
    window.addEventListener('mouseup', e => {
      if (e.button === 0 && throwing) {
        const power = Math.min((performance.now() - throwCharge) / 800, 1.0);
        throwItem(player, power);
        throwing = false;
      }
    });

    function pickUpItem(char) {
      if (char.userData.heldItem) return;
      const now = performance.now() / 1000;
      if (now - char.userData.lastPickup < 0.8) return;
      let closest = null, minDist = 1.8;
      for (const t of throwables) {
        if (t.holder || t.velocity.length() > 0.1) continue;
        const d = char.position.distanceTo(t.mesh.position);
        if (d < minDist) { minDist = d; closest = t; }
      }
      if (closest) {
        char.userData.heldItem = closest;
        closest.holder = char;
        scene.remove(closest.mesh);
        char.userData.lastPickup = now;
        showThought(char, 'Взял ' + closest.type);
      }
    }

    function throwItem(char, power) {
      if (!char.userData.heldItem) return;
      const item = char.userData.heldItem;
      item.holder = null; char.userData.heldItem = null;
      item.mesh.position.copy(char.position).add(new THREE.Vector3(0, 1.2, 0));
      const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(char.quaternion);
      item.velocity.copy(dir.multiplyScalar(8 + power * 12));
      item.velocity.y = 4 + power * 6;
      scene.add(item.mesh);
      char.userData.throwing = true;
      char.userData.lastThrow = performance.now() / 1000;
      setTimeout(() => { if (char) char.userData.throwing = false; }, 400);
    }

    function stun(char, duration = 2000) {
      if (char.userData.stunned) return;
      char.userData.stunned = true; char.userData.fallen = true;
      showThought(char, 'Ух!');
      setEmotion(char, 'surprised');
      setTimeout(() => { char.userData.stunned = false; char.userData.fallen = false; }, duration);
    }

    // ИИ через Groq
    async function npcThink(npc) {
      if (npc.userData.stunned) return;
      const now = performance.now() / 1000;
      if (now - npc.userData.lastThink < 10) return;
      npc.userData.lastThink = now;
      const team = (npc.userData.team === 0x4488ff || npc.userData.team === 0x44aa44 || npc.userData.team === 0xaa4444 || npc.userData.team === 0xffaa33) ? 'Храпоглазы' : 'Зубоскалы';
      const others = [...allies, ...enemies].filter(c => c !== npc).map(c => `${c.userData.name}(${c.position.x.toFixed(0)},${c.position.z.toFixed(0)})`).join(', ');
      const locs = 'яблоня(0,0), базаХрапоглазов(-30,-25), базаЗубоскалов(25,25), лесопилка(-20,20), пещера(20,-20)';
      const prompt = `Ты — ${npc.userData.name}, в команде ${team}. Твои потребности: голод 70%, настроение ${npc.userData.emotion}. Другие: ${others}. Ты на позиции (${npc.position.x.toFixed(0)},${npc.position.z.toFixed(0)}). Локации: ${locs}. Выбери действие: атаковать ближайшего врага (бросить предмет), защищать базу, собирать предметы, строить баррикаду, или просто бродить. Ответь кратко, например "атакую Артур" или "иду к базе".`;
      try {
        const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${GROQ_API_KEY}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ model: GROQ_MODEL, messages: [{ role: 'user', content: prompt }], max_tokens: 30, temperature: 0.9 })
        });
        const data = await res.json();
        const decision = data.choices[0].message.content.trim().toLowerCase();
        showThought(npc, decision.slice(0, 30));
        if (decision.includes('атак')) {
          const targetName = decision.split(' ').pop();
          const target = [...allies, ...enemies].find(c => c.userData.name.toLowerCase() === targetName);
          if (target) npc.userData.goal = { type: 'attack', target };
        } else if (decision.includes('баз')) {
          npc.userData.goal = { type: 'move', pos: team === 'Храпоглазы' ? new THREE.Vector3(-30, 0, -25) : new THREE.Vector3(25, 0, 25) };
        } else if (decision.includes('собир')) {
          npc.userData.goal = { type: 'gather' };
        } else if (decision.includes('стро')) {
          npc.userData.goal = { type: 'build' };
        } else {
          npc.userData.goal = { type: 'wander' };
        }
      } catch (e) { console.log('Ошибка ИИ', e); }
    }

    function updateAI(npc) {
      if (npc.userData.stunned) return;
      npcThink(npc); // асинхронно, не ждём
      const goal = npc.userData.goal;
      if (!goal) return;
      if (goal.type === 'attack' && goal.target) {
        const dist = npc.position.distanceTo(goal.target.position);
        if (dist > 2.5) {
          const dir = goal.target.position.clone().sub(npc.position).normalize();
          npc.position.add(dir.multiplyScalar(0.07));
          npc.lookAt(goal.target.position.x, npc.position.y, goal.target.position.z);
        } else {
          if (!npc.userData.heldItem) pickUpItem(npc);
          if (npc.userData.heldItem && performance.now() / 1000 - npc.userData.lastThrow > 1.5) {
            throwItem(npc, 0.7);
          }
        }
      } else if (goal.type === 'move') {
        const dir = goal.pos.clone().sub(npc.position);
        if (dir.length() > 0.5) { npc.position.add(dir.normalize().multiplyScalar(0.06)); npc.lookAt(goal.pos.x, npc.position.y, goal.pos.z); }
        else npc.userData.goal = null;
      } else if (goal.type === 'gather') {
        const near = throwables.find(t => !t.holder && t.velocity.length() < 0.1 && npc.position.distanceTo(t.mesh.position) < 2);
        if (near) pickUpItem(npc);
        else {
          const rand = throwables[Math.floor(Math.random() * throwables.length)];
          if (rand) { const d = rand.mesh.position.clone().sub(npc.position); if (d.length() > 0.5) npc.position.add(d.normalize().multiplyScalar(0.05)); }
        }
      }
    }

    // Команды игрока
    document.getElementById('cmd-attack').addEventListener('click', () => {
      allies.forEach(a => { if (a !== player) a.userData.goal = { type: 'attack', target: enemies[Math.floor(Math.random() * enemies.length)] }; });
    });
    document.getElementById('cmd-defend').addEventListener('click', () => {
      const base = new THREE.Vector3(-30, 0, -25);
      allies.forEach(a => { if (a !== player) a.userData.goal = { type: 'move', pos: base }; });
    });
    document.getElementById('cmd-gather').addEventListener('click', () => {
      allies.forEach(a => { if (a !== player) a.userData.goal = { type: 'gather' }; });
    });

    // Анимация и физика
    function update() {
      if (!player.userData.stunned) {
        const speed = 0.12;
        if (keys['w']) player.position.z -= speed;
        if (keys['s']) player.position.z += speed;
        if (keys['a']) player.position.x -= speed;
        if (keys['d']) player.position.x += speed;
        if (keys['e']) { pickUpItem(player); keys['e'] = false; }
      }
      if (document.pointerLockElement) {
        yaw -= mouseX * 0.002;
        pitch -= mouseY * 0.002;
        pitch = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, pitch));
        mouseX = 0; mouseY = 0;
      }
      const camDist = 6, camHeight = 2.5;
      camera.position.set(
        player.position.x + Math.sin(yaw) * camDist,
        player.position.y + camHeight,
        player.position.z + Math.cos(yaw) * camDist
      );
      camera.lookAt(player.position.x, player.position.y + 1.2, player.position.z);
      player.rotation.y = yaw;

      allies.forEach(a => { if (a !== player) updateAI(a); });
      enemies.forEach(e => updateAI(e));

      for (let i = throwables.length - 1; i >= 0; i--) {
        const t = throwables[i];
        if (t.holder || t.velocity.length() < 0.1) continue;
        t.mesh.position.add(t.velocity.clone().multiplyScalar(0.16));
        t.velocity.y -= 0.25;
        if (t.mesh.position.y < 0.2) { t.mesh.position.y = 0.1; t.velocity.set(0, 0, 0); }
        for (const team of [allies, enemies]) {
          for (const c of team) {
            if (c === t.holder) continue;
            if (c.position.distanceTo(t.mesh.position) < 1.0 && t.velocity.length() > 0.5) {
              stun(c);
              t.velocity.set(0, 0, 0);
              scene.remove(t.mesh);
              throwables.splice(i, 1);
              break;
            }
          }
        }
      }

      document.getElementById('ally-count').textContent = allies.filter(a => !a.userData.stunned).length;
      document.getElementById('enemy-count').textContent = enemies.filter(e => !e.userData.stunned).length;
      document.getElementById('item-indicator').textContent = player.userData.heldItem ? '🎒 ' + player.userData.heldItem.type : 'Пусто';
    }

    function animate() {
      requestAnimationFrame(animate);
      update();
      renderer.render(scene, camera);
      labelRenderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight); labelRenderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
