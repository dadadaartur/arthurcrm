<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Битва за Пирожок — Полноценная игра</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
    #crosshair {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 20px; height: 20px; pointer-events: none; z-index: 10;
    }
    #crosshair::before, #crosshair::after {
      content: ''; position: absolute; background: rgba(255,255,255,0.9);
    }
    #crosshair::before { width: 2px; height: 20px; left: 9px; top: 0; }
    #crosshair::after { width: 20px; height: 2px; left: 0; top: 9px; }
    #ui {
      position: absolute; top: 20px; left: 20px; color: white;
      background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); padding: 10px 16px;
      border-radius: 12px; pointer-events: none; z-index: 10;
    }
    .hint {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.6); color: #ccc; padding: 6px 16px; border-radius: 20px;
      font-size: 12px; pointer-events: none; z-index: 10;
    }
  </style>
</head>
<body>
  <div id="ui">
    <div>🛡️ Союзников: <span id="ally-count">3</span></div>
    <div>💀 Врагов: <span id="enemy-count">3</span></div>
    <div id="item-indicator">🎒 Пусто</div>
  </div>
  <div id="crosshair"></div>
  <div class="hint">Кликните для захвата мыши | WASD — движение | E — подобрать | Левая кнопка мыши (зажать+отпустить) — бросок</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // ======================== ОСНОВНЫЕ ПЕРЕМЕННЫЕ ========================
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);
    scene.fog = new THREE.Fog(0x87CEEB, 50, 120);

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.5, 200);
    camera.position.set(0, 6, 10);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    // Освещение
    scene.add(new THREE.AmbientLight(0x99bbff, 0.6));
    const sun = new THREE.DirectionalLight(0xfff5e6, 1.0);
    sun.position.set(40, 60, 30);
    sun.castShadow = true;
    sun.receiveShadow = true;
    sun.shadow.mapSize.set(1024, 1024);
    scene.add(sun);

    // ======================== ЗЕМЛЯ И ДЕКОРАЦИИ ========================
    const groundCanvas = document.createElement('canvas');
    groundCanvas.width = 1024; groundCanvas.height = 1024;
    const gctx = groundCanvas.getContext('2d');
    gctx.fillStyle = '#7ec850';
    gctx.fillRect(0, 0, 1024, 1024);
    for (let i = 0; i < 4000; i++) {
      gctx.fillStyle = ['#5a9e3a', '#8ccf5a', '#f0e68c', '#ffb6c1'][Math.floor(Math.random() * 4)];
      gctx.fillRect(Math.random() * 1024, Math.random() * 1024, 4, 4);
    }
    const groundTex = new THREE.CanvasTexture(groundCanvas);
    const ground = new THREE.Mesh(new THREE.CircleGeometry(100, 128), new THREE.MeshStandardMaterial({ map: groundTex, roughness: 0.9 }));
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // Деревья, кусты, цветы
    function addTree(x, z, size = 1.0) {
      const group = new THREE.Group();
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.2 * size, 0.3 * size, 2.5 * size), new THREE.MeshStandardMaterial({ color: 0x8b5a2b }));
      trunk.position.y = 1.25 * size;
      group.add(trunk);
      const foliage = new THREE.Mesh(new THREE.SphereGeometry(1.2 * size, 8), new THREE.MeshStandardMaterial({ color: 0x2d5a27 }));
      foliage.position.y = 2.8 * size;
      group.add(foliage);
      group.position.set(x, 0, z);
      scene.add(group);
    }
    function addBush(x, z, size = 0.4) {
      const bush = new THREE.Mesh(new THREE.SphereGeometry(size, 8), new THREE.MeshStandardMaterial({ color: 0x336633 }));
      bush.position.set(x, size * 0.4, z);
      scene.add(bush);
    }
    // Генерация мира
    for (let i = 0; i < 60; i++) {
      const angle = Math.random() * Math.PI * 2;
      const radius = 15 + Math.random() * 80;
      const x = Math.cos(angle) * radius;
      const z = Math.sin(angle) * radius;
      if (Math.random() < 0.6) addTree(x, z, 0.5 + Math.random() * 0.8);
      else if (Math.random() < 0.3) addBush(x, z, 0.3 + Math.random() * 0.5);
    }
    // Центральное дерево-пирожок
    addTree(0, 0, 2.5);
    // Забор по центру
    for (let i = -15; i <= 15; i += 1.2) {
      const post1 = new THREE.Mesh(new THREE.BoxGeometry(0.2, 1.2, 0.2), new THREE.MeshStandardMaterial({ color: 0xcccccc }));
      post1.position.set(i, 0.6, -2);
      post1.castShadow = true; post1.receiveShadow = true; scene.add(post1);
      const post2 = post1.clone();
      post2.position.set(i, 0.6, 2);
      scene.add(post2);
      if (i % 3 < 1) {
        const plank = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.2, 0.4), new THREE.MeshStandardMaterial({ color: 0xcccccc }));
        plank.position.set(i, 0.6, 0);
        plank.castShadow = true; plank.receiveShadow = true; scene.add(plank);
      }
    }

    // ======================== ПРЕДМЕТЫ ДЛЯ БРОСКОВ ========================
    const throwables = [];
    function createItemMesh(type) {
      let geo, mat;
      switch (type) {
        case 'stone': geo = new THREE.SphereGeometry(0.22); mat = new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 0.5 }); break;
        case 'apple': geo = new THREE.SphereGeometry(0.25); mat = new THREE.MeshStandardMaterial({ color: 0xe74c3c, roughness: 0.4 }); break;
        case 'stick': geo = new THREE.CylinderGeometry(0.1, 0.12, 0.5); mat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b }); break;
        case 'pumpkin': geo = new THREE.SphereGeometry(0.3); mat = new THREE.MeshStandardMaterial({ color: 0xff8c00, roughness: 0.5 }); break;
        default: geo = new THREE.SphereGeometry(0.2); mat = new THREE.MeshStandardMaterial({ color: 0x6b4c3b }); break;
      }
      return new THREE.Mesh(geo, mat);
    }
    function addThrowable(x, z, type) {
      const mesh = createItemMesh(type);
      mesh.position.set(x, 0.2, z);
      mesh.castShadow = true; mesh.receiveShadow = true;
      scene.add(mesh);
      throwables.push({ mesh, velocity: new THREE.Vector3(), holder: null, type });
    }
    const types = ['stone', 'apple', 'stick', 'pumpkin', 'mud'];
    for (let i = 0; i < 100; i++) {
      const angle = Math.random() * Math.PI * 2;
      const radius = 12 + Math.random() * 80;
      addThrowable(Math.cos(angle) * radius, Math.sin(angle) * radius, types[Math.floor(Math.random() * types.length)]);
    }

    // ======================== ПЕРСОНАЖИ ========================
    const allies = [];
    const enemies = [];

    function createCharacter(name, teamColor, pos, isPlayer = false) {
      const group = new THREE.Group();
      const bodyMat = new THREE.MeshStandardMaterial({ color: teamColor, roughness: 0.5 });
      const skinMat = new THREE.MeshStandardMaterial({ color: 0xffccaa, roughness: 0.3 });
      const pantsMat = new THREE.MeshStandardMaterial({ color: 0x2244aa });
      const shoeMat = new THREE.MeshStandardMaterial({ color: 0x332211 });

      // Тело
      const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.4, 1.2, 8), bodyMat);
      torso.position.y = 0.6; torso.castShadow = true; group.add(torso);
      // Голова
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.35, 16), skinMat);
      head.position.y = 1.4; head.castShadow = true; group.add(head);
      // Глаза
      const eyeWhite = new THREE.MeshStandardMaterial({ color: 0xffffff });
      const leftEye = new THREE.Mesh(new THREE.SphereGeometry(0.1), eyeWhite);
      leftEye.position.set(-0.13, 1.5, 0.33); group.add(leftEye);
      const rightEye = leftEye.clone(); rightEye.position.set(0.13, 1.5, 0.33); group.add(rightEye);
      const pupilMat = new THREE.MeshStandardMaterial({ color: 0x111122 });
      const leftPupil = new THREE.Mesh(new THREE.SphereGeometry(0.05), pupilMat);
      leftPupil.position.set(-0.13, 1.48, 0.4); group.add(leftPupil);
      const rightPupil = leftPupil.clone(); rightPupil.position.set(0.13, 1.48, 0.4); group.add(rightPupil);
      // Рот
      const mouth = new THREE.Mesh(new THREE.TorusGeometry(0.1, 0.03, 6, 12, Math.PI), new THREE.MeshStandardMaterial({ color: 0x552222 }));
      mouth.position.set(0, 1.3, 0.35); mouth.rotation.x = 0.2; group.add(mouth);
      // Шляпа для игрока
      if (isPlayer) {
        const hat = new THREE.Mesh(new THREE.ConeGeometry(0.25, 0.3, 8), new THREE.MeshStandardMaterial({ color: 0xffaa33 }));
        hat.position.set(0, 1.75, 0); group.add(hat);
      }
      // Конечности
      const armL = new THREE.Group(), armR = new THREE.Group();
      const upperArmGeo = new THREE.CylinderGeometry(0.1, 0.12, 0.6, 6);
      const forearmGeo = new THREE.CylinderGeometry(0.08, 0.1, 0.5, 6);
      const handGeo = new THREE.SphereGeometry(0.09);
      armL.add(new THREE.Mesh(upperArmGeo, bodyMat).translateY(-0.3));
      armL.add(new THREE.Mesh(forearmGeo, skinMat).translateY(-0.8));
      armL.add(new THREE.Mesh(handGeo, skinMat).translateY(-1.1));
      armL.position.set(-0.55, 1.2, 0); group.add(armL);
      armR.add(new THREE.Mesh(upperArmGeo, bodyMat).translateY(-0.3));
      armR.add(new THREE.Mesh(forearmGeo, skinMat).translateY(-0.8));
      armR.add(new THREE.Mesh(handGeo, skinMat).translateY(-1.1));
      armR.position.set(0.55, 1.2, 0); group.add(armR);
      const legL = new THREE.Group(), legR = new THREE.Group();
      const thighGeo = new THREE.CylinderGeometry(0.13, 0.15, 0.55, 6);
      const shinGeo = new THREE.CylinderGeometry(0.1, 0.13, 0.5, 6);
      const shoeGeo = new THREE.BoxGeometry(0.15, 0.1, 0.25);
      legL.add(new THREE.Mesh(thighGeo, pantsMat).translateY(-0.25));
      legL.add(new THREE.Mesh(shinGeo, pantsMat).translateY(-0.75));
      legL.add(new THREE.Mesh(shoeGeo, shoeMat).translateY(-1.0).translateZ(0.06));
      legL.position.set(-0.2, 0, 0); group.add(legL);
      legR.add(new THREE.Mesh(thighGeo, pantsMat).translateY(-0.25));
      legR.add(new THREE.Mesh(shinGeo, pantsMat).translateY(-0.75));
      legR.add(new THREE.Mesh(shoeGeo, shoeMat).translateY(-1.0).translateZ(0.06));
      legR.position.set(0.2, 0, 0); group.add(legR);

      group.position.set(pos.x, 0, pos.z);
      scene.add(group);

      const userData = {
        name,
        team: teamColor,
        stunned: false,
        heldItem: null,
        lastThrow: 0,
        lastPickup: 0,
        armL,
        armR,
        legL,
        legR,
        falling: false,
        speed: 0.07,
        isPlayer
      };
      group.userData = userData;
      return group;
    }

    // Создаём игрока
    const player = createCharacter('Артур', 0xffaa33, new THREE.Vector3(-5, 0, -5), true);
    allies.push(player);

    // Союзники
    allies.push(createCharacter('Бряк', 0x4488ff, new THREE.Vector3(-15, 0, -15)));
    allies.push(createCharacter('Листик', 0x44aa44, new THREE.Vector3(-12, 0, -20)));
    allies.push(createCharacter('Гром', 0xaa4444, new THREE.Vector3(-18, 0, -12)));

    // Враги
    enemies.push(createCharacter('Зубан', 0xcc6644, new THREE.Vector3(15, 0, 15)));
    enemies.push(createCharacter('Дылда', 0x6666aa, new THREE.Vector3(12, 0, 20)));
    enemies.push(createCharacter('Шустря', 0xaa88cc, new THREE.Vector3(18, 0, 12)));

    // ======================== УПРАВЛЕНИЕ ИГРОКОМ ========================
    const keys = {};
    window.addEventListener('keydown', (e) => { keys[e.key.toLowerCase()] = true; e.preventDefault(); });
    window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; e.preventDefault(); });
    let mouseX = 0, mouseY = 0;
    window.addEventListener('mousemove', (e) => { mouseX = e.movementX; mouseY = e.movementY; });
    renderer.domElement.addEventListener('click', () => renderer.domElement.requestPointerLock());
    document.addEventListener('pointerlockchange', () => {
      document.getElementById('crosshair').style.display = document.pointerLockElement ? 'block' : 'none';
    });

    let yaw = 0, pitch = 0;
    let throwStart = 0, isThrowing = false;
    window.addEventListener('mousedown', (e) => {
      if (e.button === 0) { isThrowing = true; throwStart = performance.now(); }
    });
    window.addEventListener('mouseup', (e) => {
      if (e.button === 0 && isThrowing) {
        const power = Math.min((performance.now() - throwStart) / 800, 1.0);
        throwItem(player, power);
        isThrowing = false;
      }
    });

    function pickUpItem(char) {
      if (char.userData.heldItem) return;
      const now = performance.now() / 1000;
      if (now - char.userData.lastPickup < 0.5) return;
      let closest = null, minDist = 1.6;
      for (const t of throwables) {
        if (t.holder || t.velocity.length() > 0.1) continue;
        const d = char.position.distanceTo(t.mesh.position);
        if (d < minDist) { minDist = d; closest = t; }
      }
      if (closest) {
        char.userData.heldItem = closest;
        closest.holder = char;
        scene.remove(closest.mesh);
        char.userData.lastPickup = now;
        if (char.userData.isPlayer) updateItemIndicator();
      }
    }

    function throwItem(char, power) {
      if (!char.userData.heldItem) return;
      const item = char.userData.heldItem;
      item.holder = null;
      char.userData.heldItem = null;
      item.mesh.position.copy(char.position.clone().add(new THREE.Vector3(0, 1.2, 0)));
      const direction = new THREE.Vector3(0, 0, -1).applyQuaternion(char.quaternion);
      item.velocity.copy(direction.multiplyScalar(7 + power * 11));
      item.velocity.y = 4 + power * 6;
      scene.add(item.mesh);
      char.userData.lastThrow = performance.now() / 1000;
      if (char.userData.isPlayer) updateItemIndicator();
    }

    function stun(char, duration = 1500) {
      if (char.userData.stunned) return;
      char.userData.stunned = true;
      char.userData.falling = true;
      setTimeout(() => {
        char.userData.stunned = false;
        char.userData.falling = false;
      }, duration);
    }

    function updateItemIndicator() {
      document.getElementById('item-indicator').textContent = player.userData.heldItem ? '🎒 ' + player.userData.heldItem.type : '🎒 Пусто';
    }

    // ======================== ИСКУССТВЕННЫЙ ИНТЕЛЛЕКТ ========================
    function updateAI(character, deltaTime) {
      if (character.userData.stunned) return;
      // Определяем врагов для этого персонажа
      const myTeam = character.userData.team;
      const opponents = (myTeam === 0xffaa33 || myTeam === 0x4488ff || myTeam === 0x44aa44 || myTeam === 0xaa4444) ? enemies : allies;
      if (opponents.length === 0) return;

      // Находим ближайшего противника
      let closestOpponent = null;
      let minDist = Infinity;
      opponents.forEach(opp => {
        const d = character.position.distanceTo(opp.position);
        if (d < minDist) {
          minDist = d;
          closestOpponent = opp;
        }
      });
      if (!closestOpponent) return;

      const distToTarget = minDist;
      const directionToTarget = closestOpponent.position.clone().sub(character.position).normalize();

      if (distToTarget > 2.5) {
        // Двигаемся к цели
        character.position.add(directionToTarget.multiplyScalar(character.userData.speed));
        character.lookAt(closestOpponent.position.x, character.position.y, closestOpponent.position.z);
        // Анимация ходьбы
        if (!character.userData.falling) {
          character.userData.legL.rotation.x = Math.sin(Date.now() * 0.02) * 0.5;
          character.userData.legR.rotation.x = Math.sin(Date.now() * 0.02 + Math.PI) * 0.5;
          character.userData.armL.rotation.x = Math.sin(Date.now() * 0.02) * 0.3;
          character.userData.armR.rotation.x = Math.sin(Date.now() * 0.02 + Math.PI) * 0.3;
        }
      } else {
        // В зоне атаки: подбираем предмет, если нет, и бросаем
        if (!character.userData.heldItem) pickUpItem(character);
        if (character.userData.heldItem && performance.now() / 1000 - character.userData.lastThrow > 1.8) {
          throwItem(character, 0.5 + Math.random() * 0.3);
        }
        // Анимация рук при атаке
        if (character.userData.heldItem) {
          character.userData.armR.rotation.x = -1.5; // замах
        }
      }

      // Если персонаж упал, отключаем анимацию ходьбы
      if (character.userData.falling) {
        character.userData.armL.rotation.z = Math.PI / 4;
        character.userData.armR.rotation.z = -Math.PI / 4;
        character.rotation.z = 0.2;
        character.userData.legL.rotation.x = 0;
        character.userData.legR.rotation.x = 0;
      } else {
        character.rotation.z = 0;
      }
    }

    // ======================== ОБНОВЛЕНИЕ ИГРЫ ========================
    function update() {
      // Управление игроком
      if (!player.userData.stunned && document.pointerLockElement) {
        const speed = 0.1;
        if (keys['w']) player.position.z -= speed;
        if (keys['s']) player.position.z += speed;
        if (keys['a']) player.position.x -= speed;
        if (keys['d']) player.position.x += speed;
        if (keys['e']) { pickUpItem(player); keys['e'] = false; }
      }

      // Обновление камеры от первого лица
      if (document.pointerLockElement) {
        yaw -= mouseX * 0.002;
        pitch -= mouseY * 0.002;
        pitch = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, pitch));
        mouseX = 0; mouseY = 0;
      }
      const camDist = 5.5, camHeight = 2.2;
      camera.position.set(
        player.position.x + Math.sin(yaw) * camDist,
        player.position.y + camHeight,
        player.position.z + Math.cos(yaw) * camDist
      );
      camera.lookAt(player.position.x, player.position.y + 1.2, player.position.z);
      player.rotation.y = yaw;
      // Анимация ходьбы игрока
      if (!player.userData.stunned && (keys['w'] || keys['a'] || keys['s'] || keys['d'])) {
        player.userData.legL.rotation.x = Math.sin(Date.now() * 0.03) * 0.6;
        player.userData.legR.rotation.x = Math.sin(Date.now() * 0.03 + Math.PI) * 0.6;
        player.userData.armL.rotation.x = Math.sin(Date.now() * 0.03) * 0.4;
        player.userData.armR.rotation.x = Math.sin(Date.now() * 0.03 + Math.PI) * 0.4;
      } else if (!player.userData.stunned) {
        player.userData.legL.rotation.x = 0;
        player.userData.legR.rotation.x = 0;
        player.userData.armL.rotation.x = 0;
        player.userData.armR.rotation.x = 0;
      }

      // ИИ союзников и врагов
      const now = Date.now();
      allies.forEach((ally) => {
        if (ally !== player) updateAI(ally, 0.016);
      });
      enemies.forEach((enemy) => updateAI(enemy, 0.016));

      // Физика брошенных предметов
      for (let i = throwables.length - 1; i >= 0; i--) {
        const t = throwables[i];
        if (t.holder) continue;
        t.mesh.position.add(t.velocity.clone().multiplyScalar(0.16));
        t.velocity.y -= 0.3;
        if (t.mesh.position.y < 0.15) {
          t.mesh.position.y = 0.15;
          t.velocity.set(0, 0, 0);
        }
        // Проверка столкновений с персонажами
        const allCharacters = [player, ...allies, ...enemies];
        for (const char of allCharacters) {
          if (char === t.holder) continue;
          const dist = char.position.distanceTo(t.mesh.position);
          if (dist < 0.9 && t.velocity.length() > 0.5) {
            stun(char);
            t.velocity.set(0, 0, 0);
            scene.remove(t.mesh);
            throwables.splice(i, 1);
            break;
          }
        }
      }

      // Обновление UI
      document.getElementById('ally-count').textContent = allies.filter(a => !a.userData.stunned).length;
      document.getElementById('enemy-count').textContent = enemies.filter(e => !e.userData.stunned).length;
      updateItemIndicator();
    }

    function animate() {
      requestAnimationFrame(animate);
      update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    console.log('⚔️ Игра готова! Кликни для захвата мыши.');
  </script>
</body>
</html>
