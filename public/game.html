<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Битва за Пирожок — Живой ИИ (исправлено)</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #000; }
    #ui {
      position: absolute; top: 20px; left: 20px; color: white;
      background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); padding: 12px 20px;
      border-radius: 12px; pointer-events: none; z-index: 10;
    }
    #crosshair {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 20px; height: 20px; border: 2px solid white; border-radius: 50%;
      display: none; z-index: 10;
    }
    .button {
      background: #ffaa00; border: none; color: black; padding: 8px 14px;
      border-radius: 20px; cursor: pointer; font-weight: bold; margin: 4px;
      pointer-events: auto;
    }
    .thought-bubble {
      color: #ff0; background: rgba(0,0,0,0.8); padding: 4px 10px; border-radius: 12px;
      font-size: 11px; max-width: 150px; text-align: center; pointer-events: none;
      position: absolute; transform: translate(-50%, -100%); white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="ui">
    <div>🛡️ Союзников: <span id="ally-count">3</span></div>
    <div>💀 Врагов: <span id="enemy-count">3</span></div>
    <div id="item-indicator">🎒 Пусто</div>
    <div id="lock-status" style="color:red; margin-top:8px;">Управление: НЕ АКТИВНО (кликни по экрану)</div>
    <div style="margin-top:8px;">
      <button id="btn-attack" class="button">⚔️ В атаку!</button>
      <button id="btn-defend" class="button">🛡️ Защищать</button>
      <button id="btn-gather" class="button">🧺 Собирать</button>
    </div>
  </div>
  <div id="crosshair"></div>
  <div id="thoughts-container" style="position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:5;"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // ======================== КОНФИГУРАЦИЯ ========================
    const GROQ_API_KEY = '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';
    const GROQ_MODEL = 'llama-3.3-70b-versatile';

    // ======================== СЦЕНА ========================
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);
    scene.fog = new THREE.Fog(0x87CEEB, 30, 100);

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.5, 200);
    camera.position.set(0, 8, 12);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0x99bbff, 0.7));
    const sun = new THREE.DirectionalLight(0xfff5e6, 1.0);
    sun.position.set(40, 60, 30);
    sun.castShadow = true; sun.receiveShadow = true;
    sun.shadow.mapSize.set(1024, 1024);
    scene.add(sun);

    // Земля
    const groundCanvas = document.createElement('canvas');
    groundCanvas.width = 1024; groundCanvas.height = 1024;
    const gctx = groundCanvas.getContext('2d');
    gctx.fillStyle = '#7ec850'; gctx.fillRect(0, 0, 1024, 1024);
    for (let i = 0; i < 4000; i++) {
      gctx.fillStyle = ['#5a9e3a', '#8ccf5a', '#f0e68c', '#ffb6c1'][Math.floor(Math.random() * 4)];
      gctx.fillRect(Math.random() * 1024, Math.random() * 1024, 4, 4);
    }
    const groundTex = new THREE.CanvasTexture(groundCanvas);
    const ground = new THREE.Mesh(new THREE.CircleGeometry(60, 64), new THREE.MeshStandardMaterial({ map: groundTex, roughness: 0.9 }));
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // Декорации
    for (let i = 0; i < 60; i++) {
      const angle = Math.random() * Math.PI * 2;
      const radius = 15 + Math.random() * 40;
      const x = Math.cos(angle) * radius;
      const z = Math.sin(angle) * radius;
      const treeGroup = new THREE.Group();
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.3, 2), new THREE.MeshStandardMaterial({ color: 0x8b5a2b }));
      trunk.position.y = 1; treeGroup.add(trunk);
      const foliage = new THREE.Mesh(new THREE.SphereGeometry(1, 8), new THREE.MeshStandardMaterial({ color: 0x2d5a27 }));
      foliage.position.y = 2.5; treeGroup.add(foliage);
      treeGroup.position.set(x, 0, z);
      scene.add(treeGroup);
    }

    // Предметы
    const throwables = [];
    function addItem(x, z, type) {
      let geo, mat;
      switch (type) {
        case 'stone': geo = new THREE.SphereGeometry(0.22); mat = new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 0.5 }); break;
        case 'apple': geo = new THREE.SphereGeometry(0.25); mat = new THREE.MeshStandardMaterial({ color: 0xe74c3c, roughness: 0.4 }); break;
        case 'stick': geo = new THREE.CylinderGeometry(0.1, 0.12, 0.5); mat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b }); break;
        default: geo = new THREE.SphereGeometry(0.2); mat = new THREE.MeshStandardMaterial({ color: 0x6b4c3b }); break;
      }
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(x, 0.2, z);
      mesh.castShadow = true; mesh.receiveShadow = true;
      scene.add(mesh);
      throwables.push({ mesh, velocity: new THREE.Vector3(), holder: null, type });
    }
    const types = ['stone', 'apple', 'stick', 'mud'];
    for (let i = 0; i < 100; i++) {
      const angle = Math.random() * Math.PI * 2;
      const radius = 10 + Math.random() * 45;
      addItem(Math.cos(angle) * radius, Math.sin(angle) * radius, types[Math.floor(Math.random() * types.length)]);
    }

    // ======================== ПЕРСОНАЖИ ========================
    const allies = [];
    const enemies = [];
    const characterToDiv = new Map(); // для обновления позиций мыслей

    function createCharacter(name, teamColor, pos, isPlayer = false) {
      const group = new THREE.Group();
      const bodyMat = new THREE.MeshStandardMaterial({ color: teamColor, roughness: 0.5 });
      const skinMat = new THREE.MeshStandardMaterial({ color: 0xffccaa, roughness: 0.3 });

      const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.4, 1.2, 8), bodyMat);
      torso.position.y = 0.6; torso.castShadow = true; group.add(torso);
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.35, 8), skinMat);
      head.position.y = 1.4; head.castShadow = true; group.add(head);
      const eye = new THREE.Mesh(new THREE.SphereGeometry(0.1), new THREE.MeshStandardMaterial({ color: 0xffffff }));
      eye.position.set(-0.13, 1.5, 0.33); group.add(eye);
      const eye2 = eye.clone(); eye2.position.set(0.13, 1.5, 0.33); group.add(eye2);
      const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.05), new THREE.MeshStandardMaterial({ color: 0x111122 }));
      pupil.position.set(-0.13, 1.48, 0.4); group.add(pupil);
      const pupil2 = pupil.clone(); pupil2.position.set(0.13, 1.48, 0.4); group.add(pupil2);
      const mouth = new THREE.Mesh(new THREE.TorusGeometry(0.1, 0.03, 6, 12, Math.PI), new THREE.MeshStandardMaterial({ color: 0x552222 }));
      mouth.position.set(0, 1.3, 0.35); mouth.rotation.x = 0.2; group.add(mouth);

      if (isPlayer) {
        const hat = new THREE.Mesh(new THREE.ConeGeometry(0.25, 0.3, 8), new THREE.MeshStandardMaterial({ color: 0xffaa33 }));
        hat.position.set(0, 1.75, 0); group.add(hat);
      }

      const armL = new THREE.Group(), armR = new THREE.Group();
      const armGeo = new THREE.CylinderGeometry(0.08, 0.1, 0.8, 6);
      armL.add(new THREE.Mesh(armGeo, bodyMat).translateY(-0.4));
      armL.position.set(-0.55, 1.1, 0); group.add(armL);
      armR.add(new THREE.Mesh(armGeo, bodyMat).translateY(-0.4));
      armR.position.set(0.55, 1.1, 0); group.add(armR);

      const legL = new THREE.Group(), legR = new THREE.Group();
      const legGeo = new THREE.CylinderGeometry(0.12, 0.14, 0.7, 6);
      legL.add(new THREE.Mesh(legGeo, new THREE.MeshStandardMaterial({ color: 0x2244aa })).translateY(-0.35));
      legL.position.set(-0.2, 0, 0); group.add(legL);
      legR.add(new THREE.Mesh(legGeo, new THREE.MeshStandardMaterial({ color: 0x2244aa })).translateY(-0.35));
      legR.position.set(0.2, 0, 0); group.add(legR);

      // Создаём HTML-облачко для мыслей
      const thoughtDiv = document.createElement('div');
      thoughtDiv.className = 'thought-bubble';
      thoughtDiv.style.display = 'none';
      document.getElementById('thoughts-container').appendChild(thoughtDiv);
      characterToDiv.set(group, thoughtDiv);

      group.position.set(pos.x, 0, pos.z);
      scene.add(group);

      group.userData = {
        name, team: teamColor, stunned: false, heldItem: null,
        lastThrow: 0, lastPickup: 0, armL, armR, legL, legR,
        falling: false, speed: 0.07, isPlayer,
        moveTarget: null, thoughtDiv, lastThink: 0,
        goal: null
      };
      return group;
    }

    const player = createCharacter('Артур', 0xffaa33, new THREE.Vector3(-5, 0, -5), true);
    allies.push(player);

    allies.push(createCharacter('Бряк', 0x4488ff, new THREE.Vector3(-12, 0, -12)));
    allies.push(createCharacter('Листик', 0x44aa44, new THREE.Vector3(-8, 0, -15)));
    allies.push(createCharacter('Гром', 0xaa4444, new THREE.Vector3(-15, 0, -8)));

    enemies.push(createCharacter('Зубан', 0xcc6644, new THREE.Vector3(12, 0, 12)));
    enemies.push(createCharacter('Дылда', 0x6666aa, new THREE.Vector3(8, 0, 15)));
    enemies.push(createCharacter('Шустря', 0xaa88cc, new THREE.Vector3(15, 0, 8)));

    // ======================== УПРАВЛЕНИЕ ИГРОКОМ ========================
    const keys = {};
    window.addEventListener('keydown', (e) => { keys[e.key.toLowerCase()] = true; e.preventDefault(); });
    window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; e.preventDefault(); });

    let yaw = 0, pitch = 0;
    window.addEventListener('mousemove', (e) => {
      if (document.pointerLockElement === renderer.domElement) {
        yaw -= e.movementX * 0.002;
        pitch -= e.movementY * 0.002;
        pitch = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, pitch));
      }
    });

    renderer.domElement.addEventListener('click', () => {
      renderer.domElement.requestPointerLock();
    });

    document.addEventListener('pointerlockchange', () => {
      const locked = document.pointerLockElement === renderer.domElement;
      document.getElementById('lock-status').textContent = locked ? 'Управление: АКТИВНО' : 'Управление: НЕ АКТИВНО (кликни по экрану)';
      document.getElementById('lock-status').style.color = locked ? 'lime' : 'red';
      document.getElementById('crosshair').style.display = locked ? 'block' : 'none';
    });

    let throwStart = 0, isThrowing = false;
    window.addEventListener('mousedown', (e) => {
      if (e.button === 0 && document.pointerLockElement) {
        isThrowing = true;
        throwStart = performance.now();
      }
    });
    window.addEventListener('mouseup', (e) => {
      if (e.button === 0 && isThrowing && document.pointerLockElement) {
        const power = Math.min((performance.now() - throwStart) / 800, 1.0);
        throwItem(player, power);
        isThrowing = false;
      }
    });

    function pickUpItem(char) {
      if (char.userData.heldItem) return;
      const now = performance.now() / 1000;
      if (now - char.userData.lastPickup < 0.5) return;
      let closest = null, minDist = 1.8;
      throwables.forEach(t => {
        if (t.holder) return;
        const d = char.position.distanceTo(t.mesh.position);
        if (d < minDist) { minDist = d; closest = t; }
      });
      if (closest) {
        char.userData.heldItem = closest;
        closest.holder = char;
        scene.remove(closest.mesh);
        char.userData.lastPickup = now;
      }
    }

    function throwItem(char, power) {
      if (!char.userData.heldItem) return;
      const item = char.userData.heldItem;
      item.holder = null;
      char.userData.heldItem = null;
      item.mesh.position.copy(char.position.clone().add(new THREE.Vector3(0, 1.2, 0)));
      const direction = new THREE.Vector3(0, 0, -1).applyQuaternion(char.quaternion);
      item.velocity.copy(direction.multiplyScalar(7 + power * 10));
      item.velocity.y = 4 + power * 6;
      scene.add(item.mesh);
      char.userData.lastThrow = performance.now() / 1000;
    }

    function stun(char, duration = 1500) {
      if (char.userData.stunned) return;
      char.userData.stunned = true;
      char.userData.falling = true;
      setTimeout(() => {
        char.userData.stunned = false;
        char.userData.falling = false;
      }, duration);
    }

    function showThought(char, text) {
      const div = characterToDiv.get(char);
      if (div) {
        div.textContent = text;
        div.style.display = 'block';
        clearTimeout(char._thoughtTimer);
        char._thoughtTimer = setTimeout(() => { div.style.display = 'none'; }, 4000);
      }
    }

    // ======================== ИИ ЧЕРЕЗ GROQ ========================
    async function npcThink(npc) {
      if (npc.userData.stunned) return;
      const now = performance.now() / 1000;
      if (now - npc.userData.lastThink < 8) return;
      npc.userData.lastThink = now;

      const team = (npc.userData.team === 0x4488ff || npc.userData.team === 0x44aa44 || npc.userData.team === 0xaa4444 || npc.userData.team === 0xffaa33) ? 'Храпоглазы' : 'Зубоскалы';
      const others = [...allies, ...enemies].filter(c => c !== npc).map(c => `${c.userData.name}(${c.position.x.toFixed(0)},${c.position.z.toFixed(0)})`).join(', ');
      const locs = 'яблоня(0,0), базаХрапоглазов(-30,-25), базаЗубоскалов(30,30), лесопилка(-20,20), пещера(20,-20)';
      const held = npc.userData.heldItem ? `держит ${npc.userData.heldItem.type}` : 'ничего не держит';
      const prompt = `Ты — ${npc.userData.name}, в команде ${team}. Твои потребности: голод 70%, настроение нейтральное. Вокруг: ${others}. Ты находишься в (${npc.position.x.toFixed(0)},${npc.position.z.toFixed(0)}), ${held}. Локации: ${locs}. Выбери действие: атаковать конкретного врага (бросить предмет), защищать базу, собирать предметы, или просто бродить. Ответь одной короткой фразой, например: "Атакую Гром" или "Иду к базе".`;
      try {
        const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${GROQ_API_KEY}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ model: GROQ_MODEL, messages: [{ role: 'user', content: prompt }], max_tokens: 30, temperature: 0.9 })
        });
        const data = await res.json();
        if (data.choices && data.choices[0]) {
          const decision = data.choices[0].message.content.trim();
          showThought(npc, decision);
          const lower = decision.toLowerCase();
          if (lower.includes('атакую') || lower.includes('атаковать')) {
            const targetName = lower.split(' ').pop();
            const target = [...allies, ...enemies].find(c => c.userData.name.toLowerCase() === targetName);
            if (target) npc.userData.goal = { type: 'attack', target };
          } else if (lower.includes('баз')) {
            const base = team === 'Храпоглазы' ? new THREE.Vector3(-30, 0, -25) : new THREE.Vector3(30, 0, 30);
            npc.userData.goal = { type: 'move', pos: base };
          } else if (lower.includes('собир')) {
            npc.userData.goal = { type: 'gather' };
          } else {
            npc.userData.goal = { type: 'wander' };
          }
        }
      } catch (e) {
        console.error('Ошибка Groq для', npc.userData.name, e);
      }
    }

    function executeGoal(npc) {
      if (!npc.userData.goal || npc.userData.stunned) return;
      const goal = npc.userData.goal;
      if (goal.type === 'attack' && goal.target) {
        const dist = npc.position.distanceTo(goal.target.position);
        if (dist > 2.5) {
          const dir = goal.target.position.clone().sub(npc.position).normalize();
          npc.position.add(dir.multiplyScalar(npc.userData.speed));
          npc.lookAt(goal.target.position.x, npc.position.y, goal.target.position.z);
        } else {
          if (!npc.userData.heldItem) pickUpItem(npc);
          if (npc.userData.heldItem && performance.now() / 1000 - npc.userData.lastThrow > 1.8) {
            throwItem(npc, 0.6);
            npc.userData.goal = null;
          }
        }
      } else if (goal.type === 'move') {
        const dist = npc.position.distanceTo(goal.pos);
        if (dist > 1.0) {
          const dir = goal.pos.clone().sub(npc.position).normalize();
          npc.position.add(dir.multiplyScalar(npc.userData.speed));
          npc.lookAt(goal.pos.x, npc.position.y, goal.pos.z);
        } else {
          npc.userData.goal = null;
        }
      } else if (goal.type === 'gather') {
        const near = throwables.find(t => !t.holder && t.velocity.length() < 0.1 && npc.position.distanceTo(t.mesh.position) < 2);
        if (near) pickUpItem(npc);
        else {
          const rand = throwables[Math.floor(Math.random() * throwables.length)];
          if (rand) {
            const dir = rand.mesh.position.clone().sub(npc.position).normalize();
            npc.position.add(dir.multiplyScalar(npc.userData.speed));
            npc.lookAt(rand.mesh.position.x, npc.position.y, rand.mesh.position.z);
          }
        }
        npc.userData.goal = null;
      }
    }

    // ======================== ОСНОВНОЙ ЦИКЛ ========================
    function update() {
      // Игрок
      if (!player.userData.stunned && document.pointerLockElement === renderer.domElement) {
        const speed = 0.1;
        if (keys['w']) player.position.z -= speed;
        if (keys['s']) player.position.z += speed;
        if (keys['a']) player.position.x -= speed;
        if (keys['d']) player.position.x += speed;
        if (keys['e']) { pickUpItem(player); keys['e'] = false; }
      }

      // Камера
      if (document.pointerLockElement) {
        const camDist = 5.5, camHeight = 2.2;
        camera.position.set(
          player.position.x + Math.sin(yaw) * camDist,
          player.position.y + camHeight,
          player.position.z + Math.cos(yaw) * camDist
        );
        camera.lookAt(player.position.x, player.position.y + 1.2, player.position.z);
        player.rotation.y = yaw;
      }

      // ИИ
      allies.forEach(ally => { if (ally !== player) { npcThink(ally); executeGoal(ally); } });
      enemies.forEach(enemy => { npcThink(enemy); executeGoal(enemy); });

      // Физика предметов
      for (let i = throwables.length - 1; i >= 0; i--) {
        const t = throwables[i];
        if (t.holder) continue;
        t.mesh.position.add(t.velocity.clone().multiplyScalar(0.16));
        t.velocity.y -= 0.3;
        if (t.mesh.position.y < 0.15) {
          t.mesh.position.y = 0.15;
          t.velocity.set(0, 0, 0);
        }
        const allChars = [player, ...allies, ...enemies];
        for (const char of allChars) {
          if (char === t.holder) continue;
          const dist = char.position.distanceTo(t.mesh.position);
          if (dist < 1.0 && t.velocity.length() > 0.5) {
            stun(char);
            t.velocity.set(0, 0, 0);
            scene.remove(t.mesh);
            throwables.splice(i, 1);
            break;
          }
        }
      }

      // Обновляем позиции HTML-облачков
      characterToDiv.forEach((div, char) => {
        if (div.style.display === 'block') {
          const pos = char.position.clone();
          pos.y += 2.2;
          const screenPos = pos.clone().project(camera);
          div.style.left = ((screenPos.x + 1) / 2 * window.innerWidth) + 'px';
          div.style.top = (-(screenPos.y - 1) / 2 * window.innerHeight) + 'px';
        }
      });

      // Анимации
      [player, ...allies, ...enemies].forEach(char => {
        if (char.userData.falling) {
          char.userData.armL.rotation.z = Math.PI / 4;
          char.userData.armR.rotation.z = -Math.PI / 4;
          char.rotation.z = 0.2;
        } else {
          char.rotation.z = 0;
          char.userData.armL.rotation.z = 0;
          char.userData.armR.rotation.z = 0;
        }
      });

      // UI
      document.getElementById('ally-count').textContent = allies.filter(a => !a.userData.stunned).length;
      document.getElementById('enemy-count').textContent = enemies.filter(e => !e.userData.stunned).length;
      document.getElementById('item-indicator').textContent = player.userData.heldItem ? '🎒 ' + player.userData.heldItem.type : '🎒 Пусто';
    }

    function animate() {
      requestAnimationFrame(animate);
      update();
      renderer.render(scene, camera);
    }
    animate();

    // Кнопки команд
    document.getElementById('btn-attack').addEventListener('click', () => {
      allies.forEach(ally => { if (ally !== player) ally.userData.goal = { type: 'attack', target: enemies[Math.floor(Math.random() * enemies.length)] }; });
    });
    document.getElementById('btn-defend').addEventListener('click', () => {
      const base = new THREE.Vector3(-30, 0, -25);
      allies.forEach(ally => { if (ally !== player) ally.userData.goal = { type: 'move', pos: base }; });
    });
    document.getElementById('btn-gather').addEventListener('click', () => {
      allies.forEach(ally => { if (ally !== player) ally.userData.goal = { type: 'gather' }; });
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    console.log('✅ Игра запущена! Управление через клик.');
  </script>
</body>
</html>
