<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Битва за Пирожок · Визуальный прототип</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Segoe UI', sans-serif;
    }
    #ui-panel {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(12px);
      padding: 12px 20px;
      border-radius: 20px;
      color: white;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      z-index: 10;
      border: 1px solid rgba(255,255,255,0.3);
      pointer-events: auto;
    }
    button {
      background: #ffaa00;
      border: none;
      color: black;
      padding: 10px 18px;
      border-radius: 30px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
      font-size: 14px;
    }
    button:hover {
      background: #ffbb33;
    }
    #selected-info {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(10px);
      padding: 12px 18px;
      border-radius: 16px;
      color: white;
      z-index: 10;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .thought-bubble {
      color: #ff0;
      background: rgba(0,0,0,0.8);
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      max-width: 140px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="selected-info">
    <span id="char-name">Никто не выбран</span>
    <div style="font-size:12px; color:#aaa;">Кликни по персонажу</div>
  </div>
  <div id="ui-panel">
    <button id="action-walk">🚶 Идти к пирожку</button>
    <button id="action-throw">🥧 Бросок</button>
    <button id="action-fall">🤸 Упасть</button>
    <button id="action-build">🔨 Строить</button>
    <button id="action-wave">👋 Привет</button>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

    // --- Сцена ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);
    scene.fog = new THREE.Fog(0x87CEEB, 12, 28);
    const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.5, 50);
    camera.position.set(8, 6, 11);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);
    const labelRenderer = new CSS2DRenderer();
    labelRenderer.setSize(innerWidth, innerHeight);
    labelRenderer.domElement.style.position = 'absolute';
    labelRenderer.domElement.style.top = '0';
    labelRenderer.domElement.style.left = '0';
    labelRenderer.domElement.style.pointerEvents = 'none';
    document.body.appendChild(labelRenderer.domElement);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1, 0);
    controls.enableDamping = true;
    controls.maxPolarAngle = Math.PI / 2.3;
    controls.minDistance = 5;
    controls.maxDistance = 30;
    controls.update();

    scene.add(new THREE.AmbientLight(0x8899bb));
    const sun = new THREE.DirectionalLight(0xfff5e6, 0.9);
    sun.position.set(20, 25, 10);
    sun.castShadow = true;
    sun.receiveShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    scene.add(sun);

    // Земля
    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(12, 64),
      new THREE.MeshStandardMaterial({ color: 0x5a8f4a, roughness: 0.8 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // --- Объекты мира ---
    function addTree(x, z) {
      const g = new THREE.Group();
      const t = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.3, 2), new THREE.MeshStandardMaterial({ color: 0x8b5a2b }));
      t.position.y = 1;
      g.add(t);
      const l = new THREE.Mesh(new THREE.SphereGeometry(0.9), new THREE.MeshStandardMaterial({ color: 0x2d5a27 }));
      l.position.y = 2.2;
      g.add(l);
      g.position.set(x, 0, z);
      scene.add(g);
    }
    function addBush(x, z) {
      const b = new THREE.Mesh(new THREE.SphereGeometry(0.35), new THREE.MeshStandardMaterial({ color: 0x336633 }));
      b.position.set(x, 0.15, z);
      scene.add(b);
    }
    function addPuddle(x, z) {
      const p = new THREE.Mesh(new THREE.CircleGeometry(0.5, 16), new THREE.MeshStandardMaterial({ color: 0x8b6b4d, roughness: 0.1 }));
      p.rotation.x = -Math.PI / 2;
      p.position.set(x, 0.02, z);
      scene.add(p);
    }
    function addBarrier(x, z, color = 0xaa7744) {
      const box = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.8, 0.4), new THREE.MeshStandardMaterial({ color }));
      box.position.set(x, 0.4, z);
      box.castShadow = true;
      box.receiveShadow = true;
      scene.add(box);
    }

    // Поляна
    addTree(0, 0); // дерево пирожка
    addBush(2, 1.5);
    addBush(-2, -1.5);
    addBush(3.5, -3);
    addBush(-3.5, 3.5);
    addPuddle(4, -2);
    addPuddle(-4, 2.5);
    addPuddle(-5, -3);
    // Базы команд
    addBarrier(-5, -5, 0x4488ff); // Храпоглазы
    addBarrier(-4.5, -5.8, 0x4488ff);
    addBarrier(5, 5, 0xaa4444); // Зубоскалы
    addBarrier(5.5, 4.5, 0xaa4444);

    // --- Создание персонажа с аксессуарами ---
    const characters = [];

    function createCharacter(name, teamColor, features = {}) {
      const group = new THREE.Group();
      const skin = new THREE.MeshStandardMaterial({ color: 0xffccaa, roughness: 0.3 });
      const cloth = new THREE.MeshStandardMaterial({ color: teamColor, roughness: 0.5 });
      const pants = new THREE.MeshStandardMaterial({ color: 0x2244aa });
      const shoes = new THREE.MeshStandardMaterial({ color: 0x332211 });
      const hairMat = new THREE.MeshStandardMaterial({ color: 0x332211 });

      // Тело
      const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.33, 0.38, 1.1, 8), cloth);
      torso.position.y = 0.55;
      torso.castShadow = true; torso.receiveShadow = true;
      group.add(torso);
      // Голова
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.35, 16, 16), skin);
      head.position.y = 1.35;
      head.castShadow = true;
      group.add(head);
      // Глаза
      const eyeW = new THREE.MeshStandardMaterial({ color: 0xffffff });
      group.add(new THREE.Mesh(new THREE.SphereGeometry(0.1), eyeW).translate(-0.13, 1.45, 0.32));
      group.add(new THREE.Mesh(new THREE.SphereGeometry(0.1), eyeW).translate(0.13, 1.45, 0.32));
      group.add(new THREE.Mesh(new THREE.SphereGeometry(0.06), new THREE.MeshStandardMaterial({ color: 0x111122 })).translate(-0.13, 1.43, 0.38));
      group.add(new THREE.Mesh(new THREE.SphereGeometry(0.06), new THREE.MeshStandardMaterial({ color: 0x111122 })).translate(0.13, 1.43, 0.38));

      // Аксессуары
      if (features.hat) {
        const hat = new THREE.Mesh(new THREE.ConeGeometry(0.25, 0.3, 8), new THREE.MeshStandardMaterial({ color: features.hatColor || 0xff0000 }));
        hat.position.set(0, 1.7, 0);
        group.add(hat);
      }
      if (features.glasses) {
        const frame = new THREE.Mesh(new THREE.TorusGeometry(0.15, 0.04, 8, 16), new THREE.MeshStandardMaterial({ color: 0x000000 }));
        frame.position.set(-0.13, 1.45, 0.38);
        group.add(frame);
        const frame2 = frame.clone();
        frame2.position.set(0.13, 1.45, 0.38);
        group.add(frame2);
      }
      if (features.crown) {
        const crown = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.2, 0.2, 8), new THREE.MeshStandardMaterial({ color: 0xffdd44, roughness: 0.2 }));
        crown.position.set(0, 1.65, 0);
        group.add(crown);
      }

      // Конечности
      const armL = new THREE.Group(), armR = new THREE.Group();
      const uaGeo = new THREE.CylinderGeometry(0.09, 0.11, 0.55, 6);
      const faGeo = new THREE.CylinderGeometry(0.07, 0.09, 0.45, 6);
      const handGeo = new THREE.SphereGeometry(0.09);
      const makeArm = (side) => {
        const arm = new THREE.Group();
        arm.add(new THREE.Mesh(uaGeo, cloth).translateY(-0.25));
        arm.add(new THREE.Mesh(faGeo, skin).translateY(-0.7));
        arm.add(new THREE.Mesh(handGeo, skin).translateY(-1.0));
        return arm;
      };
      armL.add(makeArm('L'));
      armL.position.set(-0.52, 1.15, 0);
      group.add(armL);
      armR.add(makeArm('R'));
      armR.position.set(0.52, 1.15, 0);
      group.add(armR);

      const legL = new THREE.Group(), legR = new THREE.Group();
      const thighGeo = new THREE.CylinderGeometry(0.12, 0.14, 0.5, 6);
      const shinGeo = new THREE.CylinderGeometry(0.09, 0.12, 0.45, 6);
      const shoeGeo = new THREE.BoxGeometry(0.14, 0.1, 0.22);
      const makeLeg = () => {
        const leg = new THREE.Group();
        leg.add(new THREE.Mesh(thighGeo, pants).translateY(-0.22));
        leg.add(new THREE.Mesh(shinGeo, pants).translateY(-0.67));
        leg.add(new THREE.Mesh(shoeGeo, shoes).translateY(-0.9).translateZ(0.05));
        return leg;
      };
      legL.add(makeLeg());
      legL.position.set(-0.18, 0, 0);
      group.add(legL);
      legR.add(makeLeg());
      legR.position.set(0.18, 0, 0);
      group.add(legR);

      // Подпись
      const labelDiv = document.createElement('div');
      labelDiv.textContent = name;
      labelDiv.style.cssText = 'color:white; background:rgba(0,0,0,0.7); padding:2px 8px; border-radius:10px; font-size:11px;';
      const label = new CSS2DObject(labelDiv);
      label.position.set(0, 2.1, 0);
      group.add(label);

      // Облачко мыслей
      const thoughtDiv = document.createElement('div');
      thoughtDiv.className = 'thought-bubble';
      thoughtDiv.style.display = 'none';
      const thoughtLabel = new CSS2DObject(thoughtDiv);
      thoughtLabel.position.set(0, 2.5, 0);
      group.add(thoughtLabel);

      group.userData = {
        name, armL, armR, legL, legR, thoughtDiv, thoughtLabel,
        walkTarget: null,
        action: null,
        throwing: false,
        fallen: false,
        building: false
      };
      return group;
    }

    // --- Команды ---
    const captain = createCharacter('Ты (Артур)', 0xffaa33, { hat: true, hatColor: 0xffaa33, glasses: true });
    captain.position.set(0, 0, -1);
    scene.add(captain);
    characters.push(captain);

    const bryak = createCharacter('Бряк', 0x4488ff, { hat: true, hatColor: 0x4488ff });
    bryak.position.set(-3, 0, -3);
    scene.add(bryak);
    characters.push(bryak);

    const listik = createCharacter('Листик', 0x44aa44, { hat: true, hatColor: 0x44aa44, glasses: true });
    listik.position.set(-2, 0, -4.5);
    scene.add(listik);
    characters.push(listik);

    const grom = createCharacter('Гром', 0xaa4444, { hat: true, hatColor: 0xaa4444 });
    grom.position.set(-4, 0, -2);
    scene.add(grom);
    characters.push(grom);

    const zuban = createCharacter('Зубан', 0xcc6644, { crown: true });
    zuban.position.set(3.5, 0, 3.5);
    scene.add(zuban);
    characters.push(zuban);

    const dylda = createCharacter('Дылда', 0x6666aa, { hat: true, hatColor: 0x6666aa });
    dylda.position.set(4.5, 0, 2.5);
    scene.add(dylda);
    characters.push(dylda);

    const shustrya = createCharacter('Шустря', 0xaa88cc, { glasses: true });
    shustrya.position.set(2.5, 0, 4.5);
    scene.add(shustrya);
    characters.push(shustrya);

    const vorchun = createCharacter('Ворчун', 0x888888, { hat: true, hatColor: 0x666666 });
    vorchun.position.set(5, 0, 4);
    scene.add(vorchun);
    characters.push(vorchun);

    // --- Выбор персонажа ---
    let selectedChar = null;
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    renderer.domElement.addEventListener('click', (e) => {
      mouse.x = (e.clientX / renderer.domElement.clientWidth) * 2 - 1;
      mouse.y = -(e.clientY / renderer.domElement.clientHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(characters, true);
      if (intersects.length > 0) {
        const char = characters.find(c => c === intersects[0].object || c.children.includes(intersects[0].object));
        if (char) {
          selectedChar = char;
          document.getElementById('char-name').textContent = `Выбран: ${char.userData.name}`;
        }
      }
    });

    // --- Анимации действий ---
    document.getElementById('action-walk').addEventListener('click', () => {
      if (!selectedChar) return;
      selectedChar.userData.walkTarget = new THREE.Vector3(0, 0, 0); // к дереву
      selectedChar.userData.action = 'walk';
      showThought(selectedChar, 'Иду к пирожку!');
    });
    document.getElementById('action-throw').addEventListener('click', () => {
      if (!selectedChar) return;
      selectedChar.userData.action = 'throw';
      selectedChar.userData.throwing = true;
      showThought(selectedChar, 'Лови!');
      setTimeout(() => {
        if (selectedChar) {
          selectedChar.userData.throwing = false;
          selectedChar.userData.action = null;
        }
      }, 800);
    });
    document.getElementById('action-fall').addEventListener('click', () => {
      if (!selectedChar) return;
      selectedChar.userData.fallen = true;
      showThought(selectedChar, 'Ой!');
      setTimeout(() => {
        if (selectedChar) selectedChar.userData.fallen = false;
      }, 1500);
    });
    document.getElementById('action-build').addEventListener('click', () => {
      if (!selectedChar) return;
      selectedChar.userData.building = true;
      showThought(selectedChar, 'Строю...');
      setTimeout(() => {
        if (selectedChar) selectedChar.userData.building = false;
      }, 1500);
    });
    document.getElementById('action-wave').addEventListener('click', () => {
      if (!selectedChar) return;
      selectedChar.userData.action = 'wave';
      showThought(selectedChar, 'Привет!');
      setTimeout(() => {
        if (selectedChar) selectedChar.userData.action = null;
      }, 1200);
    });

    function showThought(char, text) {
      const td = char.userData.thoughtDiv;
      td.textContent = text;
      td.style.display = 'block';
      setTimeout(() => { td.style.display = 'none'; }, 3000);
    }

    // --- Игровой цикл ---
    function animate() {
      requestAnimationFrame(animate);
      characters.forEach(ch => {
        const ud = ch.userData;
        // Движение к цели
        if (ud.walkTarget) {
          const dir = ud.walkTarget.clone().sub(ch.position);
          const dist = dir.length();
          if (dist > 0.2) {
            dir.normalize();
            ch.position.add(dir.multiplyScalar(0.05));
            ch.lookAt(ud.walkTarget.x, ch.position.y, ud.walkTarget.z);
          } else {
            ud.walkTarget = null;
            ud.action = null;
          }
        }
        // Анимация конечностей
        const speed = ud.walkTarget ? 1 : 0;
        const t = Date.now() * 0.01;
        if (ud.armL) {
          if (ud.fallen) {
            // падение: раскинутые руки
            ud.armL.rotation.z = Math.PI / 4;
            ud.armR.rotation.z = -Math.PI / 4;
            ch.rotation.z = 0.3;
          } else if (ud.throwing) {
            // замах правой руки
            ud.armR.rotation.x = Math.sin(t * 20) * 0.5 - 1.5;
            ud.armL.rotation.x = 0;
          } else if (ud.building) {
            ud.armR.rotation.x = Math.sin(t * 15) * 0.8;
            ud.armL.rotation.x = Math.cos(t * 15) * 0.8;
          } else if (ud.action === 'wave') {
            ud.armR.rotation.x = Math.sin(t * 15) * 1.2;
            ud.armL.rotation.x = 0;
          } else {
            ud.armL.rotation.x = Math.sin(t + ch.id) * 0.4 * speed;
            ud.armR.rotation.x = Math.sin(t + ch.id + Math.PI) * 0.4 * speed;
            ud.legL.rotation.x = Math.sin(t + ch.id + Math.PI / 2) * 0.35 * speed;
            ud.legR.rotation.x = Math.sin(t + ch.id - Math.PI / 2) * 0.35 * speed;
            if (!speed) {
              ud.armL.rotation.x = 0;
              ud.armR.rotation.x = 0;
              ud.legL.rotation.x = 0;
              ud.legR.rotation.x = 0;
            }
          }
        }
        if (!ud.fallen) ch.rotation.z = 0;
      });
      controls.update();
      renderer.render(scene, camera);
      labelRenderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      labelRenderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
