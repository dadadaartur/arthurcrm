<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Битва за Пирожок — Рабочая версия</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; font-family: Arial; }
    #ui {
      position: absolute; top: 20px; left: 20px; color: white;
      background: rgba(0,0,0,0.6); padding: 10px; border-radius: 8px;
      pointer-events: none; z-index: 10;
    }
    #victory {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      color: gold; font-size: 3rem; background: rgba(0,0,0,0.8); padding: 20px;
      border-radius: 20px; display: none; z-index: 20;
    }
  </style>
</head>
<body>
  <div id="ui">
    <div>🛡️ Ты: Артур</div>
    <div>💀 Врагов: <span id="enemy-count">2</span> | Оглушено: <span id="stunned-count">0</span></div>
    <div id="item-hold">🎒 Пусто</div>
    <div>WASD / стрелки — ходьба | E — подобрать | ПРОБЕЛ — бросок</div>
  </div>
  <div id="victory">🏆 ПИРОЖОК ТВОЙ!<br><small>Все враги оглушены</small></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // ==================== СЦЕНА ====================
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.5, 150);
    camera.position.set(0, 10, 8);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0x99bbff, 0.7));
    const sun = new THREE.DirectionalLight(0xfff5e6, 1);
    sun.position.set(40, 60, 30);
    scene.add(sun);

    // Земля
    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(30, 32),
      new THREE.MeshStandardMaterial({ color: 0x7ec850 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // Деревья
    for (let i = 0; i < 15; i++) {
      const a = Math.random() * Math.PI * 2, r = 10 + Math.random() * 20;
      const tree = new THREE.Group();
      const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.2, 0.3, 2),
        new THREE.MeshStandardMaterial({ color: 0x8b5a2b })
      );
      trunk.position.y = 1;
      tree.add(trunk);
      const foliage = new THREE.Mesh(
        new THREE.SphereGeometry(1, 6),
        new THREE.MeshStandardMaterial({ color: 0x2d5a27 })
      );
      foliage.position.y = 2.5;
      tree.add(foliage);
      tree.position.set(Math.cos(a) * r, 0, Math.sin(a) * r);
      scene.add(tree);
    }

    // ==================== ПРЕДМЕТЫ ====================
    const throwables = [];
    function addItem(x, z, type) {
      let geo, mat;
      switch(type) {
        case 'stone': geo = new THREE.SphereGeometry(0.22); mat = new THREE.MeshStandardMaterial({ color: 0x888888 }); break;
        case 'apple': geo = new THREE.SphereGeometry(0.25); mat = new THREE.MeshStandardMaterial({ color: 0xe74c3c }); break;
        case 'stick': geo = new THREE.CylinderGeometry(0.1, 0.12, 0.5); mat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b }); break;
        default: geo = new THREE.SphereGeometry(0.2); mat = new THREE.MeshStandardMaterial({ color: 0x6b4c3b });
      }
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(x, 0.2, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);
      throwables.push({ mesh, vel: new THREE.Vector3(), holder: null, type });
    }

    // Создаём начальные предметы
    for (let i = 0; i < 40; i++) {
      const a = Math.random() * Math.PI * 2, r = 5 + Math.random() * 25;
      const types = ['stone','apple','stick','mud'];
      addItem(Math.cos(a) * r, Math.sin(a) * r, types[Math.floor(Math.random() * types.length)]);
    }

    // Восполнение предметов (каждые 5 секунд)
    setInterval(() => {
      const freeItems = throwables.filter(t => !t.holder && t.vel.length() === 0);
      if (freeItems.length < 15) {
        const a = Math.random() * Math.PI * 2, r = 8 + Math.random() * 15;
        const types = ['stone','apple','stick'];
        addItem(player.position.x + Math.cos(a) * r, player.position.z + Math.sin(a) * r, types[Math.floor(Math.random() * types.length)]);
      }
    }, 5000);

    // ==================== ПЕРСОНАЖИ ====================
    function createChar(name, color, pos, isPlayer = false) {
      const g = new THREE.Group();
      const body = new THREE.Mesh(
        new THREE.CylinderGeometry(0.35, 0.4, 1.2, 8),
        new THREE.MeshStandardMaterial({ color })
      );
      body.position.y = 0.6;
      body.castShadow = true;
      body.receiveShadow = true;
      g.add(body);

      const head = new THREE.Mesh(
        new THREE.SphereGeometry(0.35, 8),
        new THREE.MeshStandardMaterial({ color: 0xffccaa })
      );
      head.position.y = 1.4;
      head.castShadow = true;
      g.add(head);

      // Глаза
      const eyeWhite = new THREE.Mesh(
        new THREE.SphereGeometry(0.1),
        new THREE.MeshStandardMaterial({ color: 0xffffff })
      );
      eyeWhite.position.set(-0.13, 1.5, 0.33);
      g.add(eyeWhite);
      const eyeWhite2 = eyeWhite.clone();
      eyeWhite2.position.set(0.13, 1.5, 0.33);
      g.add(eyeWhite2);

      // Зрачки
      const pupil = new THREE.Mesh(
        new THREE.SphereGeometry(0.05),
        new THREE.MeshStandardMaterial({ color: 0x111122 })
      );
      pupil.position.set(-0.13, 1.48, 0.4);
      g.add(pupil);
      const pupil2 = pupil.clone();
      pupil2.position.set(0.13, 1.48, 0.4);
      g.add(pupil2);

      // Рот
      const mouth = new THREE.Mesh(
        new THREE.TorusGeometry(0.1, 0.03, 6, 12, Math.PI),
        new THREE.MeshStandardMaterial({ color: 0x552222 })
      );
      mouth.position.set(0, 1.25, 0.36);
      mouth.rotation.x = 0.2;
      g.add(mouth);

      if (isPlayer) {
        const hat = new THREE.Mesh(
          new THREE.ConeGeometry(0.25, 0.3, 8),
          new THREE.MeshStandardMaterial({ color: 0xffaa33 })
        );
        hat.position.y = 1.75;
        hat.castShadow = true;
        g.add(hat);
      }

      // Руки
      const armGeo = new THREE.CylinderGeometry(0.08, 0.1, 0.8, 6);
      const armMat = new THREE.MeshStandardMaterial({ color });
      const armL = new THREE.Group();
      armL.add(new THREE.Mesh(armGeo, armMat).translateY(-0.4));
      armL.position.set(-0.55, 1.1, 0);
      g.add(armL);
      const armR = new THREE.Group();
      armR.add(new THREE.Mesh(armGeo, armMat).translateY(-0.4));
      armR.position.set(0.55, 1.1, 0);
      g.add(armR);

      // Ноги
      const legGeo = new THREE.CylinderGeometry(0.12, 0.14, 0.7, 6);
      const legMat = new THREE.MeshStandardMaterial({ color: 0x2244aa });
      const legL = new THREE.Group();
      legL.add(new THREE.Mesh(legGeo, legMat).translateY(-0.35));
      legL.position.set(-0.2, 0, 0);
      g.add(legL);
      const legR = new THREE.Group();
      legR.add(new THREE.Mesh(legGeo, legMat).translateY(-0.35));
      legR.position.set(0.2, 0, 0);
      g.add(legR);

      g.position.set(pos.x, 0, pos.z);
      g.castShadow = true;
      g.receiveShadow = true;
      scene.add(g);

      g.userData = {
        name,
        team: color,
        stunned: false,
        held: null,
        lastThrow: 0,
        speed: 0.08,
        isPlayer,
        target: null,
        originalColor: color
      };
      return g;
    }

    const player = createChar('Артур', 0x4488ff, new THREE.Vector3(0, 0, 0), true);
    const enemies = [
      createChar('Зубан', 0xcc6644, new THREE.Vector3(10, 0, 5)),
      createChar('Шустря', 0xaa88cc, new THREE.Vector3(-8, 0, -10))
    ];

    // ==================== УПРАВЛЕНИЕ (РАБОТАЕТ НА ЛЮБОЙ РАСКЛАДКЕ) ====================
    const keys = {};
    window.addEventListener('keydown', e => {
      keys[e.code] = true;
      if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) {
        e.preventDefault();
      }
    });
    window.addEventListener('keyup', e => {
      keys[e.code] = false;
    });

    function pickUp(char) {
      if (char.userData.held) return;
      let closest = null, minDist = 1.8;
      throwables.forEach(t => {
        if (!t.holder) {
          const d = char.position.distanceTo(t.mesh.position);
          if (d < minDist) {
            minDist = d;
            closest = t;
          }
        }
      });
      if (closest) {
        char.userData.held = closest;
        closest.holder = char;
        scene.remove(closest.mesh);
      }
    }

    function throwItem(char, power = 0.8) {
      if (!char.userData.held) return;
      if (Date.now() - char.userData.lastThrow < 1000) return;
      char.userData.lastThrow = Date.now();

      const item = char.userData.held;
      item.holder = null;
      char.userData.held = null;

      item.mesh.position.copy(char.position);
      item.mesh.position.y += 1.2;
      const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(char.quaternion);
      item.vel.copy(forward.multiplyScalar(7 + power * 5));
      item.vel.y = 4 + power * 4;

      scene.add(item.mesh);
    }

    function stun(char) {
      if (char.userData.stunned) return;
      char.userData.stunned = true;
      // Визуальный эффект
      char.children[0].material.color.set(0xff0000);
      const origY = char.position.y;
      char.position.y += 0.5;
      setTimeout(() => {
        char.position.y = origY;
        char.userData.stunned = false;
        if (char.children[0].material) {
          char.children[0].material.color.set(char.userData.originalColor);
        }
      }, 1500);
    }

    // ==================== ИИ ВРАГОВ ====================
    function updateEnemy(enemy) {
      if (enemy.userData.stunned) return;
      const distToPlayer = enemy.position.distanceTo(player.position);
      const dirToPlayer = new THREE.Vector3().subVectors(player.position, enemy.position).normalize();

      if (distToPlayer > 3) {
        enemy.position.add(dirToPlayer.multiplyScalar(enemy.userData.speed));
        enemy.lookAt(player.position.x, enemy.position.y, player.position.z);
      } else {
        if (!enemy.userData.held) pickUp(enemy);
        if (enemy.userData.held && Date.now() - enemy.userData.lastThrow > 1500) {
          throwItem(enemy, 0.6);
        }
      }
    }

    // ==================== ГЛАВНЫЙ ЦИКЛ ====================
    function update() {
      if (!player.userData.stunned) {
        const speed = 0.1;
        const moveVec = new THREE.Vector3();
        if (keys['KeyW'] || keys['ArrowUp']) moveVec.z -= 1;
        if (keys['KeyS'] || keys['ArrowDown']) moveVec.z += 1;
        if (keys['KeyA'] || keys['ArrowLeft']) moveVec.x -= 1;
        if (keys['KeyD'] || keys['ArrowRight']) moveVec.x += 1;
        if (moveVec.length() > 0) {
          moveVec.normalize().multiplyScalar(speed);
          player.position.add(moveVec);
          player.lookAt(player.position.clone().add(moveVec));
        }
        if (keys['KeyE']) { pickUp(player); keys['KeyE'] = false; }
        if (keys['Space']) { throwItem(player, 0.7); keys['Space'] = false; }
      }

      // Камера
      const camOffset = new THREE.Vector3(0, 6, 8);
      camera.position.copy(player.position.clone().add(camOffset));
      camera.lookAt(player.position.x, player.position.y + 1, player.position.z);

      // ИИ
      enemies.forEach(e => updateEnemy(e));

      // Физика предметов
      for (let i = throwables.length - 1; i >= 0; i--) {
        const t = throwables[i];
        if (t.holder) continue;

        t.mesh.position.add(t.vel.clone().multiplyScalar(0.16));
        t.vel.y -= 0.3;

        if (t.mesh.position.y < 0.15) {
          t.mesh.position.y = 0.15;
          t.vel.set(0, 0, 0);
        }

        const allChars = [player, ...enemies];
        for (const c of allChars) {
          if (c === t.holder || c.userData.stunned) continue;
          if (c.position.distanceTo(t.mesh.position) < 1.0 && t.vel.length() > 0.5) {
            stun(c);
            t.vel.set(0, 0, 0);
            scene.remove(t.mesh);
            throwables.splice(i, 1);
            break;
          }
        }
      }

      // UI
      const stunnedCount = enemies.filter(e => e.userData.stunned).length;
      document.getElementById('enemy-count').textContent = enemies.length;
      document.getElementById('stunned-count').textContent = stunnedCount;
      document.getElementById('item-hold').textContent = player.userData.held
        ? '🎒 ' + player.userData.held.type
        : '🎒 Пусто';

      if (enemies.length > 0 && enemies.every(e => e.userData.stunned)) {
        document.getElementById('victory').style.display = 'block';
      } else {
        document.getElementById('victory').style.display = 'none';
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
