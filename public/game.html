<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Битва за Пирожок · Стабильная версия</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #000; }
    #ui {
      position: absolute; top: 20px; left: 20px; color: white;
      background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); padding: 10px 15px;
      border-radius: 12px; pointer-events: none; z-index: 10;
    }
    #crosshair {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 24px; height: 24px; pointer-events: none; z-index: 10;
    }
    #crosshair::before, #crosshair::after {
      content: ''; position: absolute; background: rgba(255,255,255,0.9);
    }
    #crosshair::before { width: 2px; height: 24px; left: 11px; top: 0; }
    #crosshair::after { width: 24px; height: 2px; left: 0; top: 11px; }
    .hint {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.6); color: #ccc; padding: 6px 16px; border-radius: 20px;
      font-size: 12px; pointer-events: none; z-index: 10;
    }
    .thought {
      color: #ff0; background: rgba(0,0,0,0.8); padding: 2px 8px; border-radius: 10px;
      font-size: 10px; position: absolute; transform: translate(-50%, -100%);
      pointer-events: none; white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="ui">
    <div>🛡️ Союзников: <span id="ally-count">4</span></div>
    <div>💀 Врагов: <span id="enemy-count">4</span></div>
    <div id="item-indicator">🎒 Пусто</div>
  </div>
  <div id="crosshair"></div>
  <div class="hint">Кликните для захвата мыши | WASD – движение | E – подобрать | Левая кнопка мыши (зажать и отпустить) – бросок</div>

  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.128.0/build/three.module.js" } }
  </script>

  <script type="module">
    import * as THREE from 'three';

    // ======================== НАСТРОЙКИ ========================
    const WORLD_SIZE = 100;
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);

    const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.5, 200);
    camera.position.set(0, 6, 10);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    // Освещение
    scene.add(new THREE.AmbientLight(0x99bbff, 0.7));
    const sun = new THREE.DirectionalLight(0xfff5e6, 1.1);
    sun.position.set(40, 70, 30);
    sun.castShadow = true; sun.receiveShadow = true;
    sun.shadow.mapSize.set(1024, 1024);
    scene.add(sun);

    // ---------- Земля ----------
    const groundCanvas = document.createElement('canvas');
    groundCanvas.width = 1024; groundCanvas.height = 1024;
    const gctx = groundCanvas.getContext('2d');
    gctx.fillStyle = '#7ec850'; gctx.fillRect(0, 0, 1024, 1024);
    for (let i = 0; i < 4000; i++) {
      gctx.fillStyle = ['#5a9e3a', '#8ccf5a', '#f0e68c', '#ffb6c1', '#ffd700'][Math.floor(Math.random() * 5)];
      gctx.fillRect(Math.random() * 1024, Math.random() * 1024, 4, 4);
    }
    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(WORLD_SIZE, 64),
      new THREE.MeshStandardMaterial({ map: new THREE.CanvasTexture(groundCanvas), roughness: 0.9 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // ---------- Декорации ----------
    function addTree(x, z, s = 1) {
      const g = new THREE.Group();
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.2 * s, 0.3 * s, 2.5 * s), new THREE.MeshStandardMaterial({ color: 0x8b5a2b }));
      trunk.position.y = 1.25 * s; g.add(trunk);
      const leaves = new THREE.Mesh(new THREE.SphereGeometry(1.2 * s, 8), new THREE.MeshStandardMaterial({ color: 0x2d5a27 }));
      leaves.position.y = 2.8 * s; g.add(leaves);
      g.position.set(x, 0, z); scene.add(g);
    }
    function addBush(x, z, s = 0.5) {
      const b = new THREE.Mesh(new THREE.SphereGeometry(s, 6), new THREE.MeshStandardMaterial({ color: 0x336633 }));
      b.position.set(x, s * 0.4, z); scene.add(b);
    }
    function addBarrier(x, z, color = 0xaa7744) {
      const b = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.9, 0.5), new THREE.MeshStandardMaterial({ color }));
      b.position.set(x, 0.45, z); b.castShadow = true; b.receiveShadow = true; scene.add(b);
    }
    // Разбросаем объекты
    for (let i = 0; i < 80; i++) {
      const a = Math.random() * Math.PI * 2;
      const r = 15 + Math.random() * (WORLD_SIZE - 20);
      const x = Math.cos(a) * r, z = Math.sin(a) * r;
      if (Math.random() < 0.6) addTree(x, z, 0.5 + Math.random() * 0.7);
      else addBush(x, z, 0.3 + Math.random() * 0.5);
    }
    addTree(0, 0, 2.5); // Центральное дерево
    // Базы
    for (let i = 0; i < 6; i++) addBarrier(-20 + i * 1.2, -18, 0x4488ff);
    for (let i = 0; i < 6; i++) addBarrier(18 + i * 1.2, 18, 0xaa4444);
    // Центральный забор
    for (let i = -15; i <= 15; i += 1.2) {
      addBarrier(i, -2, 0xcccccc);
      addBarrier(i, 2, 0xcccccc);
    }

    // ---------- Предметы ----------
    const throwables = [];
    function createItemMesh(type) {
      let geo, mat;
      switch (type) {
        case 'stone': geo = new THREE.SphereGeometry(0.2); mat = new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 0.7 }); break;
        case 'apple': geo = new THREE.SphereGeometry(0.22); mat = new THREE.MeshStandardMaterial({ color: 0xe74c3c, roughness: 0.4 }); break;
        case 'stick': geo = new THREE.CylinderGeometry(0.1, 0.12, 0.5); mat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b }); break;
        case 'pumpkin': geo = new THREE.SphereGeometry(0.3); mat = new THREE.MeshStandardMaterial({ color: 0xff8c00, roughness: 0.5 }); break;
        case 'watermelon': geo = new THREE.SphereGeometry(0.32); mat = new THREE.MeshStandardMaterial({ color: 0x2e8b57, roughness: 0.4 }); break;
        default: geo = new THREE.SphereGeometry(0.18); mat = new THREE.MeshStandardMaterial({ color: 0x6b4c3b }); break;
      }
      return new THREE.Mesh(geo, mat);
    }
    function addThrowable(x, z, type) {
      const mesh = createItemMesh(type);
      mesh.position.set(x, 0.2, z);
      mesh.castShadow = true; mesh.receiveShadow = true;
      scene.add(mesh);
      throwables.push({ mesh, velocity: new THREE.Vector3(), holder: null, type });
    }
    const types = ['stone', 'apple', 'stick', 'pumpkin', 'watermelon', 'mud'];
    for (let i = 0; i < 80; i++) {
      const a = Math.random() * Math.PI * 2;
      const r = 12 + Math.random() * 70;
      addThrowable(Math.cos(a) * r, Math.sin(a) * r, types[Math.floor(Math.random() * types.length)]);
    }

    // ---------- Персонажи ----------
    const allies = [], enemies = [];
    function createCharacter(name, teamColor, pos) {
      const group = new THREE.Group();
      const bodyMat = new THREE.MeshStandardMaterial({ color: teamColor });
      const skinMat = new THREE.MeshStandardMaterial({ color: 0xffccaa, roughness: 0.3 });
      const pantsMat = new THREE.MeshStandardMaterial({ color: 0x2244aa });
      const shoeMat = new THREE.MeshStandardMaterial({ color: 0x332211 });

      const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.4, 1.2, 8), bodyMat);
      torso.position.y = 0.6; torso.castShadow = true; group.add(torso);
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.35, 16), skinMat);
      head.position.y = 1.4; head.castShadow = true; group.add(head);
      const eyeWhite = new THREE.MeshStandardMaterial({ color: 0xffffff });
      const leftEye = new THREE.Mesh(new THREE.SphereGeometry(0.1), eyeWhite);
      leftEye.position.set(-0.13, 1.5, 0.33); group.add(leftEye);
      const rightEye = leftEye.clone(); rightEye.position.set(0.13, 1.5, 0.33); group.add(rightEye);
      const pupilMat = new THREE.MeshStandardMaterial({ color: 0x111122 });
      const leftPupil = new THREE.Mesh(new THREE.SphereGeometry(0.05), pupilMat);
      leftPupil.position.set(-0.13, 1.48, 0.4); group.add(leftPupil);
      const rightPupil = leftPupil.clone(); rightPupil.position.set(0.13, 1.48, 0.4); group.add(rightPupil);
      const mouth = new THREE.Mesh(new THREE.TorusGeometry(0.1, 0.03, 6, 12, Math.PI), new THREE.MeshStandardMaterial({ color: 0x552222 }));
      mouth.position.set(0, 1.3, 0.35); mouth.rotation.x = 0.2; group.add(mouth);

      // Конечности
      const armL = new THREE.Group(), armR = new THREE.Group();
      const upperArmGeo = new THREE.CylinderGeometry(0.1, 0.12, 0.6, 6);
      const forearmGeo = new THREE.CylinderGeometry(0.08, 0.1, 0.5, 6);
      const handGeo = new THREE.SphereGeometry(0.09);
      armL.add(new THREE.Mesh(upperArmGeo, bodyMat).translateY(-0.3));
      armL.add(new THREE.Mesh(forearmGeo, skinMat).translateY(-0.8));
      armL.add(new THREE.Mesh(handGeo, skinMat).translateY(-1.1));
      armL.position.set(-0.55, 1.2, 0); group.add(armL);
      armR.add(new THREE.Mesh(upperArmGeo, bodyMat).translateY(-0.3));
      armR.add(new THREE.Mesh(forearmGeo, skinMat).translateY(-0.8));
      armR.add(new THREE.Mesh(handGeo, skinMat).translateY(-1.1));
      armR.position.set(0.55, 1.2, 0); group.add(armR);

      const legL = new THREE.Group(), legR = new THREE.Group();
      const thighGeo = new THREE.CylinderGeometry(0.13, 0.15, 0.55, 6);
      const shinGeo = new THREE.CylinderGeometry(0.1, 0.13, 0.5, 6);
      const shoeGeo = new THREE.BoxGeometry(0.15, 0.1, 0.25);
      legL.add(new THREE.Mesh(thighGeo, pantsMat).translateY(-0.25));
      legL.add(new THREE.Mesh(shinGeo, pantsMat).translateY(-0.75));
      legL.add(new THREE.Mesh(shoeGeo, shoeMat).translateY(-1.0).translateZ(0.06));
      legL.position.set(-0.2, 0, 0); group.add(legL);
      legR.add(new THREE.Mesh(thighGeo, pantsMat).translateY(-0.25));
      legR.add(new THREE.Mesh(shinGeo, pantsMat).translateY(-0.75));
      legR.add(new THREE.Mesh(shoeGeo, shoeMat).translateY(-1.0).translateZ(0.06));
      legR.position.set(0.2, 0, 0); group.add(legR);

      group.position.copy(pos);
      scene.add(group);
      group.userData = {
        name, team: teamColor, stunned: false, heldItem: null,
        lastThrow: 0, lastPickup: 0, armL, armR, legL, legR,
        falling: false
      };
      return group;
    }

    const player = createCharacter('Артур', 0xffaa33, new THREE.Vector3(-5, 0, -5));
    allies.push(player);
    allies.push(createCharacter('Бряк', 0x4488ff, new THREE.Vector3(-15, 0, -15)));
    allies.push(createCharacter('Листик', 0x44aa44, new THREE.Vector3(-12, 0, -18)));
    allies.push(createCharacter('Гром', 0xaa4444, new THREE.Vector3(-18, 0, -12)));

    enemies.push(createCharacter('Зубан', 0xcc6644, new THREE.Vector3(15, 0, 15)));
    enemies.push(createCharacter('Дылда', 0x6666aa, new THREE.Vector3(12, 0, 18)));
    enemies.push(createCharacter('Шустря', 0xaa88cc, new THREE.Vector3(18, 0, 12)));
    enemies.push(createCharacter('Ворчун', 0x888888, new THREE.Vector3(16, 0, 16)));

    // ======================== УПРАВЛЕНИЕ ========================
    const keys = {};
    window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; e.preventDefault(); });
    window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; e.preventDefault(); });
    let mouseX = 0, mouseY = 0;
    window.addEventListener('mousemove', e => { mouseX = e.movementX; mouseY = e.movementY; });
    renderer.domElement.addEventListener('click', () => renderer.domElement.requestPointerLock());
    document.addEventListener('pointerlockchange', () => {
      document.getElementById('crosshair').style.display = document.pointerLockElement ? 'block' : 'none';
    });
    let yaw = 0, pitch = 0;
    let throwStart = 0, isThrowing = false;
    window.addEventListener('mousedown', e => { if (e.button === 0) { isThrowing = true; throwStart = performance.now(); } });
    window.addEventListener('mouseup', e => {
      if (e.button === 0 && isThrowing) {
        const power = Math.min((performance.now() - throwStart) / 800, 1.0);
        throwItem(player, power);
        isThrowing = false;
      }
    });

    function pickUpItem(char) {
      if (char.userData.heldItem) return;
      const now = performance.now() / 1000;
      if (now - char.userData.lastPickup < 0.5) return;
      let closest = null, minDist = 1.6;
      for (const t of throwables) {
        if (t.holder || t.velocity.length() > 0.1) continue;
        const d = char.position.distanceTo(t.mesh.position);
        if (d < minDist) { minDist = d; closest = t; }
      }
      if (closest) {
        char.userData.heldItem = closest;
        closest.holder = char;
        scene.remove(closest.mesh);
        char.userData.lastPickup = now;
      }
    }

    function throwItem(char, power) {
      if (!char.userData.heldItem) return;
      const item = char.userData.heldItem;
      item.holder = null; char.userData.heldItem = null;
      item.mesh.position.copy(char.position).add(new THREE.Vector3(0, 1.2, 0));
      const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(char.quaternion);
      item.velocity.copy(dir.multiplyScalar(6 + power * 10));
      item.velocity.y = 4 + power * 5;
      scene.add(item.mesh);
      char.userData.lastThrow = performance.now() / 1000;
    }

    function stun(char, duration = 1500) {
      if (char.userData.stunned) return;
      char.userData.stunned = true; char.userData.falling = true;
      setTimeout(() => { char.userData.stunned = false; char.userData.falling = false; }, duration);
    }

    // ======================== ИИ ========================
    function updateAI(npc, delta) {
      if (npc.userData.stunned) return;
      const enemiesList = (npc.userData.team === 0x4488ff || npc.userData.team === 0x44aa44 || npc.userData.team === 0xaa4444 || npc.userData.team === 0xffaa33) ? enemies : allies;
      if (enemiesList.length === 0) return;
      // Выбираем ближайшего врага
      let target = null, minDist = Infinity;
      enemiesList.forEach(e => {
        const d = npc.position.distanceTo(e.position);
        if (d < minDist) { minDist = d; target = e; }
      });
      if (!target) return;
      const dist = minDist;
      // Если далеко – идём, если близко – атакуем
      if (dist > 2.5) {
        const dir = target.position.clone().sub(npc.position).normalize();
        npc.position.add(dir.multiplyScalar(0.05));
        npc.lookAt(target.position.x, npc.position.y, target.position.z);
      } else {
        if (!npc.userData.heldItem) pickUpItem(npc);
        if (npc.userData.heldItem && performance.now() / 1000 - npc.userData.lastThrow > 1.8) {
          throwItem(npc, 0.5 + Math.random() * 0.3);
        }
      }
    }

    // ======================== ОСНОВНОЙ ЦИКЛ ========================
    function update() {
      const now = performance.now();
      // Управление игроком
      if (!player.userData.stunned) {
        const speed = 0.12;
        if (keys['w']) player.position.z -= speed;
        if (keys['s']) player.position.z += speed;
        if (keys['a']) player.position.x -= speed;
        if (keys['d']) player.position.x += speed;
        if (keys['e']) { pickUpItem(player); keys['e'] = false; }
      }
      // Камера
      if (document.pointerLockElement) {
        yaw -= mouseX * 0.002;
        pitch -= mouseY * 0.002;
        pitch = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, pitch));
        mouseX = 0; mouseY = 0;
      }
      const camDist = 5.5, camHeight = 2.2;
      camera.position.set(
        player.position.x + Math.sin(yaw) * camDist,
        player.position.y + camHeight,
        player.position.z + Math.cos(yaw) * camDist
      );
      camera.lookAt(player.position.x, player.position.y + 1.2, player.position.z);
      player.rotation.y = yaw;

      // ИИ
      allies.forEach(a => { if (a !== player) updateAI(a); });
      enemies.forEach(e => updateAI(e));

      // Физика снарядов
      for (let i = throwables.length - 1; i >= 0; i--) {
        const t = throwables[i];
        if (t.holder || t.velocity.length() < 0.1) continue;
        t.mesh.position.add(t.velocity.clone().multiplyScalar(0.16));
        t.velocity.y -= 0.25;
        if (t.mesh.position.y < 0.2) { t.mesh.position.y = 0.1; t.velocity.set(0, 0, 0); }
        for (const team of [allies, enemies]) {
          for (const c of team) {
            if (c === t.holder) continue;
            if (c.position.distanceTo(t.mesh.position) < 0.9 && t.velocity.length() > 0.5) {
              stun(c);
              t.velocity.set(0, 0, 0);
              scene.remove(t.mesh);
              throwables.splice(i, 1);
              break;
            }
          }
        }
      }

      // Анимации конечностей
      const allChars = [player, ...allies, ...enemies];
      allChars.forEach(c => {
        if (c.userData.falling) {
          c.userData.armL.rotation.z = Math.PI / 4;
          c.userData.armR.rotation.z = -Math.PI / 4;
          c.rotation.z = 0.2;
        } else {
          c.rotation.z = 0;
          c.userData.armL.rotation.z = 0;
          c.userData.armR.rotation.z = 0;
        }
      });

      // UI
      document.getElementById('ally-count').textContent = allies.filter(a => !a.userData.stunned).length;
      document.getElementById('enemy-count').textContent = enemies.filter(e => !e.userData.stunned).length;
      document.getElementById('item-indicator').textContent = player.userData.heldItem ? '🎒 ' + player.userData.heldItem.type : '🎒 Пусто';
    }

    function animate() {
      requestAnimationFrame(animate);
      update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    console.log('✅ Игра запущена! Кликните на экран для захвата мыши.');
  </script>
</body>
</html>
