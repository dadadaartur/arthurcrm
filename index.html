<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Пульт управления — Артур Галкин</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', 'Comic Sans MS', sans-serif;
            background: #fff4e6;
            color: #1a2634;
            display: flex;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            cursor: default;
        }
        input, textarea, [contenteditable] { user-select: text; cursor: text; }

        .tropical-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0;
            pointer-events: none;
            background: linear-gradient(180deg, #87CEEB 0%, #FFDAB9 60%, #FFE4B5 100%);
        }
        .sun {
            position: absolute; top: 25px; right: 70px; width: 100px; height: 100px;
            background: #FFD700; border-radius: 50%;
            box-shadow: 0 0 120px 30px #FFA500, 0 0 200px 60px #FF8C00, 0 0 300px 100px rgba(255,140,0,0.4);
        }
        .ocean {
            position: absolute; bottom: 10%; left: 0; width: 100%; height: 40%;
            background: linear-gradient(180deg, #40E0D0 0%, #00CED1 50%, #20B2AA 100%);
            animation: wave 7s ease-in-out infinite;
        }
        @keyframes wave { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        .beach {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 20%;
            background: linear-gradient(180deg, #FFE4B5 0%, #FFDAB9 100%);
            border-radius: 30% 40% 0 0;
        }
        .palm-tree { position: absolute; bottom: 8%; font-size: 80px; filter: drop-shadow(0 4px 10px rgba(0,0,0,0.25)); }

        .sailboat-horizon {
            position: absolute; bottom: 55%; left: 70%; font-size: 40px;
            animation: sailHorizon 95s linear infinite;
        }
        @keyframes sailHorizon { 0% { left: 70%; } 100% { left: 10%; } }

        .airplane-group {
            position: absolute; bottom: 25%; right: -5%;
            animation: airplaneFly 180s linear infinite;
        }
        @keyframes airplaneFly {
            0% { right: -5%; bottom: 25%; }
            5% { bottom: 28%; }
            50% { right: 65%; bottom: 44%; }
            90% { right: 90%; bottom: 56%; }
            100% { right: 105%; bottom: 60%; }
        }
        .airplane-dot {
            width: 6px; height: 6px; background: white; border-radius: 50%;
            position: absolute; top: -3px; right: 0;
            box-shadow: 0 0 6px white;
        }
        .contrail-line {
            position: absolute; top: 0; right: 6px; height: 2px;
            background: linear-gradient(90deg, rgba(255,255,255,0.85), transparent);
            border-radius: 2px;
            animation: trailLength 180s linear infinite;
        }
        @keyframes trailLength {
            0% { width: 0%; opacity: 0; }
            5% { width: 10%; opacity: 1; }
            50% { width: 60%; opacity: 1; }
            90% { width: 30%; opacity: 0.8; }
            100% { width: 0%; opacity: 0; }
        }

        .sidebar {
            width: 280px; background: rgba(255,255,255,0.8); backdrop-filter: blur(25px);
            border-right: 1px solid rgba(0,0,0,0.05); display: flex; flex-direction: column;
            padding: 32px 20px; z-index: 10; position: relative;
        }
        .sidebar-header { font-size: 26px; font-weight: 700; margin-bottom: 40px; display: flex; align-items: center; gap: 6px; line-height: 1.2; letter-spacing: 1px; color: #2E3B2E; }
        .nav-item {
            padding: 12px 20px; border-radius: 16px; font-weight: 600; cursor: pointer;
            display: flex; align-items: center; gap: 12px; font-size: 16px; margin-bottom: 10px;
            transition: all 0.3s ease; border: 1px solid transparent; color: #2E3B2E;
        }
        .nav-item[data-page="dashboard"] { background: linear-gradient(135deg, rgba(255,160,122,0.2), rgba(255,180,160,0.3)); }
        .nav-item[data-page="backlog"] { background: linear-gradient(135deg, rgba(255,220,100,0.2), rgba(255,240,150,0.3)); }
        .nav-item[data-page="scheme"] { background: linear-gradient(135deg, rgba(130,180,255,0.2), rgba(180,210,255,0.3)); }
        .nav-item[data-page="ideas"] { background: linear-gradient(135deg, rgba(160,240,160,0.2), rgba(200,255,200,0.3)); }
        .nav-item[data-page="prototypes"] { background: linear-gradient(135deg, rgba(255,150,200,0.2), rgba(255,190,220,0.3)); }
        .nav-item[data-page="hrdnk"] { background: linear-gradient(135deg, rgba(200,160,255,0.2), rgba(220,190,255,0.3)); }
        .nav-item[data-page="knowledge"] { background: linear-gradient(135deg, rgba(255,230,80,0.2), rgba(255,250,120,0.3)); }
        .nav-item[data-page="settings"] { background: linear-gradient(135deg, rgba(210,190,250,0.2), rgba(240,220,255,0.3)); }
        .nav-item.voice-nav {
            background: linear-gradient(135deg, rgba(255,120,160,0.3), rgba(255,80,120,0.4));
            margin-top: 20px;
            border: 1px solid rgba(255,80,80,0.3);
        }
        .nav-item:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(0,0,0,0.1); border-color: rgba(0,0,0,0.1); }
        .nav-item.active { border: 1px solid rgba(0,0,0,0.2); box-shadow: 0 0 20px rgba(255,200,0,0.3); }

        .main-content { flex: 1; padding: 32px 40px; overflow-y: auto; position: relative; z-index: 5; background: rgba(255,255,255,0.3); }
        .page { display: none; } .page.active { display: block; }
        .page-title { font-weight: 700; font-size: 28px; margin-bottom: 24px; display: flex; align-items: center; gap: 12px; }
        .card {
            background: linear-gradient(135deg, rgba(255,255,255,0.9), rgba(255,240,220,0.8));
            backdrop-filter: blur(15px); border-radius: 24px;
            padding: 24px; margin-bottom: 20px; border: 1px solid rgba(0,0,0,0.06);
            transition: all 0.2s ease;
        }
        .card:hover { border-color: rgba(0,0,0,0.15); box-shadow: 0 8px 25px rgba(0,0,0,0.05); }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }

        .btn {
            padding: 10px 20px; border-radius: 30px; font-weight: 600; font-size: 15px;
            cursor: pointer; border: none; transition: all 0.25s ease; display: inline-flex;
            align-items: center; gap: 8px; margin: 6px; letter-spacing: 0.3px;
            background: rgba(255,255,255,0.8); color: #2E3B2E; border: 1px solid rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
        }
        .btn:hover { transform: translateY(-2px); background: rgba(255,255,255,0.95); }
        .btn-primary {
            background: linear-gradient(135deg, #A5D6A7, #FFB74D);
            border: 1px solid rgba(255,140,100,0.4); position: relative; z-index: 1;
        }
        .btn-primary::before {
            content: ''; position: absolute; top: -2px; left: -2px; right: -2px; bottom: -2px;
            border-radius: 32px; background: linear-gradient(45deg, #FFD700, #FF8C00, #FFD700, #FF8C00);
            background-size: 300% 300%; z-index: -1; animation: hologram 3s ease infinite; opacity: 0.35;
        }
        @keyframes hologram { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
        .btn-edit { background: linear-gradient(135deg, #FFCC80, #FFAB91); }
        .btn-delete { background: linear-gradient(135deg, #EF9A9A, #FFCDD2); }

        input, textarea {
            border: 1px solid rgba(0,0,0,0.15); border-radius: 16px; padding: 12px 16px;
            font-size: 15px; font-family: inherit; width: 100%; margin-bottom: 8px;
            background: rgba(255,255,255,0.85); color: #1a2634; outline: none;
        }
        textarea { resize: vertical; min-height: 90px; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center;
            z-index: 2000; visibility: hidden; opacity: 0; transition: 0.25s;
        }
        .modal-overlay.active { visibility: visible; opacity: 1; }
        .modal {
            background: white; border-radius: 32px; padding: 28px; width: 420px; max-width: 90vw;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3); position: relative; color: #1a2634;
        }
        .modal .close-btn {
            position: absolute; top: 14px; right: 14px; width: 28px; height: 28px;
            border-radius: 50%; background: rgba(0,0,0,0.1); border: none; cursor: pointer;
            display: flex; align-items: center; justify-content: center; font-size: 18px; color: #555;
        }
        .modal .close-btn:hover { background: rgba(0,0,0,0.2); }
        .modal h3 { margin-bottom: 16px; font-size: 20px; }
        .settings-avatar {
            width: 80px; height: 80px; border-radius: 40px; background: rgba(0,0,0,0.08);
            margin-bottom: 10px; background-size: cover; background-position: center;
        }
        .voice-feedback {
            position: fixed; bottom: 20px; right: 20px; background: rgba(0,0,0,0.7);
            color: white; padding: 8px 16px; border-radius: 40px; font-size: 14px;
            z-index: 1000; backdrop-filter: blur(8px); font-family: monospace;
            pointer-events: none;
        }
    </style>
</head>
<body>
<div class="tropical-bg">
    <div class="sun"></div>
    <div class="ocean">
        <div class="sailboat-horizon">⛵</div>
    </div>
    <div class="beach">
        <div class="palm-tree" style="left: 5%;">🌴</div>
        <div class="palm-tree" style="left: 18%;">🌴</div>
        <div class="palm-tree" style="left: 38%;">🌴</div>
        <div class="palm-tree" style="right: 28%;">🌴</div>
        <div class="palm-tree" style="right: 12%;">🌴</div>
    </div>
    <div class="airplane-group">
        <div class="airplane-dot"></div>
        <div class="contrail-line"></div>
    </div>
</div>

<div class="sidebar">
    <div class="sidebar-header">
        <span style="color:#FF6347;">П</span><span style="color:#FFA500;">у</span><span style="color:#32CD32;">л</span><span style="color:#1E90FF;">ь</span><span style="color:#9370DB;">т</span>  <span style="color:#FF4500;">А</span><span style="color:#FFD700;">р</span><span style="color:#FF69B4;">т</span><span style="color:#00CED1;">у</span><span style="color:#FFA500;">р</span><span style="color:#9370DB;">а</span>
    </div>
    <div class="nav-item active" data-page="dashboard"><span>Обзор</span></div>
    <div class="nav-item" data-page="backlog"><span>Бэклог</span></div>
    <div class="nav-item" data-page="scheme"><span>Структура</span></div>
    <div class="nav-item" data-page="ideas"><span>Идеи</span></div>
    <div class="nav-item" data-page="prototypes"><span>Прототипы</span></div>
    <div class="nav-item" data-page="hrdnk"><span>HRDNK</span></div>
    <div class="nav-item" data-page="knowledge"><span>База знаний</span></div>
    <div class="nav-item" data-page="settings"><span>Настройки</span></div>
    <div class="nav-item voice-nav" id="voiceAssistantBtn"><span>🎙️ Голос</span></div>
</div>

<div class="main-content" id="mainContent"></div>
<div class="modal-overlay" id="modalOverlay"><div class="modal" id="modalContent"></div></div>
<div id="voiceFeedback" class="voice-feedback" style="display: none;">🎤 Готов</div>

<script>
// =============================================
// 1. Google Sheets API (ваш URL)
// =============================================
const API_URL = 'https://script.google.com/macros/s/AKfycbxBBEYjo617Ken3YMN-yDrP0O8nyADy1zCqa7PmWUGUbVOJemXqq0t55W1qvkyqYVr7bw/exec';

async function callAPI(action, sheet, params = {}) {
    const url = new URL(API_URL);
    url.searchParams.append('action', action);
    url.searchParams.append('sheet', sheet);
    for (const [k, v] of Object.entries(params)) {
        if (v !== undefined && v !== null) url.searchParams.append(k, v);
    }
    const response = await fetch(url.toString());
    const json = await response.json();
    if (!json || json.status !== 'success') throw new Error(json?.error || 'API error');
    return json;
}

// Загрузить все записи листа (массив объектов)
async function loadSheet(sheetName) {
    const res = await callAPI('read', sheetName);
    return res.data || [];
}

// Создать запись
async function createRecord(sheetName, fields) {
    return await callAPI('create', sheetName, fields);
}

// Обновить запись по id
async function updateRecord(sheetName, id, fields) {
    return await callAPI('update', sheetName, { id, ...fields });
}

// Удалить запись
async function deleteRecord(sheetName, id) {
    return await callAPI('delete', sheetName, { id });
}

// Установить приоритет (только для backlog)
async function setPriority(sheetName, id, priority) {
    return await callAPI('priority', sheetName, { id, priority });
}

// =============================================
// 2. Глобальные данные и состояние
// =============================================
let appState = {
    dashboard: [],
    backlog: [],
    scheme: [],
    ideas: [],
    prototypes: [],
    hrdnk: [],
    knowledge: [],
    avatar: ''
};
let currentPage = 'dashboard';

// Функция загрузки всех данных из таблиц
async function loadAllData() {
    try {
        const sheets = ['dashboard', 'backlog', 'scheme', 'ideas', 'prototypes', 'hrdnk', 'knowledge'];
        for (let sheet of sheets) {
            appState[sheet] = await loadSheet(sheet);
        }
        // Аватар пока в localStorage (можно оставить)
        const storedAvatar = localStorage.getItem('arthurAvatar');
        if (storedAvatar) appState.avatar = storedAvatar;
    } catch(e) {
        console.error('Ошибка загрузки из Google Sheets:', e);
        showVoiceFeedback('Ошибка соединения с таблицей', true);
    }
}

function saveAvatar(base64) {
    appState.avatar = base64;
    localStorage.setItem('arthurAvatar', base64);
}

// =============================================
// 3. Инициализация таблиц (если пустые — заполнить defaultState)
// =============================================
const defaultState = {
    dashboard: [
        { id:1, title:'Кармический Банк', desc:'HR-экосистема с геймификацией, AI-тренером, CRM, магазином призов.' },
        { id:2, title:'HRDNK', desc:'Цифровой паспорт специалиста.' }
    ],
    backlog: [ { id:1, title:'Cloud.ru SSL', status:'progress', desc:'Решить проблему подключения к БД' } ],
    scheme: [
        { id:1, title:'Артур Галкин', role:'Основатель и Генеральный директор', type:'founder' },
        { id:2, title:'Исследования', desc:'Психометрия', type:'dept' },
        { id:3, title:'Математики', desc:'Алгоритмы', type:'dept' },
        { id:4, title:'Психология', desc:'Квест-типология', type:'dept' },
        { id:5, title:'Разработка', desc:'FastAPI', type:'dept' }
    ],
    prototypes: [
        { id:1, title:'Рабочий стол CRM', desc:'Воронка, активность, кнопки' },
        { id:2, title:'Карточка сделки', desc:'Этапы, комментарии, начисления' },
        { id:3, title:'Бильярд-дуэль', desc:'Физика, ИИ' }
    ],
    hrdnk: [ { id:1, title:'Концепция ЦПС', status:'ready', desc:'Цифровой паспорт специалиста' } ],
    ideas: [ { id:1, text:'Система кармиков за здоровье' } ],
    knowledge: [ { q:'проект', a:'Кармический Банк — HR-экосистема с геймификацией, AI-тренером, CRM.' } ]
};

async function initSheets() {
    for (const [sheetName, records] of Object.entries(defaultState)) {
        const existing = await loadSheet(sheetName);
        if (existing.length === 0) {
            for (const rec of records) {
                let fields = {};
                if (sheetName === 'dashboard') fields = { title: rec.title, description: rec.desc };
                else if (sheetName === 'backlog') fields = { title: rec.title, description: rec.desc, status: rec.status, priority: 'medium' };
                else if (sheetName === 'scheme') fields = { title: rec.title, description: rec.desc || '', type: rec.type, role: rec.role || '' };
                else if (sheetName === 'ideas') fields = { title: rec.text, description: '' };
                else if (sheetName === 'prototypes') fields = { title: rec.title, description: rec.desc };
                else if (sheetName === 'hrdnk') fields = { title: rec.title, description: rec.desc, status: rec.status };
                else if (sheetName === 'knowledge') fields = { question: rec.q, answer: rec.a };
                await createRecord(sheetName, fields);
            }
        }
    }
    await loadAllData();
}

// =============================================
// 4. Отрисовка (полностью сохранена ваша логика, но использует appState)
// =============================================
function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
    });
}

function card(item, key) {
    let content = `<div class="card" data-id="${item.id}">
        <h3>${escapeHtml(item.title || item.text || item.question || '')}</h3>
        <p>${escapeHtml(item.description || item.desc || item.answer || '')}</p>
        <div style="display:flex; gap:12px; margin-top:12px; flex-wrap:wrap;">
            <button class="btn btn-edit edit-${key}" data-id="${item.id}">Редактировать</button>
            <button class="btn btn-delete delete-${key}" data-id="${item.id}">Удалить</button>
        </div>`;
    if (item.role) content += `<p style="margin-top:8px; font-weight:500; color:#FFA500;">${escapeHtml(item.role)}</p>`;
    if (item.priority) content += `<div style="margin-top:8px;"><span style="background:#ffd966; padding:2px 8px; border-radius:20px;">Приоритет: ${item.priority}</span></div>`;
    content += `</div>`;
    return content;
}

function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

function editableGrid(pageId, title, items, addLabel) {
    const key = pageId;
    return `<div class="page active"><h2 class="page-title">${title}</h2><div class="grid" id="${key}List">${items.map(i => card(i, key)).join('')}</div><button class="btn btn-primary" id="add${capitalize(key)}Btn">${addLabel}</button></div>`;
}

function dashboard() { return editableGrid('dashboard', 'Обзор проектов', appState.dashboard, 'Добавить карточку'); }
function backlog() {
    const sorted = [...appState.backlog].sort((a,b) => {
        const pOrder = {'high':1, 'medium':2, 'low':3};
        return (pOrder[a.priority] || 2) - (pOrder[b.priority] || 2);
    });
    return editableGrid('backlog', 'Бэклог', sorted, 'Добавить задачу');
}
function scheme() {
    const founder = appState.scheme.filter(i => i.type === 'founder');
    const depts = appState.scheme.filter(i => i.type === 'dept');
    return `<div class="page active">
        <h2 class="page-title">Структура компании</h2>
        <button class="btn btn-primary" id="addSchemeBtn" style="margin-bottom:24px;">Добавить отдел</button>
        <div style="display:flex; flex-wrap:wrap; gap:20px; justify-content:flex-start; align-items:flex-start;">
            ${founder.map(i => `
                <div class="card" style="width:260px; background:linear-gradient(45deg,#FFD700,#FFA500); color:#1a1a1a; text-align:center;">
                    <h3>${escapeHtml(i.title)}</h3><p>${escapeHtml(i.role || '')}</p>
                    <div style="display:flex; gap:12px; justify-content:center; margin-top:12px; flex-wrap:wrap;">
                        <button class="btn btn-edit edit-scheme" data-id="${i.id}">Редактировать</button>
                        <button class="btn btn-delete delete-scheme" data-id="${i.id}">Удалить</button>
                    </div>
                </div>`).join('')}
            ${depts.map(i => `
                <div class="card" style="width:200px;">
                    <h4>${escapeHtml(i.title)}</h4><p>${escapeHtml(i.description || '')}</p>
                    <div style="display:flex; gap:12px; margin-top:12px; flex-wrap:wrap;">
                        <button class="btn btn-edit edit-scheme" data-id="${i.id}">Редактировать</button>
                        <button class="btn btn-delete delete-scheme" data-id="${i.id}">Удалить</button>
                    </div>
                </div>`).join('')}
        </div>
    </div>`;
}
function ideas() { return editableGrid('ideas', 'Идеи', appState.ideas, 'Добавить идею'); }
function prototypes() { return editableGrid('prototypes', 'Прототипы', appState.prototypes, 'Добавить прототип'); }
function knowledge() { return editableGrid('knowledge', 'База знаний', appState.knowledge, 'Добавить знание'); }
function hrdnk() { return editableGrid('hrdnk', 'HRDNK', appState.hrdnk, 'Добавить задачу'); }
function settings() {
    return `<div class="page active"><h2 class="page-title">Настройки</h2>
        <div class="card"><h3>Аватар</h3><div class="settings-avatar" id="settingsAvatar" style="background-image:url('${appState.avatar || ''}')"></div><input type="file" id="avatarUpload" style="display:none;" accept="image/*"><button class="btn btn-primary" id="changeAvatarBtn">Загрузить фото</button></div>
        <div class="card"><button class="btn btn-delete" id="resetDataBtn">Сбросить локальные настройки</button></div>
    </div>`;
}

async function render(pageId) {
    currentPage = pageId;
    let html = '';
    switch(pageId) {
        case 'dashboard': html = dashboard(); break;
        case 'backlog': html = backlog(); break;
        case 'scheme': html = scheme(); break;
        case 'ideas': html = ideas(); break;
        case 'prototypes': html = prototypes(); break;
        case 'hrdnk': html = hrdnk(); break;
        case 'knowledge': html = knowledge(); break;
        case 'settings': html = settings(); break;
    }
    document.getElementById('mainContent').innerHTML = html;
    attachEvents(pageId);
}

// =============================================
// 5. Обработчики кнопок (CRUD через API)
// =============================================
const modalOverlay = document.getElementById('modalOverlay');
const modalContent = document.getElementById('modalContent');
function showModal(innerHtml) {
    modalContent.innerHTML = innerHtml;
    modalOverlay.classList.add('active');
    const closeBtn = modalContent.querySelector('.close-btn');
    if (closeBtn) closeBtn.onclick = () => modalOverlay.classList.remove('active');
}
modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) modalOverlay.classList.remove('active'); });

async function attachEvents(pageId) {
    const key = pageId;
    const addBtn = document.getElementById(`add${capitalize(key)}Btn`);
    if (addBtn) {
        addBtn.onclick = () => {
            showModal(`<button class="close-btn">✕</button><h3>Добавить в ${key}</h3><input id="modalTitle" placeholder="Название"><br><textarea id="modalDesc" placeholder="Описание"></textarea><br><button class="btn btn-primary" id="saveModal">Сохранить</button>`);
            document.getElementById('saveModal').onclick = async () => {
                const title = document.getElementById('modalTitle').value.trim();
                if (!title) return;
                const desc = document.getElementById('modalDesc').value.trim();
                let fields = {};
                if (key === 'dashboard') fields = { title, description: desc };
                else if (key === 'backlog') fields = { title, description: desc, status: 'active', priority: 'medium' };
                else if (key === 'scheme') fields = { title, description: desc, type: 'dept' };
                else if (key === 'ideas') fields = { title, description: desc };
                else if (key === 'prototypes') fields = { title, description: desc };
                else if (key === 'hrdnk') fields = { title, description: desc, status: 'active' };
                else if (key === 'knowledge') fields = { question: title, answer: desc };
                try {
                    await createRecord(key, fields);
                    await loadAllData();
                    await render(currentPage);
                    modalOverlay.classList.remove('active');
                    speak(`Добавлено в ${key}`);
                } catch(e) { alert('Ошибка: '+e.message); }
            };
        };
    }

    // Редактирование
    document.querySelectorAll(`.edit-${key}`).forEach(btn => {
        btn.onclick = async () => {
            const id = parseInt(btn.dataset.id);
            const item = appState[key].find(i => i.id === id);
            if (!item) return;
            const title = item.title || item.question || '';
            const desc = item.description || item.answer || '';
            showModal(`<button class="close-btn">✕</button><h3>Редактировать</h3><input id="editTitle" value="${escapeHtml(title)}"><br><textarea id="editDesc">${escapeHtml(desc)}</textarea><br><button class="btn btn-primary" id="updateModal">Сохранить</button>`);
            document.getElementById('updateModal').onclick = async () => {
                const newTitle = document.getElementById('editTitle').value.trim();
                if (!newTitle) return;
                const newDesc = document.getElementById('editDesc').value.trim();
                let fields = {};
                if (key === 'knowledge') fields = { question: newTitle, answer: newDesc };
                else fields = { title: newTitle, description: newDesc };
                try {
                    await updateRecord(key, id, fields);
                    await loadAllData();
                    await render(currentPage);
                    modalOverlay.classList.remove('active');
                    speak('Обновлено');
                } catch(e) { alert('Ошибка: '+e.message); }
            };
        };
    });

    // Удаление
    document.querySelectorAll(`.delete-${key}`).forEach(btn => {
        btn.onclick = () => {
            const id = parseInt(btn.dataset.id);
            showModal(`<button class="close-btn">✕</button><h3>Удалить?</h3><button class="btn btn-delete" id="confirmDelete">Да</button>`);
            document.getElementById('confirmDelete').onclick = async () => {
                try {
                    await deleteRecord(key, id);
                    await loadAllData();
                    await render(currentPage);
                    modalOverlay.classList.remove('active');
                    speak('Удалено');
                } catch(e) { alert('Ошибка: '+e.message); }
            };
        };
    });

    if (pageId === 'settings') {
        document.getElementById('changeAvatarBtn')?.addEventListener('click', () => document.getElementById('avatarUpload').click());
        document.getElementById('avatarUpload')?.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => { saveAvatar(reader.result); document.getElementById('settingsAvatar').style.backgroundImage = `url(${reader.result})`; };
            reader.readAsDataURL(file);
        });
        document.getElementById('resetDataBtn')?.addEventListener('click', () => {
            showModal(`<button class="close-btn">✕</button><h3>Сбросить локальные настройки (аватар)?</h3><button class="btn btn-delete" id="confirmReset">Да</button>`);
            document.getElementById('confirmReset').onclick = () => {
                localStorage.removeItem('arthurAvatar');
                appState.avatar = '';
                render('settings');
                modalOverlay.classList.remove('active');
            };
        });
    }
}

// =============================================
// 6. Голосовой ассистент (с красивым голосом)
// =============================================
let recognition = null;
let isListening = false;

function showVoiceFeedback(msg, isError = false) {
    const el = document.getElementById('voiceFeedback');
    el.textContent = msg;
    el.style.display = 'block';
    el.style.background = isError ? 'rgba(200,0,0,0.8)' : 'rgba(0,0,0,0.7)';
    setTimeout(() => { el.style.display = 'none'; }, 3000);
}

function getBestRussianVoice() {
    return new Promise((resolve) => {
        const synth = window.speechSynthesis;
        const check = () => {
            const voices = synth.getVoices();
            const ruVoices = voices.filter(v => v.lang.startsWith('ru'));
            if (ruVoices.length === 0) resolve(null);
            // Приоритет: Google русский (часто "Google русский"), потом Microsoft Irina, потом Yuri/Milena, потом любой
            const priority = [
                v => v.name.includes('Google') && v.lang === 'ru-RU',
                v => v.name.includes('Microsoft Irina'),
                v => v.name.includes('Yuri') || v.name.includes('Milena'),
                v => true
            ];
            for (const test of priority) {
                const found = ruVoices.find(test);
                if (found) { resolve(found); return; }
            }
            resolve(ruVoices[0]);
        };
        if (synth.getVoices().length) check();
        else synth.addEventListener('voiceschanged', check, { once: true });
    });
}

let cachedVoice = null;
async function speak(text) {
    if (!window.speechSynthesis) return;
    if (!cachedVoice) cachedVoice = await getBestRussianVoice();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'ru-RU';
    utterance.rate = 0.9;
    utterance.pitch = 1.0;
    utterance.volume = 1.0;
    if (cachedVoice) utterance.voice = cachedVoice;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(utterance);
}

async function processVoiceCommand(command) {
    const lower = command.toLowerCase();
    const page = currentPage;

    // Создание
    if (lower.includes('создай') || lower.includes('добавь')) {
        let match = lower.match(/(?:создай|добавь)\s+(?:в\s+)?(?:задачу|идею|карточку|прототип|знание)?\s*(.+)/i);
        if (!match) { speak('Не понял название'); return; }
        let title = match[1].trim();
        let description = '';
        if (title.includes(' с описанием ')) {
            const parts = title.split(' с описанием ');
            title = parts[0];
            description = parts[1];
        }
        let fields = {};
        if (page === 'dashboard') fields = { title, description };
        else if (page === 'backlog') fields = { title, description, status: 'active', priority: 'medium' };
        else if (page === 'ideas') fields = { title, description };
        else if (page === 'prototypes') fields = { title, description };
        else if (page === 'hrdnk') fields = { title, description, status: 'active' };
        else if (page === 'knowledge') fields = { question: title, answer: description };
        else if (page === 'scheme') fields = { title, description, type: 'dept' };
        else { speak('На этой странице создание не поддерживается'); return; }
        try {
            await createRecord(page, fields);
            await loadAllData();
            await render(currentPage);
            speak(`Создано: ${title}`);
        } catch(e) { speak('Ошибка создания'); }
        return;
    }

    // Редактирование
    if (lower.includes('редактируй') || lower.includes('измени')) {
        let match = lower.match(/(?:редактируй|измени)\s+(.+?)\s+на\s+(.+)/i);
        if (!match) { speak('Скажите: редактируй [название] на [новое описание]'); return; }
        let oldTitle = match[1].trim();
        let newDesc = match[2].trim();
        const item = appState[page]?.find(i => (i.title || i.question || '').toLowerCase().includes(oldTitle.toLowerCase()));
        if (!item) { speak('Не найдено'); return; }
        let fields = {};
        if (page === 'knowledge') fields = { answer: newDesc };
        else fields = { description: newDesc };
        try {
            await updateRecord(page, item.id, fields);
            await loadAllData();
            await render(currentPage);
            speak('Обновлено');
        } catch(e) { speak('Ошибка'); }
        return;
    }

    // Удаление
    if (lower.includes('удали')) {
        let match = lower.match(/удали\s+(.+)/i);
        if (!match) { speak('Что удалить?'); return; }
        let title = match[1].trim();
        const item = appState[page]?.find(i => (i.title || i.question || '').toLowerCase().includes(title.toLowerCase()));
        if (!item) { speak('Не найдено'); return; }
        try {
            await deleteRecord(page, item.id);
            await loadAllData();
            await render(currentPage);
            speak('Удалено');
        } catch(e) { speak('Ошибка удаления'); }
        return;
    }

    // Приоритет (только для бэклога)
    if ((lower.includes('приоритет') || lower.includes('приоритизируй')) && page === 'backlog') {
        let match = lower.match(/(?:приоритет|приоритизируй)\s+(высокий|средний|низкий)\s+для\s+(.+)/i);
        if (!match) { speak('Скажите: установи высокий приоритет для задачи...'); return; }
        let priority = match[1] === 'высокий' ? 'high' : (match[1] === 'средний' ? 'medium' : 'low');
        let taskName = match[2].trim();
        const item = appState.backlog.find(i => i.title.toLowerCase().includes(taskName.toLowerCase()));
        if (!item) { speak('Задача не найдена'); return; }
        try {
            await setPriority('backlog', item.id, priority);
            await loadAllData();
            await render('backlog');
            speak(`Приоритет ${match[1]} установлен`);
        } catch(e) { speak('Ошибка'); }
        return;
    }

    // Показать список
    if (lower.includes('покажи') || lower.includes('список') || lower.includes('что у меня')) {
        const count = appState[page]?.length || 0;
        speak(`В разделе ${page} ${count} элементов`);
        return;
    }

    // Помощь
    if (lower.includes('помоги') || lower.includes('что ты умеешь')) {
        speak('Я умею создавать, редактировать, удалять карточки в текущем разделе. В бэклоге могу менять приоритет. Скажите, например: создай задачу: обновить сервер, или установи высокий приоритет для задачи...');
        return;
    }

    speak('Не понял команду. Скажите “помоги” для списка.');
}

function initVoice() {
    if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
        showVoiceFeedback('Голос не поддерживается', true);
        return;
    }
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SpeechRecognition();
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.lang = 'ru-RU';
    recognition.onstart = () => { isListening = true; showVoiceFeedback('🎤 Слушаю...'); };
    recognition.onend = () => { isListening = false; showVoiceFeedback('Готов'); };
    recognition.onerror = (event) => { console.error(event); showVoiceFeedback('Ошибка', true); isListening = false; };
    recognition.onresult = (event) => {
        const text = event.results[0][0].transcript;
        showVoiceFeedback(`Распознано: ${text}`);
        processVoiceCommand(text);
    };
}

// =============================================
// 7. Запуск и навигация
// =============================================
document.addEventListener('DOMContentLoaded', async () => {
    initVoice();
    const voiceBtn = document.getElementById('voiceAssistantBtn');
    if (voiceBtn) {
        voiceBtn.addEventListener('click', () => {
            if (!recognition) { alert('Голос не поддерживается'); return; }
            if (isListening) recognition.stop();
            else recognition.start();
        });
    }

    await initSheets();  // создаст таблицы и загрузит defaultState, если пусто
    await render('dashboard');

    const navItems = document.querySelectorAll('.nav-item[data-page]');
    navItems.forEach(item => {
        item.addEventListener('click', async (e) => {
            const page = item.dataset.page;
            navItems.forEach(nav => nav.classList.remove('active'));
            item.classList.add('active');
            await render(page);
        });
    });
});
