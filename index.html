<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Пульт Артура — Кармический Банк</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', 'Comic Sans MS', sans-serif;
      background: #fff4e6; color: #1a2634;
      display: flex; height: 100vh; overflow: hidden;
      user-select: none;
      cursor: none; /* полностью убираем системный курсор */
    }
    input, textarea, [contenteditable] {
      user-select: text;
      cursor: none;
    }

    /* Убираем курсор со всех интерактивных элементов */
    a, button, .btn, .nav-item, .clip-delete, .modern-close, input, textarea, select {
      cursor: none !important;
    }

    .tropical-bg {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0;
      pointer-events: none;
      background: linear-gradient(180deg, #87CEEB 0%, #FFDAB9 60%, #FFE4B5 100%);
    }
    .sun {
      position: absolute; top: 25px; right: 70px; width: 100px; height: 100px;
      background: #FFD700; border-radius: 50%;
      box-shadow: 0 0 120px 30px #FFA500, 0 0 200px 60px #FF8C00, 0 0 300px 100px rgba(255,140,0,0.4);
    }
    .ocean {
      position: absolute; bottom: 10%; left: 0; width: 100%; height: 40%;
      background: linear-gradient(180deg, #40E0D0 0%, #00CED1 50%, #20B2AA 100%);
      animation: wave 7s ease-in-out infinite;
    }
    @keyframes wave { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    .beach {
      position: absolute; bottom: 0; left: 0; width: 100%; height: 20%;
      background: linear-gradient(180deg, #FFE4B5 0%, #FFDAB9 100%);
      border-radius: 30% 40% 0 0;
    }
    .palm-tree { position: absolute; bottom: 8%; font-size: 80px; filter: drop-shadow(0 4px 10px rgba(0,0,0,0.25)); }
    .sailboat-horizon { position: absolute; bottom: 55%; left: 70%; font-size: 40px; animation: sailHorizon 95s linear infinite; }
    @keyframes sailHorizon { 0% { left: 70%; } 100% { left: 10%; } }
    .airplane-group { position: absolute; bottom: 25%; right: -5%; animation: airplaneFly 180s linear infinite; }
    @keyframes airplaneFly {
      0% { right: -5%; bottom: 25%; }
      5% { bottom: 28%; }
      50% { right: 65%; bottom: 44%; }
      90% { right: 90%; bottom: 56%; }
      100% { right: 105%; bottom: 60%; }
    }
    .airplane-dot { width: 6px; height: 6px; background: white; border-radius: 50%; position: absolute; top: -3px; right: 0; box-shadow: 0 0 6px white; }
    .contrail-line { position: absolute; top: 0; right: 6px; height: 2px; background: linear-gradient(90deg, rgba(255,255,255,0.85), transparent); border-radius: 2px; animation: trailLength 180s linear infinite; }
    @keyframes trailLength {
      0% { width: 0%; opacity: 0; }
      5% { width: 10%; opacity: 1; }
      50% { width: 60%; opacity: 1; }
      90% { width: 30%; opacity: 0.8; }
      100% { width: 0%; opacity: 0; }
    }

    .flying-a {
      position: fixed; font-size: 26px; font-weight: 700; color: #9370DB;
      text-shadow: 0 0 12px #FFD700; z-index: 9000; cursor: pointer; display: none;
    }

    /* ---------- ВОЛШЕБНЫЙ КУРСОР (ПАЛОЧКА + ОРЕОЛ + ЗВЁЗДЫ) ---------- */
    #customCursor {
      position: fixed; pointer-events: none; z-index: 9999;
      font-size: 38px;
      transform: translate(-15px, -15px);
      filter: drop-shadow(0 0 15px #FFD700) drop-shadow(0 0 30px #FF8C00);
      animation: floatWand 3s infinite alternate ease-in-out;
      background: transparent;
    }
    @keyframes floatWand {
      0% { transform: translate(-15px, -15px) rotate(-2deg) scale(1); }
      100% { transform: translate(-15px, -15px) rotate(4deg) scale(1.03); }
    }
    #wandGlow {
      position: absolute; top: 50%; left: 50%;
      width: 60px; height: 60px;
      background: radial-gradient(circle, rgba(255,215,0,0.5) 0%, transparent 70%);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      animation: glowPulse 2s infinite alternate;
      z-index: -1;
    }
    @keyframes glowPulse {
      0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.6; }
      100% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
    }
    /* звёздочки вокруг палочки */
    .stardust {
      position: fixed; pointer-events: none; z-index: 9998;
      font-size: 14px;
      animation: stardustFloat 1.5s infinite alternate ease-in-out;
    }
    @keyframes stardustFloat {
      0% { transform: translate(0,0); opacity: 0.7; }
      100% { transform: translate(5px, -8px); opacity: 1; }
    }
    /* вспышка при клике */
    .magic-burst {
      position: fixed; pointer-events: none; z-index: 10001;
      font-size: 24px;
      animation: burstFade 0.4s ease-out forwards;
    }
    @keyframes burstFade {
      0% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(2) rotate(20deg); }
    }

    .firework { position: fixed; pointer-events: none; z-index: 10000; }
    .particle {
      position: absolute; width: 12px; height: 12px; border-radius: 50%;
      animation: particleFade 1.2s ease-out forwards;
    }
    @keyframes particleFade {
      0% { opacity: 1; transform: translate(0,0) scale(1); }
      100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0); }
    }

    @keyframes pulseWave {
      0% { box-shadow: 0 0 25px #FFD700, 0 0 50px #FF8C00; }
      50% { box-shadow: 0 0 50px #FFD700, 0 0 100px #FF8C00; }
      100% { box-shadow: 0 0 25px #FFD700, 0 0 50px #FF8C00; }
    }

    .loading-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.25); backdrop-filter: blur(6px);
      display: flex; align-items: center; justify-content: center;
      z-index: 3000; visibility: hidden; opacity: 0; transition: 0.3s;
    }
    .loading-overlay.active { visibility: visible; opacity: 1; }
    .premium-spinner {
      width: 70px; height: 70px; border-radius: 50%;
      background: conic-gradient(from 0deg, #FFD700, #FF8C00, #FFD700);
      -webkit-mask: radial-gradient(transparent 55%, black 56%);
      mask: radial-gradient(transparent 55%, black 56%);
      animation: spin 0.8s linear infinite;
      box-shadow: 0 0 40px #FFA500, 0 0 80px rgba(255,140,0,0.6);
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    .sidebar { width: 280px; background: rgba(255,255,255,0.8); backdrop-filter: blur(25px); border-right: 1px solid rgba(0,0,0,0.05); display: flex; flex-direction: column; padding: 32px 20px; z-index: 10; position: relative; }
    .sidebar-header { font-size: 26px; font-weight: 700; margin-bottom: 40px; display: flex; align-items: center; gap: 6px; line-height: 1.2; letter-spacing: 1px; color: #2E3B2E; }
    .nav-item { padding: 12px 20px; border-radius: 16px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 12px; font-size: 16px; margin-bottom: 10px; transition: all 0.3s ease; border: 1px solid transparent; color: #2E3B2E; }
    .nav-item[data-page="dashboard"] { background: linear-gradient(135deg, rgba(255,160,122,0.2), rgba(255,180,160,0.3)); }
    .nav-item[data-page="backlog"] { background: linear-gradient(135deg, rgba(255,220,100,0.2), rgba(255,240,150,0.3)); }
    .nav-item[data-page="scheme"] { background: linear-gradient(135deg, rgba(130,180,255,0.2), rgba(180,210,255,0.3)); }
    .nav-item[data-page="ideas"] { background: linear-gradient(135deg, rgba(160,240,160,0.2), rgba(200,255,200,0.3)); }
    .nav-item[data-page="prototypes"] { background: linear-gradient(135deg, rgba(255,150,200,0.2), rgba(255,190,220,0.3)); }
    .nav-item[data-page="hrdnk"] { background: linear-gradient(135deg, rgba(200,160,255,0.2), rgba(220,190,255,0.3)); }
    .nav-item[data-page="knowledge"] { background: linear-gradient(135deg, rgba(255,230,80,0.2), rgba(255,250,120,0.3)); }
    .nav-item[data-page="settings"] { background: linear-gradient(135deg, rgba(210,190,250,0.2), rgba(240,220,255,0.3)); }
    .nav-item:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(0,0,0,0.1); border-color: rgba(0,0,0,0.1); }
    .nav-item.active { border: 1px solid rgba(0,0,0,0.2); box-shadow: 0 0 20px rgba(255,200,0,0.3); }

    .main-content { flex: 1; padding: 32px 40px; overflow-y: auto; position: relative; z-index: 5; background: rgba(255,255,255,0.3); }
    .page { display: none; } .page.active { display: block; }
    .page-title { font-weight: 700; font-size: 28px; margin-bottom: 24px; display: flex; align-items: center; gap: 12px; }
    .card { background: linear-gradient(135deg, rgba(255,255,255,0.9), rgba(255,240,220,0.8)); backdrop-filter: blur(15px); border-radius: 24px; padding: 24px; margin-bottom: 20px; border: 1px solid rgba(0,0,0,0.06); transition: all 0.2s ease; position: relative; }
    .card:hover { border-color: rgba(0,0,0,0.15); box-shadow: 0 8px 25px rgba(0,0,0,0.05); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }

    .btn { padding: 10px 20px; border-radius: 30px; font-weight: 600; font-size: 15px; cursor: pointer; border: none; transition: all 0.25s ease; display: inline-flex; align-items: center; gap: 8px; margin: 6px; letter-spacing: 0.3px; background: rgba(255,255,255,0.8); color: #2E3B2E; border: 1px solid rgba(0,0,0,0.1); backdrop-filter: blur(10px); }
    .btn:hover { transform: translateY(-2px); background: rgba(255,255,255,0.95); }
    .btn-primary { background: linear-gradient(135deg, #A5D6A7, #FFB74D); border: 1px solid rgba(255,140,100,0.4); position: relative; z-index: 1; }
    .btn-primary::before { content: ''; position: absolute; top: -2px; left: -2px; right: -2px; bottom: -2px; border-radius: 32px; background: linear-gradient(45deg, #FFD700, #FF8C00, #FFD700, #FF8C00); background-size: 300% 300%; z-index: -1; animation: hologram 3s ease infinite; opacity: 0.35; }
    @keyframes hologram { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }

    .modern-close { width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(135deg, rgba(255,255,255,0.9), rgba(255,240,220,0.9)); border: 1px solid rgba(255,140,100,0.6); position: relative; cursor: pointer; transition: all 0.3s; box-shadow: 0 0 12px rgba(255,140,0,0.3); }
    .modern-close::before, .modern-close::after { content: ''; position: absolute; top: 50%; left: 50%; width: 14px; height: 2px; background: #FF4500; border-radius: 2px; }
    .modern-close::before { transform: translate(-50%, -50%) rotate(45deg); }
    .modern-close::after { transform: translate(-50%, -50%) rotate(-45deg); }
    .modern-close:hover { box-shadow: 0 0 25px #FF8C00; transform: scale(1.1); }

    /* Волшебная заколочка вместо скрепки */
    .magic-pin {
      display: inline-flex; align-items: center; justify-content: center;
      width: 32px; height: 32px; margin-left: 8px;
      background: linear-gradient(145deg, #E0C9FF, #FFF0F5);
      border: 2px solid #FFD700;
      border-radius: 50% 50% 50% 10%;
      box-shadow: 0 0 15px #DDA0DD, 0 4px 8px rgba(0,0,0,0.2);
      cursor: grab;
      font-size: 18px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .magic-pin:active { cursor: grabbing; transform: scale(0.9); }
    .magic-pin:hover { box-shadow: 0 0 25px #FF00FF, 0 0 15px #FFD700; }

    input, textarea {
      border: 1px solid rgba(0,0,0,0.15); border-radius: 16px; padding: 12px 16px;
      font-size: 15px; font-family: inherit; width: 100%; margin-bottom: 8px;
      background: rgba(255,255,255,0.85); color: #1a2634; outline: none;
    }
    textarea { resize: vertical; min-height: 90px; }

    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center;
      z-index: 2000; visibility: hidden; opacity: 0; transition: 0.25s;
    }
    .modal-overlay.active { visibility: visible; opacity: 1; }
    .modal {
      background: white; border-radius: 32px; padding: 28px; width: 420px; max-width: 90vw;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3); position: relative; color: #1a2634;
    }
  </style>
</head>
<body>

<div id="flyingA" class="flying-a">А</div>

<!-- Волшебный курсор -->
<div id="customCursor">
  <div id="wandGlow"></div>
</div>
<!-- Звёздная пыль (создаётся динамически) -->

<div class="loading-overlay" id="loadingOverlay"><div class="premium-spinner"></div></div>

<div class="tropical-bg">
  <div class="sun"></div>
  <div class="ocean"><div class="sailboat-horizon">⛵</div></div>
  <div class="beach">
    <div class="palm-tree" style="left: 5%;">🌴</div>
    <div class="palm-tree" style="left: 18%;">🌴</div>
    <div class="palm-tree" style="left: 38%;">🌴</div>
    <div class="palm-tree" style="right: 28%;">🌴</div>
    <div class="palm-tree" style="right: 12%;">🌴</div>
  </div>
  <div class="airplane-group">
    <div class="airplane-dot"></div>
    <div class="contrail-line"></div>
  </div>
</div>

<div class="sidebar" id="sidebarArea">
  <div class="sidebar-header" id="sidebarHeader">
    <span style="color:#FF6347;">П</span><span style="color:#FFA500;">у</span><span style="color:#32CD32;">л</span><span style="color:#1E90FF;">ь</span><span style="color:#9370DB;">т</span>
    <span style="color:#FF4500;">А</span><span style="color:#FFD700;">р</span><span style="color:#FF69B4;">т</span><span style="color:#00CED1;">у</span><span style="color:#FFA500;">р</span><span class="last-a" style="color:#9370DB;">а</span>
  </div>

  <div style="margin-bottom: 24px;">
    <button id="voiceBtn" class="btn-primary" style="width:100%; justify-content:center; gap:12px; position:relative; overflow:visible; border-radius:30px; padding:14px;">
      <span id="voiceIcon">🎙️</span> <span id="voiceText">Голосовой помощник</span>
      <div id="voiceWaves" style="display:none; position:absolute; top:-8px; left:-8px; right:-8px; bottom:-8px; border-radius:36px; background:transparent; box-shadow: 0 0 25px #FFD700, 0 0 50px #FF8C00; animation:pulseWave 1s infinite;"></div>
    </button>
  </div>

  <div class="nav-item active" data-page="dashboard" id="navDashboard"><span>Обзор</span></div>
  <div class="nav-item" data-page="backlog"><span>Бэклог</span></div>
  <div class="nav-item" data-page="scheme"><span>Структура</span></div>
  <div class="nav-item" data-page="ideas"><span>Идеи</span></div>
  <div class="nav-item" data-page="prototypes"><span>Прототипы</span></div>
  <div class="nav-item" data-page="hrdnk"><span>HRDNK</span></div>
  <div class="nav-item" data-page="knowledge"><span>База знаний</span></div>
  <div class="nav-item" data-page="settings"><span>Настройки</span></div>
</div>

<div class="main-content" id="mainContent"></div>
<div class="modal-overlay" id="modalOverlay"><div class="modal" id="modalContent"></div></div>

<script>
(function() {
  const API_URL = 'https://script.google.com/macros/s/AKfycbwI0uA9mDRVHyxMYD9SYFwhsWhRdlq_MrjCKRxPjxR6upBZnUXl7fqA0b2JVBlWwXxQPg/exec';
  const STORAGE_SOUND_KEY = 'arthurHubSoundEnabled';
  const STORAGE_AVATAR_KEY = 'arthurHubAvatar';

  const state = {
    dashboard: [], backlog: [], scheme: [], ideas: [],
    prototypes: [], hrdnk: [], knowledge: [],
    avatar: localStorage.getItem(STORAGE_AVATAR_KEY) || ''
  };
  let soundEnabled = localStorage.getItem(STORAGE_SOUND_KEY) !== 'false';

  // Аудио (волшебные звуки)
  const AudioContext = window.AudioContext || window.webkitAudioContext;
  let audioCtx;
  function getAudioCtx() {
    if (!audioCtx) audioCtx = new AudioContext();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }
  function playSound(type) {
    if (!soundEnabled) return;
    try {
      const ctx = getAudioCtx();
      const t = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      switch(type) {
        case 'magic': // волшебный перезвон
          osc.type = 'sine';
          osc.frequency.setValueAtTime(800, t);
          osc.frequency.exponentialRampToValueAtTime(1200, t + 0.1);
          gain.gain.setValueAtTime(0.12, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.2);
          osc.start(t); osc.stop(t + 0.2);
          // второй тон
          const osc2 = ctx.createOscillator();
          osc2.type = 'sine';
          osc2.frequency.setValueAtTime(1200, t + 0.05);
          osc2.frequency.exponentialRampToValueAtTime(1600, t + 0.15);
          const gain2 = ctx.createGain();
          gain2.gain.setValueAtTime(0.08, t + 0.05);
          gain2.gain.exponentialRampToValueAtTime(0.01, t + 0.2);
          osc2.connect(gain2); gain2.connect(ctx.destination);
          osc2.start(t + 0.05); osc2.stop(t + 0.2);
          break;
        case 'tear': // нежное шуршание
          osc.type = 'sine';
          osc.frequency.setValueAtTime(300, t);
          osc.frequency.linearRampToValueAtTime(500, t + 0.15);
          gain.gain.setValueAtTime(0.1, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.2);
          osc.start(t); osc.stop(t + 0.2);
          break;
        case 'catch':
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(600, t);
          osc.frequency.linearRampToValueAtTime(1000, t + 0.1);
          gain.gain.setValueAtTime(0.12, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.2);
          osc.start(t); osc.stop(t + 0.2);
          break;
        case 'firework':
          // колокольчики
          const notes = [523, 659, 784, 1047];
          notes.forEach((freq, i) => {
            const o = ctx.createOscillator();
            const g = ctx.createGain();
            o.type = 'sine';
            o.frequency.value = freq;
            g.gain.setValueAtTime(0.08, t + i*0.08);
            g.gain.exponentialRampToValueAtTime(0.01, t + i*0.08 + 0.2);
            o.connect(g); g.connect(ctx.destination);
            o.start(t + i*0.08); o.stop(t + i*0.08 + 0.2);
          });
          break;
        default: break;
      }
    } catch(e) {}
  }

  // ---------- ВОЛШЕБНЫЙ КУРСОР ----------
  const wand = document.getElementById('customCursor');
  let mouseX = window.innerWidth/2, mouseY = window.innerHeight/2;
  // массив звёздочек-хвостов
  const starTrail = [];
  for (let i=0; i<8; i++) {
    const star = document.createElement('div');
    star.className = 'stardust';
    star.textContent = '✦';
    star.style.opacity = 1 - i/8;
    document.body.appendChild(star);
    starTrail.push({ el: star, x: mouseX, y: mouseY });
  }

  document.addEventListener('mousemove', e => {
    mouseX = e.clientX;
    mouseY = e.clientY;
    wand.style.left = mouseX + 'px';
    wand.style.top = mouseY + 'px';
  });

  // анимация хвоста
  function animateStars() {
    let prevX = mouseX, prevY = mouseY;
    starTrail.forEach((s, idx) => {
      const delay = (idx+1)*0.04;
      s.x += (prevX - s.x) * 0.3;
      s.y += (prevY - s.y) * 0.3;
      s.el.style.left = s.x + 'px';
      s.el.style.top = s.y + 'px';
      prevX = s.x;
      prevY = s.y;
    });
    requestAnimationFrame(animateStars);
  }
  animateStars();

  // клик — магическая вспышка
  document.addEventListener('mousedown', () => {
    if (!soundEnabled) return;
    playSound('magic');
    // вспышка
    const burst = document.createElement('div');
    burst.className = 'magic-burst';
    burst.textContent = '✨';
    burst.style.left = wand.style.left;
    burst.style.top = wand.style.top;
    document.body.appendChild(burst);
    setTimeout(() => burst.remove(), 400);
    // несколько искр
    for (let i=0; i<5; i++) {
      const spark = document.createElement('div');
      spark.className = 'stardust';
      spark.textContent = '✧';
      spark.style.left = wand.style.left;
      spark.style.top = wand.style.top;
      spark.style.animation = 'stardustFloat 0.6s ease-out forwards';
      spark.style.fontSize = '12px';
      document.body.appendChild(spark);
      setTimeout(() => spark.remove(), 600);
    }
  });

  // Фейерверк (как раньше)
  let fireworkClicks = 0;
  let fireworkTimer = null;
  function launchFirework(x, y) {
    const colors = ['#FFD700','#FF8C00','#FF4500','#FF69B4','#00CED1','#32CD32','#9370DB','#FF1493'];
    for (let burst = 0; burst < 3; burst++) {
      setTimeout(() => {
        const container = document.createElement('div');
        container.className = 'firework';
        container.style.left = (x + (Math.random()-0.5)*200) + 'px';
        container.style.top = (y + (Math.random()-0.5)*200) + 'px';
        document.body.appendChild(container);
        playSound('firework');
        for (let i = 0; i < 30; i++) {
          const particle = document.createElement('div');
          particle.className = 'particle';
          const angle = (Math.PI * 2 * i) / 30;
          const distance = 80 + Math.random() * 150;
          const dx = Math.cos(angle) * distance;
          const dy = Math.sin(angle) * distance;
          particle.style.setProperty('--dx', dx + 'px');
          particle.style.setProperty('--dy', dy + 'px');
          particle.style.background = colors[Math.floor(Math.random() * colors.length)];
          container.appendChild(particle);
        }
        setTimeout(() => container.remove(), 1300);
      }, burst * 200);
    }
  }

  document.getElementById('navDashboard').addEventListener('click', e => {
    fireworkClicks++;
    if (fireworkClicks >= 5) {
      launchFirework(e.clientX, e.clientY);
      fireworkClicks = 0;
      if (fireworkTimer) clearTimeout(fireworkTimer);
    } else {
      if (fireworkTimer) clearTimeout(fireworkTimer);
      fireworkTimer = setTimeout(() => { fireworkClicks = 0; }, 800);
    }
  });

  // Летающая буква (без изменений)
  const flyingA = document.getElementById('flyingA');
  const lastA = document.querySelector('.last-a');
  let aFlying = false;

  function startAFlight() {
    if (aFlying) return;
    aFlying = true;
    const rect = lastA.getBoundingClientRect();
    flyingA.style.left = rect.left + 'px';
    flyingA.style.top = rect.top + 'px';
    flyingA.style.display = 'block';
    lastA.style.visibility = 'hidden';

    const moveA = () => {
      if (!aFlying) return;
      const maxX = window.innerWidth - 60;
      const maxY = window.innerHeight - 60;
      const newX = Math.random() * maxX;
      const newY = Math.random() * maxY;
      flyingA.style.transition = 'left 2s ease-in-out, top 2s ease-in-out';
      flyingA.style.left = newX + 'px';
      flyingA.style.top = newY + 'px';
      setTimeout(moveA, 2000 + Math.random() * 1000);
    };
    moveA();

    flyingA.onclick = () => {
      aFlying = false;
      flyingA.style.display = 'none';
      flyingA.style.transition = 'none';
      lastA.style.visibility = 'visible';
      playSound('catch');
    };
  }

  setTimeout(() => {
    startAFlight();
    setInterval(() => {
      if (!aFlying) startAFlight();
    }, 15 * 60 * 1000);
  }, 10000);

  // Загрузка и API
  const loader = document.getElementById('loadingOverlay');
  function showLoader() { loader.classList.add('active'); }
  function hideLoader() { loader.classList.remove('active'); }

  async function loadAllData() {
    showLoader();
    try {
      const res = await fetch(`${API_URL}?action=readAll`);
      const json = await res.json();
      if (json.status === 'success') {
        for (const key of Object.keys(state)) {
          if (key !== 'avatar' && json.data[key]) state[key] = json.data[key];
        }
        if (!state.scheme.length) {
          state.scheme.push({
            id: 1, title: 'Артур Галкин',
            description: 'Основатель и Генеральный директор',
            type: 'founder', role: 'Основатель и Генеральный директор'
          });
        }
      } else {
        if (!state.scheme.length) {
          state.scheme.push({
            id: 1, title: 'Артур Галкин',
            description: 'Основатель и Генеральный директор',
            type: 'founder', role: 'Основатель и Генеральный директор'
          });
        }
      }
    } catch(e) {
      if (!state.scheme.length) {
        state.scheme.push({
          id: 1, title: 'Артур Галкин',
          description: 'Основатель и Генеральный директор',
          type: 'founder', role: 'Основатель и Генеральный директор'
        });
      }
    } finally {
      hideLoader();
    }
  }

  async function saveToCloud(sheet, params) {
    const qs = new URLSearchParams({ sheet, action: 'create', ...params }).toString();
    const res = await fetch(`${API_URL}?${qs}`);
    return res.json();
  }
  async function updateInCloud(sheet, id, params) {
    const qs = new URLSearchParams({ sheet, action: 'update', id, ...params }).toString();
    const res = await fetch(`${API_URL}?${qs}`);
    return res.json();
  }
  async function deleteFromCloud(sheet, id) {
    const qs = new URLSearchParams({ sheet, action: 'delete', id }).toString();
    const res = await fetch(`${API_URL}?${qs}`);
    return res.json();
  }

  async function createItem(sheet, params, pageId) {
    const tempId = Date.now();
    const newItem = { id: tempId, title: params.title || params.question || '', description: params.description || params.answer || '' };
    if (sheet === 'knowledge') newItem.q = params.question;
    state[sheet].push(newItem);
    render(pageId);
    try {
      const result = await saveToCloud(sheet, params);
      if (result.status === 'success') newItem.id = result.id;
      else { state[sheet] = state[sheet].filter(i => i.id !== tempId); render(pageId); alert('Ошибка сохранения'); }
    } catch(e) { state[sheet] = state[sheet].filter(i => i.id !== tempId); render(pageId); alert('Ошибка сети'); }
  }
  async function updateItem(sheet, id, params, pageId) {
    const index = state[sheet].findIndex(i => i.id == id || i.q == id);
    if (index === -1) return;
    const original = { ...state[sheet][index] };
    Object.assign(state[sheet][index], params);
    render(pageId);
    try {
      const result = await updateInCloud(sheet, id, params);
      if (result.status !== 'success') { state[sheet][index] = original; render(pageId); alert('Ошибка обновления'); }
    } catch(e) { state[sheet][index] = original; render(pageId); alert('Ошибка сети'); }
  }
  async function deleteItem(sheet, id, pageId) {
    const index = state[sheet].findIndex(i => i.id == id || i.q == id);
    if (index === -1) return;
    const removed = state[sheet].splice(index, 1)[0];
    render(pageId);
    try {
      const result = await deleteFromCloud(sheet, id);
      if (result.status !== 'success') { state[sheet].splice(index, 0, removed); render(pageId); alert('Ошибка удаления'); }
    } catch(e) { state[sheet].splice(index, 0, removed); render(pageId); alert('Ошибка сети'); }
  }

  // Модалки и рендер (как раньше, но с magic-pin)
  const modalOverlay = document.getElementById('modalOverlay');
  const modalContent = document.getElementById('modalContent');
  function showModal(html) {
    modalContent.innerHTML = html;
    modalOverlay.classList.add('active');
    const closeBtn = modalContent.querySelector('.modern-close');
    if (closeBtn) closeBtn.addEventListener('click', closeModal);
  }
  function closeModal() { modalOverlay.classList.remove('active'); }
  modalOverlay.addEventListener('click', e => { if (e.target === modalOverlay) closeModal(); });

  const pages = document.querySelectorAll('.nav-item');
  const mainContent = document.getElementById('mainContent');

  function card(item, key) {
    const title = item.title || item.text || item.q || '';
    const desc = item.desc || item.description || item.a || item.answer || '';
    return `<div class="card">
      <div style="display:flex; justify-content:space-between; align-items:start;">
        <div>
          <h3>${title}</h3>
          <p>${desc}</p>
          ${item.role ? `<p style="margin-top:8px; font-weight:500; color:#FFA500;">${item.role}</p>` : ''}
        </div>
        <div style="display:flex; gap:8px; align-items:center;">
          <button class="btn btn-edit edit-${key}" data-id="${item.id || item.q}">Ред.</button>
          <div class="magic-pin delete-${key}" data-id="${item.id || item.q}">🧷</div>
        </div>
      </div>
    </div>`;
  }

  function editableGrid(pageId, title, items, addLabel) {
    return `<div class="page active"><h2 class="page-title">${title}</h2><div class="grid">${items.map(i => card(i, pageId)).join('')}</div><button class="btn btn-primary" id="add${capitalize(pageId)}Btn">${addLabel}</button></div>`;
  }
  function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  function renderDashboard() { return editableGrid('dashboard', 'Обзор проектов', state.dashboard, 'Добавить карточку'); }
  function renderBacklog() { return editableGrid('backlog', 'Бэклог', state.backlog, 'Добавить задачу'); }
  function renderScheme() {
    const founder = state.scheme.filter(i => i.type === 'founder');
    const depts = state.scheme.filter(i => i.type === 'dept');
    return `<div class="page active">
      <h2 class="page-title">Структура компании</h2>
      <button class="btn btn-primary" id="addSchemeBtn" style="margin-bottom:24px;">Добавить отдел</button>
      <div style="display:flex; flex-wrap:wrap; gap:20px;">
        ${founder.map(i => `<div class="card" style="width:260px; background:linear-gradient(45deg,#FFD700,#FFA500); color:#1a1a1a; text-align:center;">
          <h3>${i.title}</h3><p>${i.role}</p>
          <div style="display:flex; gap:12px; justify-content:center; margin-top:12px;">
            <button class="btn btn-edit edit-scheme" data-id="${i.id}">Ред.</button>
            <div class="magic-pin delete-scheme" data-id="${i.id}">🧷</div>
          </div>
        </div>`).join('')}
        ${depts.map(i => `<div class="card" style="width:200px;">
          <h4>${i.title}</h4><p>${i.desc || i.description || ''}</p>
          <div style="display:flex; gap:12px; margin-top:12px;">
            <button class="btn btn-edit edit-scheme" data-id="${i.id}">Ред.</button>
            <div class="magic-pin delete-scheme" data-id="${i.id}">🧷</div>
          </div>
        </div>`).join('')}
      </div>
    </div>`;
  }
  function renderIdeas() { return editableGrid('ideas', 'Идеи', state.ideas, 'Добавить идею'); }
  function renderPrototypes() { return editableGrid('prototypes', 'Прототипы', state.prototypes, 'Добавить прототип'); }
  function renderHrdnk() { return editableGrid('hrdnk', 'HRDNK', state.hrdnk, 'Добавить задачу'); }
  function renderKnowledge() { return editableGrid('knowledge', 'База знаний', state.knowledge, 'Добавить знание'); }
  function renderSettings() {
    const soundStatus = soundEnabled ? 'Включены 🔊' : 'Выключены 🔇';
    return `<div class="page active">
      <h2 class="page-title">Настройки</h2>
      <div class="card">
        <h3>Аватар</h3>
        <div class="settings-avatar" style="background-image:url('${state.avatar}'); width:80px; height:80px; border-radius:40px; background-size:cover; margin-bottom:12px;"></div>
        <input type="file" id="avatarUpload" style="display:none;" accept="image/*">
        <button class="btn btn-primary" id="changeAvatarBtn">Загрузить фото</button>
      </div>
      <div class="card" style="display:flex; align-items:center; gap:16px;">
        <span>Звуки: ${soundStatus}</span>
        <button class="btn btn-primary" id="toggleSoundBtn">${soundEnabled ? 'Выкл' : 'Вкл'}</button>
      </div>
      <div class="card"><button class="btn" style="background:#EF9A9A;" id="resetDataBtn">Сбросить данные</button></div>
    </div>`;
  }

  function render(pageId) {
    let html;
    switch(pageId) {
      case 'dashboard': html = renderDashboard(); break;
      case 'backlog': html = renderBacklog(); break;
      case 'scheme': html = renderScheme(); break;
      case 'ideas': html = renderIdeas(); break;
      case 'prototypes': html = renderPrototypes(); break;
      case 'hrdnk': html = renderHrdnk(); break;
      case 'knowledge': html = renderKnowledge(); break;
      case 'settings': html = renderSettings(); break;
      default: html = renderDashboard();
    }
    mainContent.innerHTML = html;
    attachEvents(pageId);
  }

  // Отрыв волшебной булавки
  let draggingPin = null;
  let dragClone = null;
  let dragStartX = 0, dragStartY = 0;
  let dragMoved = false;

  function startDrag(e, el) {
    e.preventDefault();
    if (draggingPin) return;
    draggingPin = el;
    dragStartX = e.clientX;
    dragStartY = e.clientY;
    dragMoved = false;

    dragClone = el.cloneNode(true);
    dragClone.style.position = 'fixed';
    dragClone.style.zIndex = '9998';
    dragClone.style.pointerEvents = 'none';
    dragClone.style.left = e.clientX + 'px';
    dragClone.style.top = e.clientY + 'px';
    dragClone.style.opacity = '0.9';
    document.body.appendChild(dragClone);
    el.style.opacity = '0.3';

    document.addEventListener('mousemove', onDragMove);
    document.addEventListener('mouseup', onDragEnd);
  }
  function onDragMove(e) {
    if (!draggingPin) return;
    if (Math.abs(e.clientX - dragStartX) > 5 || Math.abs(e.clientY - dragStartY) > 5) dragMoved = true;
    if (dragClone) {
      dragClone.style.left = e.clientX + 'px';
      dragClone.style.top = e.clientY + 'px';
    }
  }
  function onDragEnd(e) {
    document.removeEventListener('mousemove', onDragMove);
    document.removeEventListener('mouseup', onDragEnd);
    if (dragClone) { dragClone.remove(); dragClone = null; }
    if (draggingPin) {
      draggingPin.style.opacity = '1';
      if (dragMoved) {
        playSound('tear');
        const id = draggingPin.dataset.id;
        const sheet = draggingPin.className.replace(/.*delete-(\w+).*/, '$1');
        showModal(`
          <button class="modern-close" style="position:absolute; top:14px; right:14px;"></button>
          <h2 style="color:#2E3B2E;">Оторвать этот листик?</h2>
          <div style="display:flex; gap:16px; margin-top:24px;">
            <button class="btn" style="background:linear-gradient(135deg,#FF8C00,#FFD700); color:white;" id="confirmTearYes">Да, оторвать</button>
            <button class="btn" style="background:linear-gradient(135deg,#A5D6A7,#FFB74D);" id="confirmTearNo">Нет, оставить</button>
          </div>
        `);
        document.getElementById('confirmTearYes').addEventListener('click', async () => { closeModal(); await deleteItem(sheet, id, getCurrentPage()); });
        document.getElementById('confirmTearNo').addEventListener('click', closeModal);
      }
      draggingPin = null;
    }
  }
  function getCurrentPage() {
    const active = document.querySelector('.nav-item.active');
    return active ? active.dataset.page : 'dashboard';
  }

  function attachEvents(pageId) {
    const keys = ['dashboard','backlog','scheme','ideas','prototypes','hrdnk','knowledge'];
    if (keys.includes(pageId)) {
      const key = pageId;
      const addBtn = document.getElementById(`add${capitalize(key)}Btn`);
      if (addBtn) {
        addBtn.addEventListener('click', () => {
          showModal(`<button class="modern-close" style="position:absolute; top:14px; right:14px;"></button><h3>Добавить</h3><input id="modalTitle" placeholder="Название"><br><textarea id="modalDesc" placeholder="Описание"></textarea><br><button class="btn btn-primary" id="saveModal">Сохранить</button>`);
          document.getElementById('saveModal').addEventListener('click', async () => {
            const title = document.getElementById('modalTitle').value.trim();
            if (!title) return;
            const desc = document.getElementById('modalDesc').value.trim();
            let params = { title };
            if (key === 'knowledge') params = { question: title, answer: desc };
            else if (key !== 'ideas') params.description = desc;
            closeModal();
            await createItem(key, params, pageId);
          });
        });
      }

      document.querySelectorAll(`.edit-${key}`).forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.dataset.id;
          let item = state[key].find(i => i.id == id || i.q == id);
          if (!item) item = state.scheme?.find(i => i.id == id);
          if (!item) return;
          const title = item.title || item.text || item.q || '';
          const desc = item.desc || item.description || item.a || item.answer || '';
          showModal(`<button class="modern-close" style="position:absolute; top:14px; right:14px;"></button><h3>Редактировать</h3><input id="editTitle" value="${title}"><br><textarea id="editDesc">${desc}</textarea><br><button class="btn btn-primary" id="updateModal">Сохранить</button>`);
          document.getElementById('updateModal').addEventListener('click', async () => {
            const newTitle = document.getElementById('editTitle').value.trim();
            if (!newTitle) return;
            const newDesc = document.getElementById('editDesc').value.trim();
            let params = { title: newTitle };
            if (key === 'knowledge') params = { question: newTitle, answer: newDesc };
            else if (key !== 'ideas') params.description = newDesc;
            closeModal();
            await updateItem(key, id, params, pageId);
          });
        });
      });

      document.querySelectorAll('.magic-pin').forEach(el => {
        el.addEventListener('mousedown', e => startDrag(e, el));
      });
    }
    if (pageId === 'settings') {
      document.getElementById('changeAvatarBtn')?.addEventListener('click', () => document.getElementById('avatarUpload').click());
      document.getElementById('avatarUpload')?.addEventListener('change', e => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => { state.avatar = reader.result; localStorage.setItem(STORAGE_AVATAR_KEY, reader.result); document.querySelector('.settings-avatar').style.backgroundImage = `url(${reader.result})`; };
        reader.readAsDataURL(file);
      });
      document.getElementById('toggleSoundBtn')?.addEventListener('click', () => { soundEnabled = !soundEnabled; localStorage.setItem(STORAGE_SOUND_KEY, soundEnabled); render('settings'); });
      document.getElementById('resetDataBtn')?.addEventListener('click', () => {
        showModal(`<button class="modern-close" style="position:absolute; top:14px; right:14px;"></button><h3>Сбросить все данные?</h3><button class="btn" style="background:#EF9A9A;" id="confirmReset">Да</button>`);
        document.getElementById('confirmReset').addEventListener('click', () => { localStorage.clear(); location.reload(); });
      });
    }
  }

  // Голосовой помощник (как раньше)
  const voiceBtn = document.getElementById('voiceBtn');
  const voiceIcon = document.getElementById('voiceIcon');
  const voiceText = document.getElementById('voiceText');
  const voiceWaves = document.getElementById('voiceWaves');
  let recognition, isListening = false;
  if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SpeechRecognition();
    recognition.lang = 'ru-RU';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;
    recognition.onstart = () => { isListening = true; voiceIcon.textContent = '🔴'; voiceText.textContent = 'Слушаю...'; voiceWaves.style.display = 'block'; playSound('magic'); };
    recognition.onend = () => { isListening = false; voiceIcon.textContent = '🎙️'; voiceText.textContent = 'Голосовой помощник'; voiceWaves.style.display = 'none'; };
    recognition.onresult = (event) => {
      const transcript = event.results[0][0].transcript.toLowerCase().trim();
      processVoiceCommand(transcript);
    };
    recognition.onerror = () => { voiceIcon.textContent = '🎙️'; voiceText.textContent = 'Ошибка, попробуйте снова'; setTimeout(() => { voiceText.textContent = 'Голосовой помощник'; }, 2000); };
    voiceBtn.addEventListener('click', () => { if (isListening) recognition.stop(); else recognition.start(); });
  } else voiceBtn.style.display = 'none';

  function processVoiceCommand(command) {
    const sectionMap = {
      'обзор': 'dashboard', 'бэклог': 'backlog', 'структура': 'scheme', 'идеи': 'ideas',
      'прототипы': 'prototypes', 'hrdnk': 'hrdnk', 'база знаний': 'knowledge', 'настройки': 'settings'
    };
    let matched = false;
    for (const [name, pageId] of Object.entries(sectionMap)) {
      if (command.includes(`открой ${name}`) || command.includes(`покажи ${name}`) || command.includes(`перейди в ${name}`)) {
        navigateTo(pageId);
        speak(`Открываю раздел ${name}`);
        matched = true; break;
      }
    }
    if (!matched && command.includes('добавить')) {
      const match = command.match(/добавить\s+(?:карточку|задачу|идею|прототип|знание)\s+(.+?)(?:\s+в\s+(.+))?$/);
      if (match) {
        const title = match[1].trim();
        const section = match[2] ? sectionMap[match[2].toLowerCase()] : getCurrentPage();
        if (section && state[section] !== undefined) {
          const params = { title };
          if (section === 'knowledge') params.question = title;
          createItem(section, params, section);
          speak(`Добавил "${title}" в раздел ${Object.keys(sectionMap).find(k => sectionMap[k] === section)}`);
          matched = true;
        }
      }
    }
    if (!matched && command.includes('удали')) {
      const match = command.match(/удали\s+(.+?)(?:\s+в\s+(.+))?$/);
      if (match) {
        const title = match[1].trim().toLowerCase();
        const section = match[2] ? sectionMap[match[2].toLowerCase()] : getCurrentPage();
        if (section && state[section]) {
          const item = state[section].find(i => (i.title || i.q || '').toLowerCase().includes(title));
          if (item) { deleteItem(section, item.id, section); speak(`Удалил "${item.title || item.q}"`); matched = true; }
          else { speak('Не нашёл такой карточки'); matched = true; }
        }
      }
    }
    if (!matched && (command.includes('шутка') || command.includes('анекдот'))) {
      const jokes = ['Почему программисты не ходят в лес? Там нет нормального интернета!','Кармический банк начисляет кармики даже за улыбку. Улыбнись!','Артур Галкин такой продуктивный, что даже буква А сбегает от него погулять.'];
      speak(jokes[Math.floor(Math.random() * jokes.length)]);
      matched = true;
    }
    if (!matched) speak('Я не понял команду. Попробуй: открой обзор, добавь задачу, удали, расскажи шутку.');
  }

  function speak(text) {
    if ('speechSynthesis' in window) {
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'ru-RU'; utterance.rate = 1.0; utterance.pitch = 1.1;
      window.speechSynthesis.speak(utterance);
    }
  }
  function navigateTo(pageId) {
    const target = document.querySelector(`.nav-item[data-page="${pageId}"]`);
    if (target) {
      document.querySelectorAll('.nav-item').forEach(p => p.classList.remove('active'));
      target.classList.add('active');
      render(pageId);
    }
  }

  pages.forEach(page => {
    page.addEventListener('click', () => {
      pages.forEach(p => p.classList.remove('active'));
      page.classList.add('active');
      render(page.dataset.page);
    });
  });

  (async function init() {
    await loadAllData();
    render('dashboard');
  })();
})();
</script>
</body>
</html>
