<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Предпросмотр: анимация перевода — Кармический банк</title>
<style>
  body { margin: 0; font-family: -apple-system, 'Inter', sans-serif; background: #f3f4f8; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  #replay { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); padding: 10px 22px; border-radius: 12px; background: #161b28; color: #fff; border: none; font-size: 14px; cursor: pointer; }

  @keyframes sealCardIn { 0% { opacity: 0; transform: scale(.94) translateY(8px) } 100% { opacity: 1; transform: scale(1) translateY(0) } }
  @keyframes ringDraw { from { stroke-dashoffset: 339.3; } to { stroke-dashoffset: 0; } }
  @keyframes amountIn { 0% { opacity: 0; transform: scale(.85); } 100% { opacity: 1; transform: scale(1); } }
  @keyframes labelIn { 0% { opacity: 0; transform: translateY(8px); } 100% { opacity: 1; transform: translateY(0); } }

  .overlay { position: fixed; inset: 0; background: rgba(15,23,42,0.32); backdrop-filter: blur(3px); display: flex; align-items: center; justify-content: center; }
  .card { width: 300px; background: #fff; border-radius: 24px; padding: 36px 32px 32px; border: 1px solid rgba(15,23,42,0.09); box-shadow: 0 16px 48px rgba(15,23,42,0.16); display: flex; flex-direction: column; align-items: center; gap: 22px; animation: sealCardIn .4s cubic-bezier(0.16,1,0.3,1) both; }
  .ringwrap { position: relative; width: 128px; height: 128px; }
  .ring { animation: ringDraw 0.95s cubic-bezier(0.65,0,0.35,1) .1s forwards; }
  .amount { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 400; color: #161b28; font-family: Georgia, 'Times New Roman', serif; letter-spacing: -0.5px; opacity: 0; animation: amountIn .4s cubic-bezier(0.16,1,0.3,1) 1.05s forwards; }
  .textwrap { text-align: center; opacity: 0; animation: labelIn .4s cubic-bezier(0.16,1,0.3,1) 1.35s forwards; }
  .label { font-size: 15px; font-weight: 500; color: #161b28; }
</style>
</head>
<body>

<div class="overlay" id="scene">
  <div class="card" id="card">
    <div class="ringwrap" id="ringwrap">
      <svg width="128" height="128" viewBox="0 0 128 128">
        <defs>
          <linearGradient id="ring-grad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#8a6208"/>
            <stop offset="100%" stop-color="#7c3aed"/>
          </linearGradient>
        </defs>
        <circle class="ring" id="ring" cx="64" cy="64" r="54" fill="none" stroke="url(#ring-grad)" stroke-width="2"
          stroke-dasharray="339.3" stroke-dashoffset="339.3" stroke-linecap="round" transform="rotate(-90 64 64)"/>
      </svg>
      <div class="amount" id="amount">-250</div>
    </div>
    <div class="textwrap" id="textwrap">
      <div class="label">Перевод выполнен</div>
    </div>
  </div>
</div>

<button id="replay" onclick="replay()">Проиграть ещё раз</button>

<script>
function replay() {
  const ids = ['card', 'ring', 'amount', 'textwrap'];
  ids.forEach(id => { document.getElementById(id).style.animation = 'none'; });
  void document.body.offsetHeight;
  ids.forEach(id => { document.getElementById(id).style.animation = ''; });
}
</script>
</body>
</html>
